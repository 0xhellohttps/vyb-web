  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>VYB × the agentic stack<\u002Ftitle>\n<style>\n  deck-stage:not(:defined) { visibility: hidden; }\n\n  :root {\n    --bg: #ffffff;\n    --ink: #1d1d1f;\n    --ink-2: #6e6e73;\n    --ink-3: #aeaeb2;\n    --line: rgba(0,0,0,0.12);\n    --line-soft: rgba(0,0,0,0.08);\n    --accent: #0071e3;\n    --green: #1f8a4c;\n    --mono: \"SF Mono\", ui-monospace, Menlo, Monaco, \"Cascadia Code\", \"Source Code Pro\", Consolas, monospace;\n    --system: -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Helvetica Neue\", sans-serif;\n    --vyb-grad: linear-gradient(150deg, #0071e3, #5e5ce6);\n  }\n\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  html, body { background: #000; }\n\n  deck-stage { display: block; }\n\n  section {\n    background: var(--bg);\n    color: var(--ink);\n    font-family: var(--mono);\n    overflow: hidden;\n  }\n\n  .slide { width: 100%; height: 100%; padding: 92px 120px; display: flex; flex-direction: column; position: relative; }\n\n  /* shared atoms */\n  .eyebrow { font-size: 24px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }\n  .slide-num { position: absolute; top: 92px; right: 120px; font-size: 24px; color: var(--ink-3); letter-spacing: 1px; }\n  .wordmark { font-family: var(--system); font-weight: 700; letter-spacing: -0.03em; }\n  .app-icon {\n    display: inline-flex; align-items: center; justify-content: center;\n    background: var(--vyb-grad); color: #fff; border-radius: 14px;\n    font-family: var(--system); font-weight: 700;\n    box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);\n  }\n  .footer-mark { position: absolute; left: 120px; bottom: 76px; display: flex; align-items: center; gap: 14px; font-family: var(--system); font-weight: 600; font-size: 26px; color: var(--ink); letter-spacing: -0.3px; }\n  .footer-mark .app-icon { width: 36px; height: 36px; border-radius: 9px; font-size: 21px; }\n  .foot-tag { position: absolute; right: 120px; bottom: 76px; font-size: 24px; color: var(--ink-3); letter-spacing: 1px; }\n\n  h1.big { font-size: 92px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; }\n  h2.title { font-size: 64px; font-weight: 600; line-height: 1.12; letter-spacing: -0.015em; }\n  .lede { font-size: 34px; line-height: 1.5; color: var(--ink-2); font-weight: 400; max-width: 30ch; }\n\n  /* ===== DARK slides ===== */\n  .slide.dark { background: #000; color: #f5f5f7; }\n  .slide.dark .lede { color: #a1a1a6; }\n  .slide.dark .slide-num { color: #48484a; }\n  .slide.dark .footer-mark { color: #f5f5f7; }\n  .slide.dark .foot-tag { color: #636366; }\n\n  /* ===== TITLE ===== */\n  .title-wrap { margin: auto 0; }\n  .title-logo { display: flex; align-items: center; gap: 28px; margin-bottom: 56px; }\n  .title-logo .app-icon { width: 104px; height: 104px; border-radius: 26px; font-size: 60px; }\n  .title-logo .wm { font-size: 76px; color: #f5f5f7; }\n  .title-wrap h1 { font-size: 88px; font-weight: 600; line-height: 1.08; letter-spacing: -0.02em; color: #f5f5f7; max-width: 22ch; }\n  .title-wrap .sub { margin-top: 40px; font-size: 34px; color: #a1a1a6; letter-spacing: .5px; }\n  .title-cursor { display: inline-block; width: 5px; height: 0.9em; background: var(--accent); margin-left: 10px; vertical-align: baseline; animation: blink 1s step-start infinite; }\n  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }\n\n  /* ===== generic header for content slides ===== */\n  .s-head { margin-bottom: 64px; }\n  .s-head .eyebrow { margin-bottom: 22px; display: block; }\n\n  /* problem grid */\n  .prob-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 80px; margin-top: 8px; }\n  .prob-item { padding: 42px 0; border-top: 1px solid var(--line); display: flex; gap: 32px; align-items: flex-start; }\n  .prob-x { font-size: 30px; color: #d11; flex-shrink: 0; padding-top: 4px; }\n  .prob-item h3 { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 12px; }\n  .prob-item p { font-size: 26px; line-height: 1.5; color: var(--ink-2); }\n\n  /* solution split */\n  .sol { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 96px; flex: 1; align-items: center; }\n  .sol h2 { font-size: 58px; font-weight: 600; line-height: 1.15; letter-spacing: -0.015em; }\n  .sol h2 em { font-style: normal; color: var(--accent); }\n  .sol .sol-sub { margin-top: 34px; font-size: 30px; line-height: 1.55; color: var(--ink-2); max-width: 26ch; }\n  .sol-points { margin-top: 44px; display: flex; flex-direction: column; gap: 20px; }\n  .sol-points .sp { display: flex; align-items: center; gap: 18px; font-size: 27px; }\n  .sol-points .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }\n\n  /* phone mock */\n  .phone { width: 392px; height: 812px; border-radius: 62px; padding: 13px; background: linear-gradient(160deg,#2a2a2e,#0c0c0e); box-shadow: 0 2px 4px rgba(0,0,0,.5) inset, 0 0 0 2px rgba(255,255,255,.05) inset, 0 50px 100px -30px rgba(0,0,0,.5); margin: 0 auto; flex-shrink: 0; }\n  .phone-screen { width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #fafafa; position: relative; }\n  .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 126px; height: 34px; border-radius: 999px; background: #0a0a0c; z-index: 5; }\n  .imsg { position: absolute; inset: 0; background: #fafafa; color: #1c1c1e; display: flex; flex-direction: column; font-family: var(--system); }\n  .imsg-head { padding: 62px 18px 14px; text-align: center; border-bottom: .5px solid rgba(0,0,0,.07); }\n  .imsg-avatar { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 8px; background: var(--vyb-grad); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 28px; }\n  .imsg-title { font-size: 19px; font-weight: 600; }\n  .imsg-sub { font-size: 14px; color: rgba(28,28,30,.5); margin-top: 2px; }\n  .imsg-body { flex: 1; padding: 18px 16px; display: flex; flex-direction: column; gap: 11px; }\n  .imsg-body > * { flex-shrink: 0; }\n  .bub { max-width: 82%; padding: 12px 16px; border-radius: 22px; font-size: 18px; line-height: 1.35; }\n  .bub-in { align-self: flex-start; background: #e9e9eb; border-bottom-left-radius: 6px; }\n  .bub-out { align-self: flex-end; background: #0a84ff; color: #fff; border-bottom-right-radius: 6px; }\n  .bub-name { font-size: 13px; color: rgba(28,28,30,.45); margin: 4px 0 -6px 16px; font-weight: 600; }\n  .prop { align-self: flex-start; width: 94%; background: #fff; border-radius: 20px; overflow: hidden; border: .5px solid rgba(0,0,0,.08); box-shadow: 0 10px 26px -10px rgba(20,16,40,.22); }\n  .prop-top { display: flex; align-items: center; gap: 10px; padding: 14px 16px 11px; border-bottom: .5px solid rgba(0,0,0,.06); }\n  .prop-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--vyb-grad); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; }\n  .prop-kicker { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(28,28,30,.45); }\n  .prop-h { font-size: 18px; font-weight: 650; margin-top: 2px; }\n  .prop-rows { padding: 12px 16px; display: flex; flex-direction: column; gap: 9px; }\n  .prop-row { display: flex; justify-content: space-between; font-size: 16px; }\n  .prop-row span { color: rgba(28,28,30,.5); }\n  .prop-row b { font-weight: 600; }\n  .prop-cta { display: flex; gap: 8px; padding: 0 16px 16px; }\n  .prop-confirm { flex: 1; height: 44px; border-radius: 12px; background: #34c759; color: #fff; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px; }\n  .prop-later { width: 92px; height: 44px; border-radius: 12px; background: #f0f0f2; color: rgba(28,28,30,.6); font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; }\n\n  /* steps */\n  .steps4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 48px; flex: 1; align-content: center; }\n  .stp { border-top: 3px solid var(--accent); padding-top: 30px; }\n  .stp .n { font-size: 30px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }\n  .stp h3 { font-size: 34px; font-weight: 600; margin: 22px 0 16px; letter-spacing: -0.01em; }\n  .stp p { font-size: 25px; line-height: 1.5; color: var(--ink-2); }\n  .stp .code { display: inline-block; margin-top: 18px; font-size: 22px; background: rgba(0,113,227,.08); color: var(--accent); padding: 4px 14px; border-radius: 8px; }\n\n  /* features columns */\n  .feat-cols { display: grid; grid-template-columns: repeat(3,1fr); gap: 72px; flex: 1; align-content: start; margin-top: 8px; }\n  .feat-col h4 { font-size: 24px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }\n  .feat-col ul { list-style: none; }\n  .feat-col li { padding: 22px 0; border-bottom: 1px solid var(--line-soft); }\n  .feat-col li b { display: block; font-size: 27px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 6px; }\n  .feat-col li span { font-size: 21px; line-height: 1.45; color: var(--ink-2); }\n\n  /* enterprise stats */\n  .stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 0; flex: 1; align-items: center; }\n  .stat { padding: 0 64px; }\n  .stat:not(:last-child) { border-right: 1px solid var(--line); }\n  .stat:first-child { padding-left: 0; }\n  .stat .big-num { font-size: 96px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }\n  .stat .big-num .u { font-size: 42px; color: var(--accent); }\n  .stat .lab { font-size: 25px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin: 26px 0 16p
