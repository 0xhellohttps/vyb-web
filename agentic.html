g: -0.01em; }\n  .ik-kv .v small { display: block; font-size: 18px; color: #8e8e93; margin-top: 4px; }\n  .slide:not(.dark) .ik-kv .r { border-color: var(--line-soft); }\n  .slide:not(.dark) .ik-kv .v { color: var(--ink); }\n  .slide:not(.dark) .ik-kv .v small { color: var(--ink-2); }\n\n  .ik-tag { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #ff9f0a; border: 1px solid rgba(255,159,10,.5); border-radius: 999px; padding: 5px 12px; }\n  .ik-act { font-size: 18px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #636366; margin-bottom: 26px; }\n  .slide:not(.dark) .ik-act { color: var(--ink-3); }\n\n  /* compact layer stack (agentic deck) */\n  .ik-compact .layer { padding: 14px 28px; grid-template-columns: 300px 1fr 380px; gap: 30px; }\n  .ik-compact .layer .lname { font-size: 25px; margin-top: 3px; }\n  .ik-compact .layer .lprod { font-size: 18px; }\n  .ik-compact .layer .lrev span { font-size: 16px; padding: 4px 11px; }\n  .ik-wide td:first-child { white-space: nowrap; font-weight: 600; }\n  .ik-wide td, .ik-wide th { padding-top: 13px; padding-bottom: 13px; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<script>\n  /* prevent first-paint flash: hide animatable content before the deck renders */\n  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {\n    document.body.classList.add('anim-ready');\n  }\n<\u002Fscript>\n\n<deck-stage width=\"1920\" height=\"1080\">\n\n  \n  <!-- 1 · COVER -->\n  <section data-label=\"Cover\">\n    <div class=\"slide dark\">\n      <div class=\"title-wrap\">\n        <div class=\"title-logo\">\n          <span class=\"app-icon\">v<\u002Fspan>\n          <span class=\"wm wordmark\">vyb<\u002Fspan>\n          <span style=\"font-size:52px;color:#48484a;font-weight:300;margin:0 6px;\">×<\u002Fspan>\n          <span class=\"wm\" style=\"font-size:64px;color:#f5f5f7;\">the agentic stack<\u002Fspan>\n        <\u002Fdiv>\n        <h1>Every agent protocol moves the money.<br>VYB knows what it's for.<span class=\"title-cursor\"><\u002Fspan><\u002Fh1>\n        <p class=\"sub\">VYB is the orchestration layer above the agentic-commerce protocols — MPP, x402, AP2, ACP, UCP, Amex ACE, Visa, Mastercard, Tempo, Swig, Squads. It decides what a live event needs, executes it on whichever rail fits, and settles it on one ledger.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"footer-mark\"><span class=\"app-icon\">v<\u002Fspan> vyb<\u002Fdiv>\n      <div class=\"foot-tag\">CONFIDENTIAL · AGENTIC COMMERCE · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 2 · THESIS -->\n  <section data-label=\"The thesis\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">01<\u002Fspan>\n      <div class=\"ik-state\" style=\"margin:0;\">\n        <span class=\"eyebrow\" style=\"display:block;margin-bottom:22px;\">The thesis<\u002Fspan>\n        <h1 style=\"max-width:18ch;\">Agentic commerce has rails now. It still has no <em>operator.<\u002Fem><\u002Fh1>\n        <p class=\"sub\" style=\"max-width:52ch;\">The protocols of 2025–26 solved how a machine pays, how a human authorizes it, and how it settles. None of them know what a show is. VYB sits between agentic software and payment solutions — and that in-between is the position.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ik-hchain\" style=\"margin-top:44px;\">\n        <span class=\"step acc\">VYB decides<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">VYB executes<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">VYB settles<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"foot-tag\">VYB · AGENTIC COMMERCE<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3 · THE MOMENT -->\n  <section data-label=\"The moment\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">02<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:24px;\">\n        <span class=\"eyebrow\">The moment<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Fourteen months. Eleven launches. The agent-payment stack arrived.<\u002Fh2>\n        <p class=\"ik-lede\">Every major network, the two largest AI labs' partners, and the leading stablecoin builders shipped an agent-payment primitive between April 2025 and June 2026.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ik-tl\" style=\"grid-template-columns:repeat(6,1fr);gap:14px 12px;\">\n        <div class=\"t on\"><div class=\"tw\">Apr 29 · 2025<\u002Fdiv><div class=\"tv\">Mastercard Agent Pay<\u002Fdiv><div class=\"td\">Agentic tokens; live for all US cardholders by November.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t on\"><div class=\"tw\">Apr 30 · 2025<\u002Fdiv><div class=\"tv\">Visa Intelligent Commerce<\u002Fdiv><div class=\"td\">Agent-ready cards; Trusted Agent Protocol follows Oct 14.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t on\"><div class=\"tw\">May · 2025<\u002Fdiv><div class=\"tv\">x402 · Coinbase<\u002Fdiv><div class=\"td\">HTTP 402 revived: pay-per-request in USDC.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t on\"><div class=\"tw\">Sep · 2025<\u002Fdiv><div class=\"tv\">AP2 · Google<\u002Fdiv><div class=\"td\">Signed mandates; 60+ partners incl. Mastercard, PayPal, Amex, Visa.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t on\"><div class=\"tw\">Sep 29 · 2025<\u002Fdiv><div class=\"tv\">ACP · OpenAI + Stripe<\u002Fdiv><div class=\"td\">Instant Checkout in ChatGPT; Shared Payment Tokens.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t on\"><div class=\"tw\">Jan 11 · 2026<\u002Fdiv><div class=\"tv\">UCP · Google + Shopify<\u002Fdiv><div class=\"td\">Discovery to checkout; Walmart, Target, Etsy, Visa, Mastercard, Amex.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t in\"><div class=\"tw\">Feb 11 · 2026<\u002Fdiv><div class=\"tv\">Coinbase Agentic Wallets<\u002Fdiv><div class=\"td\">Purpose-built agent wallets; TEE-isolated keys.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t in\"><div class=\"tw\">Mar 18 · 2026<\u002Fdiv><div class=\"tv\">Tempo mainnet + MPP<\u002Fdiv><div class=\"td\">Stripe + Paradigm's payments L1 and the Machine Payments Protocol, same day.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t in\"><div class=\"tw\">Apr 14 · 2026<\u002Fdiv><div class=\"tv\">Amex ACE<\u002Fdiv><div class=\"td\">Developer kit plus Agent Purchase Protection.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t in\"><div class=\"tw\">Apr 29 · 2026<\u002Fdiv><div class=\"tv\">MPP sessions<\u002Fdiv><div class=\"td\">Streaming micropayments under a pre-authorized limit.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t in\"><div class=\"tw\">Jun 10 · 2026<\u002Fdiv><div class=\"tv\">Mastercard AP4M<\u002Fdiv><div class=\"td\">Agent Pay for Machines: sub-cent, high-frequency.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t\"><div class=\"tw\">Throughout<\u002Fdiv><div class=\"tv\">Swig · Squads<\u002Fdiv><div class=\"td\">Programmable wallets and stablecoin accounts for agents on Solana.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:22px;\">Dates from each company's announcement or documentation.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 4 · THE STACK -->\n  <section data-label=\"The stack\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">03<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:22px;\">\n        <span class=\"eyebrow\">The stack<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:48px;\">Six layers. They stack, they don't collide. VYB sits on top.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"arch ik-compact\" style=\"gap:8px;\">\n        <div class=\"layer\" style=\"border-left-color:#5e5ce6;background:linear-gradient(90deg,rgba(94,92,230,0.08),rgba(94,92,230,0) 60%);\"><div><div class=\"lnum\" style=\"color:#5e5ce6;\">ABOVE THE PROTOCOLS<\u002Fdiv><div class=\"lname\">VYB orchestration<\u002Fdiv><\u002Fdiv><div class=\"lprod\">Understands the objective, decides what needs paying to whom and why, picks the rail, settles to one ledger — for live events.<\u002Fdiv><div class=\"lrev\"><span style=\"color:#5e5ce6;background:rgba(94,92,230,0.1);\">Intelligence<\u002Fspan><span style=\"color:#5e5ce6;background:rgba(94,92,230,0.1);\">Agents<\u002Fspan><span style=\"color:#5e5ce6;background:rgba(94,92,230,0.1);\">Commerce graph<\u002Fspan><span style=\"color:#5e5ce6;background:rgba(94,92,230,0.1);\">Payment router<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"layer\"><div><div class=\"lnum\">LAYER 1<\u002Fdiv><div class=\"lname\">Discovery &amp; checkout<\u002Fdiv><\u002Fdiv><div class=\"lprod\">How an agent finds a product, builds a cart, and completes a purchase with a merchant.<\u002Fdiv><div class=\"lrev\"><span>ACP · OpenAI + Stripe<\u002Fspan><span>UCP · Google + Shopify<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"layer\"><div><div class=\"lnum\">LAYER 2<\u002Fdiv><div class=\"lname\">Authorization &amp; trust<\u002Fdiv><\u002Fdiv><div class=\"lprod\">Proof that a human authorized the agent, with what limits, for what cart.<\u002Fdiv><div class=\"lrev\"><span>AP2 mandates<\u002Fspan><span>Amex ACE<\u002Fspan><span>Visa Trusted Agent<\u002Fspan><span>Mastercard Agent Pay<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"layer\"><div><div class=\"lnum\">LAYER 3<\u002Fdiv><div class=\"lname\">Machine payments<\u002Fdiv><\u002Fdiv><div class=\"lprod\">Agents paying services per request or per session, without a checkout page.<\u002Fdiv><div class=\"lrev\"><span>MPP · Stripe + Tempo<\u002Fspan><span>x402 · Coinbase<\u002Fspan><span>AP4M · Mastercard<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"layer\"><div><div class=\"lnum\">LAYER 4<\u002Fdiv><div class=\"lname\">Rails &amp; settlement<\u002Fdiv><\u002Fdiv><div class=\"lprod\">Where the value actually moves and finalizes.<\u002Fdiv><div class=\"lrev\"><span>Card networks<\u002Fspan><span>Stripe · ACH<\u002Fspan><span>Tempo<\u002Fspan><span>Stablecoins<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"layer\"><div><div class=\"lnum\">LAYER 5<\u002Fdiv><div class=\"lname\">Agent wallets &amp; policy<\u002Fdiv><\u002Fdiv><div class=\"lprod\">Accounts an agent can hold, with spend limits and roles enforced by code.<\u002Fdiv><div class=\"lrev\"><span>Swig<\u002Fspan><span>Squads<\u002Fspan><span>Coinbase Agentic Wallets<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"arch-note\">Every layer below VYB is a partner, not a competitor. VYB is demand for all of them.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 5 · THE GAP -->\n  <section data-label=\"What none of them know\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">04<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:28px;\">\n        <span class=\"eyebrow\">What none of them know<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">The protocols know how to pay. None of them know what a show is.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ba\" style=\"flex:1;min-height:0;\">\n        <div class=\"ba-col ba-today\">\n          <div class=\"ba-tag\">What the protocols solve<\u002Fdiv>\n          <div class=\"ba-h\" style=\"font-size:30px;\">The mechanics of an agent spending money.<\u002Fdiv>\n          <ul class=\"ba-check\" style=\"color:var(--ink);\">\n            <li style=\"color:var(--ink);\">A machine can request and pay for a resource<\u002Fli>\n            <li style=\"color:var(--ink);\">A network can verify a human said yes, and how much<\u002Fli>\n            <li style=\"color:var(--ink);\">A merchant can accept an agent's cart<\u002Fli>\n            <li style=\"color:var(--ink);\">Value can settle in under a second, in dollars or stablecoins<\u002Fli>\n          <\u002Ful>\n          <div class=\"ba-foot\" style=\"color:var(--ink-2);\">Horizontal. Every industry. No opinion about yours.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-col ba-vyb\">\n          <div class=\"ba-tag\">What they leave open<\u002Fdiv>\n          <div class=\"ba-h\" style=\"font-size:30px;\">What a venue owes, to whom, why, and when.<\u002Fdiv>\n          <ul class=\"ba-mess\" style=\"color:#f5f5f7;\">\n            <li style=\"color:#f5f5f7;\">Which artist to book, at what guarantee, on which date<\u002Fli>\n            <li style=\"color:#f5f5f7;\">Which vendor invoice matches which contract line<\u002Fli>\n            <li style=\"color:#f5f5f7;\">When the artist settlement is actually ready to pay<\u002Fli>\n            <li style=\"color:#f5f5f7;\">Whether the show made money — tonight, not at month-end<\u002Fli>\n          <\u002Ful>\n          <div class=\"ba-foot\">Vertical. Live events. This is VYB.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:22px;font-size:21px;\"><b>Build the orchestration layer above the protocols.<\u002Fb> VYB shouldn't care whether a transaction moves through Stripe, ACH, a card network, MPP, x402 or a stablecoin rail. It should determine the optimal mechanism.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 6 · ARCHITECTURE -->\n  <section data-label=\"The architecture\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">05<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:18px;\">\n        <span class=\"eyebrow\">The architecture<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Intelligence on top. Rails underneath. The router between.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.1fr 0.9fr;gap:44px;flex:1;align-items:center;\">\n        <div class=\"ik-chain\">\n          <div style=\"display:flex;gap:10px;\">\n            <div class=\"step\" style=\"min-width:275px;\">VYB Intelligence<small>understands the objective<\u002Fsmall><\u002Fdiv>\n            <div class=\"step\" style=\"min-width:275px;\">VYB Agents<small>one per seat · act on it<\u002Fsmall><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"arr\">↓<\u002Fdiv>\n          <div class=\"step ink\" style=\"min-width:560px;\">Commerce graph<small>artists · venues · vendors · pricing · history<\u002Fsmall><\u002Fdiv>\n          <div class=\"arr\">↓<\u002Fdiv>\n          <div class=\"step ink\" style=\"min-width:560px;\">Orchestration<small>objective → workflow → approvals<\u002Fsmall><\u002Fdiv>\n          <div class=\"arr\">↓<\u002Fdiv>\n          <div class=\"step acc\" style=\"min-width:560px;\">Payment router<small>rail · currency · authorization · reconciliation<\u002Fsmall><\u002Fdiv>\n          <div class=\"arr\">↓<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;\">\n            <div class=\"step\" style=\"min-width:130px;font-size:17px;\">Stripe · ACH<\u002Fdiv>\n            <div class=\"step\" style=\"min-width:130px;font-size:17px;\">Cards<\u002Fdiv>\n            <div class=\"step\" style=\"min-width:130px;font-size:17px;\">MPP · x402<\u002Fdiv>\n            <div class=\"step\" style=\"min-width:130px;font-size:17px;\">Stablecoin<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"arr\">↓<\u002Fdiv>\n          <div class=\"step ink\" style=\"min-width:560px;\">Settlement · one ledger<small>venues · artists · vendors · crews<\u002Fsmall><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;\">\n          <div class=\"ik-card\"><div class=\"h\">The rails are infrastructure<\u002Fdiv><div class=\"d\">Card networks, Stripe, ACH, MPP, x402 and stablecoin rails are all plumbing. VYB adds and swaps them behind one interface.<\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-card acc\"><div class=\"h\">The decision is the product<\u002Fdiv><div class=\"d\">What to buy, from whom, under which mandate, on which rail — decided by the agent, confirmed by a human at the edges, written to the ledger every time.<\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-card\"><div class=\"h\">The user sees a balance<\u002Fdiv><div class=\"d\">Balance, payments, approvals, settlement. Never a wallet address, a network name or a token. The machine economy is invisible to the human.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 7 · THE PAYMENT ROUTER -->\n  <section data-label=\"The payment router\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">06<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:20px;\">\n        <span class=\"eyebrow\">The payment router<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">The agent says \"pay $4,500.\" The router decides everything else.<\u002Fh2>\n        <p class=\"ik-lede\">Rail, settlement method, currency, authorization requirements, transaction economics, risk, reconciliation. The user never has to understand any of it.<\u002Fp>\n      <\u002Fdiv>\n      <table class=\"ik-table\" style=\"font-size:17px;\">\n        <tr><th>The payment<\u002Fth><th>Best rail today<\u002Fth><th>Protocol in play<\u002Fth><th>Why<\u002Fth><\u002Ftr>\n        <tr><td>Availability lookup · $0.25<\u002Ftd><td class=\"m\">Machine payment, per request<\u002Ftd><td><span class=\"st pd\">x402 · MPP<\u002Fspan><\u002Ftd><td class=\"m\">Cards and invoices can't do a quarter; HTTP 402 can.<\u002Ftd><\u002Ftr>\n        <tr><td>Routing &amp; audience data · streamed<\u002Ftd><td class=\"m\">Machine payment, per session<\u002Ftd><td><span class=\"st pd\">MPP sessions · AP4M<\u002Fspan><\u002Ftd><td class=\"m\">One authorized limit, many tiny charges, one reconciliation.<\u002Ftd><\u002Ftr>\n        <tr><td>Production supplies · $1,800<\u002Ftd><td class=\"m\">Card, agent-registered<\u002Ftd><td><span class=\"st pd\">ACE · Visa TAP · Agent Pay<\u002Fspan><\u002Ftd><td class=\"m\">Merchant already takes cards; the agent carries a scoped credential and purchase protection.<\u002Ftd><\u002Ftr>\n        <tr><td>Artist deposit · $6,000<\u002Ftd><td class=\"m\">ACH or wire<\u002Ftd><td><span class=\"st pd\">Stripe · bank<\u002Fspan><\u002Ftd><td class=\"m\">Counterparty wants dollars in a bank account; mandate requires approval above the cap.<\u002Ftd><\u002Ftr>\n        <tr><td>Cross-border crew payout · $2,750<\u002Ftd><td class=\"m\">Stablecoin settlement, presented as dollars<\u002Ftd><td><span class=\"st pd\">Tempo · Squads Grid<\u002Fspan><\u002Ftd><td class=\"m\">Sub-second finality, fees in stablecoins; the payee sees a balance, not a chain.<\u002Ftd><\u002Ftr>\n        <tr><td>Agent's own spending authority<\u002Ftd><td class=\"m\">Policy-enforced wallet<\u002Ftd><td><span class=\"st pd\">Swig · Coinbase Agentic Wallets<\u002Fspan><\u002Ftd><td class=\"m\">Spend limits, recurring caps and roles enforced by code, not by trust.<\u002Ftd><\u002Ftr>\n      <\u002Ftable>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Illustrative amounts. The point is the choice: every row is a different rail, and none of them is the product.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 8 · PRINCIPLES -->\n  <section data-label=\"Three principles\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">07<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:30px;\">\n        <span class=\"eyebrow\">Three principles<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Works for everyone, because it belongs to no one.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\">\n        <div class=\"ik-card acc\"><div class=\"h\">Rail-agnostic<\u002Fdiv><div class=\"d\">Stripe today. ACH, cards, MPP, x402 and stablecoin rails as workflows demand them. Every rail is an adapter behind the router; the ledger entry looks the same whichever one carried the money.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">Protocol-agnostic<\u002Fdiv><div class=\"d\">Mandates that can be exported in AP2's shape. Carts that can be handed to ACP or UCP. Agents that register with ACE and carry a Visa or Mastercard credential. VYB speaks whichever protocol the counterparty speaks.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">Invisible to the human<\u002Fdiv><div class=\"d\">The operator sees VYB Balance, approvals, payments and settlement. Never a wallet, a token, a network name or a transaction hash. The machine economy is plumbing.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"settle-bar\" style=\"margin-top:26px;\">\n        <div class=\"sb-mark\">v<\u002Fdiv>\n        <div><div class=\"sb-t\">Every protocol that wins makes VYB cheaper to run. None of them can replace what VYB knows.<\u002Fdiv><div class=\"sb-s\">The decision, the ledger and the commerce graph stay with VYB. The rails compete to carry the result.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 9 · MPP -->\n  <section data-label=\"MPP\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">08<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Protocol · Machine Payments Protocol<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">MPP — Stripe and Tempo's open standard for billing agents over HTTP.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\">\n        <div class=\"ik-card\"><div class=\"h\">What it is<\u002Fdiv><div class=\"d\">Released March 18, 2026. A server answers an agent's request with HTTP 402 and payment details; the agent authorizes, retries, and gets the resource plus a receipt. Covers price discovery, charges, subscriptions and reconciliation across stablecoins, cards and BNPL. The April 2026 <b style=\"color:#f5f5f7;\">sessions<\u002Fb> primitive lets an agent authorize a limit once and stream micropayments under it. 100+ services at launch, including Anthropic, OpenAI and Shopify; Visa, Lightspark and Cloudflare have extended it.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">Where VYB plugs in<\u002Fdiv><div class=\"d\">Two ways. As a <b style=\"color:#f5f5f7;\">client<\u002Fb>: the VYB agent pays for data, lookups and services mid-workflow under a machine-spend mandate — one session, many small charges, one line on the ledger. As a <b style=\"color:#f5f5f7;\">server<\u002Fb>: VYB's own intelligence — availability, routing, venue economics — becomes a resource other agents pay for over 402.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">In a show<\u002Fdiv><div class=\"d\">The booking agent opens a $40 MPP session and spends $0.04 here, $2 there — artist availability, routing math, audience data — while chasing a Saturday headliner. The operator sees one entry: \"Research · Saturday booking · $23.60.\"<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Source: stripe.com/blog/machine-payments-protocol · mpp.dev · docs.stripe.com/payments/machine/mpp<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10 · x402 -->\n  <section data-label=\"x402\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">09<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Protocol · x402<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">x402 — Coinbase's HTTP-native payment protocol, revived from status code 402.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\">\n        <div class=\"ik-card\"><div class=\"h\">What it is<\u002Fdiv><div class=\"d\">Released May 2025. A server returns 402 with payment requirements; the client pays in USDC on Base or Solana; a facilitator verifies and settles on-chain. Zero protocol fees. Governed by the x402 Foundation — Coinbase and Cloudflare founding, with Google, Visa, AWS, Circle, Anthropic and Vercel as core members. By March 2026: 119M+ transactions on Base, ~$600M annualized volume. Coinbase Agentic Wallets (February 2026) give agents gasless, TEE-isolated accounts to pay with.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">Where VYB plugs in<\u002Fdiv><div class=\"d\">The first machine rail on the roadmap: an x402 adapter behind the router, gated by a tight, auto-authorized, fully logged machine-spend category. VYB pays per request for the things a human could never invoice — API access, data, compute — and can charge for its own.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">In a show<\u002Fdiv><div class=\"d\">The venue agent needs a demographic pull on a Friday hip-hop bill. The data provider says <span style=\"font-family:var(--mono);color:#5ac8fa;\">402 · $0.25 · audience lookup<\u002Fspan>. The agent pays, reads, moves on. The operator's balance moved a quarter; the ledger knows why.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Source: coinbase.com/developer-platform · x402 Foundation · Coinbase Agentic Wallets announcement, Feb 11, 2026<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 11 · AP2 -->\n  <section data-label=\"AP2\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">10<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Protocol · Agent Payments Protocol<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">AP2 — Google's answer to \"did the human actually authorize this?\"<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\">\n        <div class=\"ik-card\"><div class=\"h\">What it is<\u002Fdiv><div class=\"d\">Announced September 2025 with 60+ companies, including Mastercard, PayPal, Coinbase, Visa and American Express. Three cryptographically signed <b style=\"color:#f5f5f7;\">mandates<\u002Fb> chain together: an Intent Mandate (the user delegates, with price limits and conditions), a Cart Mandate (a specific cart at a specific price), and a Payment Mandate (the credential the network sees). Works alongside A2A and MCP.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">Where VYB plugs in<\u002Fdiv><div class=\"d\">VYB's approval policy already has AP2's shape: a budget for the objective, caps per vendor and category, thresholds that require a human. VYB signs those as mandates at the confirm tap and exports them in AP2 form whenever a counterparty's agent, bank or network needs to verify authorization.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">In a show<\u002Fdiv><div class=\"d\">\"Book a Saturday headliner. Budget $25,000. Max $5,000 per vendor. Anything over $20,000 for the artist needs my approval.\" One signed intent. The agent operates inside it; the GM is asked exactly once — at the $20,000 line.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Source: cloud.google.com/blog · ap2-protocol.org<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 12 · ACP -->\n  <section data-label=\"ACP\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">11<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Protocol · Agentic Commerce Protocol<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">ACP — OpenAI and Stripe's open standard for agent-initiated checkout.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\">\n        <div class=\"ik-card\"><div class=\"h\">What it is<\u002Fdiv><div class=\"d\">Released September 29, 2025 under Apache 2.0; powers Instant Checkout in ChatGPT (Etsy on day one, then Shopify brands). The buyer picks a payment method and Stripe issues a <b style=\"color:#f5f5f7;\">Shared Payment Token<\u002Fb> scoped to one merchant and one cart total — the agent never sees the card. PayPal adopted it. Open-sourced under the Agentic AI Foundation in February 2026; the April 2026 spec covers checkout, delegation, cart, feed, orders and MCP.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">Where VYB plugs in<\u002Fdiv><div class=\"d\">On the buying side, a VYB agent can complete an ACP checkout with any merchant that supports it — production rentals, hospitality, travel — carrying a scoped token instead of a card on file. On the selling side, VYB-run events can expose tickets, merch and studio time as ACP-purchasable inventory to any agent.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">In a show<\u002Fdiv><div class=\"d\">The production agent orders backline from a rental house that runs ACP. Cart built, token issued for exactly $4,700, merchant charges it through its own processor. The order lands on the event ledger against the production line before the truck leaves.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Source: stripe.com/newsroom · agenticcommerce.dev · github.com/agentic-commerce-protocol<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 13 · UCP -->\n  <section data-label=\"UCP\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">12<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Protocol · Universal Commerce Protocol<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">UCP — Google and Shopify's protocol for the whole journey, discovery to post-purchase.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\">\n        <div class=\"ik-card\"><div class=\"h\">What it is<\u002Fdiv><div class=\"d\">Announced at NRF on January 11, 2026, endorsed by 20+ partners including Walmart, Target, Etsy, Wayfair, Stripe, Visa, Mastercard and American Express. Four stages: capability negotiation, product discovery, checkout, post-purchase handoff. Wired into Google's AI Mode in Search and the Gemini apps. March 2026 update added Cart, Catalog and Identity Linking; Mastercard has publicly backed it.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">Where VYB plugs in<\u002Fdiv><div class=\"d\">Discovery is where a live-events business is invisible today. UCP lets a VYB-run venue, festival or studio publish a catalog — dates, rooms, packages, merch — that Gemini and Search agents can find, negotiate and buy. VYB handles fulfillment and settlement behind the handoff.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">In a show<\u002Fdiv><div class=\"d\">A fan's agent asks Gemini for \"two tickets and parking for Saturday.\" The venue's UCP catalog answers; checkout completes in the chat; the order and the parking vendor's share land on the event ledger — settled to the lot operator on show night.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Source: developers.googleblog.com · shopify.engineering/UCP<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 14 · AMEX ACE -->\n  <section data-label=\"Amex ACE\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">13<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Protocol · American Express<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">ACE — Amex's Agentic Commerce Experiences developer kit, with purchase protection for agents.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\">\n        <div class=\"ik-card\"><div class=\"h\">What it is<\u002Fdiv><div class=\"d\">Launched April 14, 2026. Five components: Agent Registration, Account Enablement, Intent Intelligence, Payment Credentials and Cart Context — so both the human and the agent are authenticated and the cardmember's intent is captured. Single-use tokens and intent contracts enforce the transaction. Because Amex is issuer and network, it validates agent-led transactions end to end. <b style=\"color:#f5f5f7;\">Agent Purchase Protection<\u002Fb> backs cardmembers against charges caused by agent error — an industry first.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">Where VYB plugs in<\u002Fdiv><div class=\"d\">VYB registers its agents with ACE and passes cart context as event line items. Corporate Amex is already how a lot of production spend happens; ACE lets the VYB agent spend it with the cardholder's intent captured, the charge protected, and every purchase tagged to a show.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">In a show<\u002Fdiv><div class=\"d\">The tour manager's registered agent books crew hotels and ground transport on the company Amex — intent contract: \"Chicago run, 14 rooms, cap $9,000.\" If the agent errs, the cardmember is protected. If it doesn't, the ledger already reconciled it.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Source: americanexpress.com/en-us/company/agentic-commerce · americanexpress.io<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 15 · CARD NETWORKS -->\n  <section data-label=\"Visa &amp; Mastercard\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">14<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Protocol · the card networks<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Visa and Mastercard — agent identity and agentic tokens on the rails everyone already accepts.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\">\n        <div class=\"ik-card\"><div class=\"h\">What they are<\u002Fdiv><div class=\"d\"><b style=\"color:#f5f5f7;\">Mastercard Agent Pay<\u002Fb> — announced April 29, 2025; agentic tokens live for all US cardholders by November 2025; backing UCP; and <b style=\"color:#f5f5f7;\">AP4M<\u002Fb>, Agent Pay for Machines, launched June 10, 2026 for sub-cent, high-frequency machine payments. <b style=\"color:#f5f5f7;\">Visa Intelligent Commerce<\u002Fb> — announced April 30, 2025; the <b style=\"color:#f5f5f7;\">Trusted Agent Protocol<\u002Fb> (October 14, 2025) lets merchants verify an agent's identity. Both networks joined AP2 in September 2025; PayPal pays inside ChatGPT via ACP.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">Where VYB plugs in<\u002Fdiv><div class=\"d\">Most of a show's vendors take cards and nothing else. VYB's agents carry network-issued agentic credentials and present a Trusted Agent identity, so the merchant knows who is buying and the network knows who authorized it. The VYB Card — virtual cards in Apple Wallet, per-persona caps — rides the same rails.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">In a show<\u002Fdiv><div class=\"d\">Runner needs $340 of gaffer tape and batteries at 4 p.m. The hospitality agent pays with a scoped Mastercard token under its $500 day-of cap; the merchant sees a verified agent; the receipt lands on \"Production · consumables\" before the runner is back.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Source: Mastercard and Visa newsrooms; eco.com protocol explainers<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 16 · TEMPO -->\n  <section data-label=\"Tempo\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">15<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Rail · Tempo<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Tempo — Stripe and Paradigm's payments-first network, built for stablecoin settlement.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\">\n        <div class=\"ik-card\"><div class=\"h\">What it is<\u002Fdiv><div class=\"d\">A Layer 1 purpose-built for payments; mainnet March 18, 2026, the same day as MPP. About 0.6-second deterministic finality; fees paid in stablecoins through a built-in mechanism — no volatile native token. Design partners include Anthropic, Deutsche Bank, DoorDash, Mercury, Nubank, OpenAI, Revolut, Shopify, Standard Chartered and Visa. $500M Series A at a $5B valuation; Visa, Stripe and Zodia Custody as first external validators.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">Where VYB plugs in<\u002Fdiv><div class=\"d\">One adapter behind the payment router, chosen when speed and cost win: cross-border crew and vendor payouts, instant artist settlements, machine payments under MPP. The user authorizes dollars and the payee receives dollars; what carried them is the router's business.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">In a show<\u002Fdiv><div class=\"d\">A festival's lighting crew is Canadian. Settlement night, 1:40 a.m.: the router routes their $2,750 over Tempo, final in under a second, fees in cents. They see \"Paid · Friday · Main stage\" in their VYB Balance. Nobody typed a wallet address.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Source: tempo.xyz/blog/introducing-tempo · CoinDesk, Mar 18, 2026 · Fortune, Apr 21, 2026<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 17 · SWIG -->\n  <section data-label=\"Swig\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">16<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Wallets · Swig (onswig.com)<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Swig — smart wallet infrastructure for programmable money movement, built for agents.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\">\n        <div class=\"ik-card\"><div class=\"h\">What it is<\u002Fdiv><div class=\"d\">Self-custodial wallets on Solana with granular policies enforced on-chain, \"for fintechs, banks, and agents who operate at scale.\" Roles with scoped signers; spend limits per program, token and amount, including recurring caps; passkeys and multi-key signing; sponsored gas. Its own words on agents: \"Give agents scoped authority: what they can spend, where, and for how long.\"<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">Where VYB plugs in<\u002Fdiv><div class=\"d\">VYB's per-persona caps and autonomy ladder are policy today. Swig lets that policy be enforced by the account itself: a VYB agent holds a wallet whose role can only spend its category, up to its cap, for the length of the show. Trust earned per action, and the wallet can't exceed it even if the agent tries.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">In a show<\u002Fdiv><div class=\"d\">The merch agent gets a role: $3,500, merch vendors only, expires at load-out. Three vendor payouts go through; a fourth request over the cap is refused by the wallet before VYB even has to say no.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Source: onswig.com · build.onswig.com<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 18 · SQUADS -->\n  <section data-label=\"Squads\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">17<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Accounts · Squads (squads.xyz)<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Squads — products and APIs for the stablecoin economy, from the multisig standard on Solana.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\">\n        <div class=\"ik-card\"><div class=\"h\">What it is<\u002Fdiv><div class=\"d\">Squads Labs builds on open infrastructure and stablecoins to deliver financial services to businesses, individuals and developers. <b style=\"color:#f5f5f7;\">Grid<\u002Fb> — the stablecoin API for accounts, payments, cards and yield. <b style=\"color:#f5f5f7;\">Altitude<\u002Fb> — a global business account to save, earn and move money. <b style=\"color:#f5f5f7;\">Fuse<\u002Fb> — a personal finance app for stablecoins and tokenized assets. <b style=\"color:#f5f5f7;\">Squads Multisig<\u002Fb> — the platform for securing and managing Solana assets with multi-party control.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">Where VYB plugs in<\u002Fdiv><div class=\"d\">Grid as a rail adapter — accounts, payouts and cards from one API when a counterparty wants a stablecoin-native account. Multisig as the enforcement of VYB's high-value tier: a talent settlement above the ceiling needs two signatures in VYB, and the treasury account itself can require the same two keys.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">In a show<\u002Fdiv><div class=\"d\">A $600,000 artist balance clears VYB's policy with the finance lead and the principal signing in order. The event treasury sits in a multisig that mirrors those two signers, so the money can't move on one approval — in the product or on the account.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Source: squads.xyz · Squads Multisig docs<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 19 · WORKED EXAMPLE -->\n  <section data-label=\"One objective, every protocol\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">18<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:20px;\">\n        <span class=\"eyebrow\">One objective, every protocol<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">\"Book a headliner for Saturday. Budget $25,000. Optimize for ticket sales.\"<\u002Fh2>\n      <\u002Fdiv>\n      <table class=\"ik-table ik-wide\" style=\"font-size:18px;\">\n        <tr><th>Step<\u002Fth><th>What VYB does<\u002Fth><th>Protocol<\u002Fth><th>Rail<\u002Fth><th>Human<\u002Fth><\u002Ftr>\n        <tr><td>1 · Authorize<\u002Ftd><td class=\"m\">GM signs one intent: $25,000 total, $5,000 per vendor, artist over $20,000 needs approval.<\u002Ftd><td><span class=\"st pd\">AP2-shaped mandate<\u002Fspan><\u002Ftd><td class=\"m\">—<\u002Ftd><td><span class=\"st ok\">One tap<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td>2 · Research<\u002Ftd><td class=\"m\">Agent buys availability, routing math and audience data under a $40 machine-spend session.<\u002Ftd><td><span class=\"st pd\">MPP · x402<\u002Fspan><\u002Ftd><td class=\"m\">Machine payment<\u002Ftd><td><span class=\"st dm\">None<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td>3 · Negotiate<\u002Ftd><td class=\"m\">Venue agent and artist agent exchange offer, hold and terms; VYB is the protocol between them.<\u002Ftd><td><span class=\"st pd\">Agent-to-agent<\u002Fspan><\u002Ftd><td class=\"m\">—<\u002Ftd><td><span class=\"st dm\">None<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td>4 · Commit<\u002Ftd><td class=\"m\">$22,000 guarantee is over the line: the GM confirms. $6,600 deposit released.<\u002Ftd><td><span class=\"st pd\">Cart mandate<\u002Fspan><\u002Ftd><td class=\"m\">Stripe · ACH<\u002Ftd><td><span class=\"st ok\">One tap<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td>5 · Produce<\u002Ftd><td class=\"m\">Backline via an ACP checkout; hotels on the registered Amex agent; consumables on a scoped Mastercard token.<\u002Ftd><td><span class=\"st pd\">ACP · ACE · Agent Pay<\u002Fspan><\u002Ftd><td class=\"m\">Cards<\u002Ftd><td><span class=\"st dm\">None, within caps<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td>6 · Sell<\u002Ftd><td class=\"m\">Tickets and parking listed in the venue's catalog; fans' agents buy in Gemini and ChatGPT.<\u002Ftd><td><span class=\"st pd\">UCP · ACP<\u002Fspan><\u002Ftd><td class=\"m\">Cards<\u002Ftd><td><span class=\"st dm\">None<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td>7 · Settle<\u002Ftd><td class=\"m\">Show night: artist balance by wire; domestic crew by ACH; the Canadian lighting crew over a stablecoin rail — all as dollars.<\u002Ftd><td><span class=\"st pd\">Router policy<\u002Fspan><\u002Ftd><td class=\"m\">Wire · ACH · Tempo<\u002Ftd><td><span class=\"st wt\">Two signatures on the artist<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr class=\"tot\"><td>Ledger<\u002Ftd><td>Every step is an entry. Margin known before doors; reconciled at execution; the graph learns the show.<\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><\u002Ftr>\n      <\u002Ftable>\n      <p class=\"ik-foot\" style=\"margin-top:14px;\">Illustrative. Seven protocols, three rails, two human taps. The operator never chose any of them.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n  <section data-label=\"Trust\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">19<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:30px;\">\n        <span class=\"eyebrow\">Trust, by architecture<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:46px;\">Autonomy is earned per action. Money never graduates.<\u002Fh2>\n        <p style=\"font-size:24px;line-height:1.5;color:#c7c7cc;max-width:78ch;margin-top:14px;\">Per action-type, per team, a vyb climbs a permission ladder as its catches are confirmed. One kind of action is floored forever.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:18px;flex:1;align-content:center;\"><div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\"><div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">01 · Suggest<\u002Fdiv><div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">The catch, with evidence. Nothing moves.<\u002Fdiv><\u002Fdiv><div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\"><div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">02 · Approve required<\u002Fdiv><div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">The vyb proposes; a human taps. <b style=\"color:#f5f5f7;\">Every money-moving action lives here, permanently.<\u002Fb><\u002Fdiv><\u002Fdiv><div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\"><div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">03 · Auto, with revert<\u002Fdiv><div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">Calendar moves, follow-ups — inside a revert window.<\u002Fdiv><\u002Fdiv><div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\"><div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">04 · Auto<\u002Fdiv><div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">Earned per action type, per team. Audited like everything else.<\u002Fdiv><\u002Fdiv><\u002Fdiv><p style=\"font-size:19px;color:#a1a1a6;margin-top:24px;text-align:center;\">Scoped capabilities per seat · disclosure carries its permission across team boundaries · append-only audit · findings disclose their own blind spots.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n  <section data-label=\"The network\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">20<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:14px;\">\n        <span class=\"eyebrow\">The network<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:46px;\">Agents that transact with agents.<\u002Fh2>\n        <p style=\"font-size:24px;line-height:1.5;color:#c7c7cc;max-width:74ch;margin-top:14px;\">Every party runs a VYB agent — artist, venue, agency, vendor, sponsor, crew. They interface, negotiate &amp; settle directly with one another, with VYB as the protocol and rails underneath. Every new agent is a new counterpart for all the rest.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;align-items:center;justify-content:center;\">\n        <svg viewBox=\"0 0 1000 460\" style=\"width:100%;max-width:800px;height:auto;\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"vg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#0071e3\"><\u002Fstop><stop offset=\"1\" stop-color=\"#5e5ce6\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs><line x1=\"500\" y1=\"80\" x2=\"794\" y2=\"155\" stroke=\"rgba(255,255,255,0.10)\" stroke-width=\"1\"><\u002Fline><line x1=\"794\" y1=\"155\" x2=\"794\" y2=\"305\" stroke=\"rgba(255,255,255,0.10)\" stroke-width=\"1\"><\u002Fline><line x1=\"794\" y1=\"305\" x2=\"500\" y2=\"380\" stroke=\"rgba(255,255,255,0.10)\" stroke-width=\"1\"><\u002Fline><line x1=\"500\" y1=\"380\" x2=\"206\" y2=\"305\" stroke=\"rgba(255,255,255,0.10)\" stroke-width=\"1\"><\u002Fline><line x1=\"206\" y1=\"305\" x2=\"206\" y2=\"155\" stroke=\"rgba(255,255,255,0.10)\" stroke-width=\"1\"><\u002Fline><line x1=\"206\" y1=\"155\" x2=\"500\" y2=\"80\" stroke=\"rgba(255,255,255,0.10)\" stroke-width=\"1\"><\u002Fline><line x1=\"500\" y1=\"230\" x2=\"500\" y2=\"80\" stroke=\"rgba(0,113,227,0.55)\" stroke-width=\"1.5\"><\u002Fline><line x1=\"500\" y1=\"230\" x2=\"794\" y2=\"155\" stroke=\"rgba(0,113,227,0.55)\" stroke-width=\"1.5\"><\u002Fline><line x1=\"500\" y1=\"230\" x2=\"794\" y2=\"305\" stroke=\"rgba(0,113,227,0.55)\" stroke-width=\"1.5\"><\u002Fline><line x1=\"500\" y1=\"230\" x2=\"500\" y2=\"380\" stroke=\"rgba(0,113,227,0.55)\" stroke-width=\"1.5\"><\u002Fline><line x1=\"500\" y1=\"230\" x2=\"206\" y2=\"305\" stroke=\"rgba(0,113,227,0.55)\" stroke-width=\"1.5\"><\u002Fline><line x1=\"500\" y1=\"230\" x2=\"206\" y2=\"155\" stroke=\"rgba(0,113,227,0.55)\" stroke-width=\"1.5\"><\u002Fline><rect x=\"420\" y=\"51\" width=\"160\" height=\"58\" rx=\"14\" fill=\"#000\" stroke=\"rgba(255,255,255,0.22)\"><\u002Frect><text x=\"500\" y=\"78\" text-anchor=\"middle\" font-family=\"-apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"21\" font-weight=\"600\" fill=\"#f5f5f7\">Artist<\u002Ftext><text x=\"500\" y=\"97\" text-anchor=\"middle\" font-family=\"-apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"12\" fill=\"#8e8e93\">agent<\u002Ftext><rect x=\"714\" y=\"126\" width=\"160\" height=\"58\" rx=\"14\" fill=\"#000\" stroke=\"rgba(255,255,255,0.22)\"><\u002Frect><text x=\"794\" y=\"153\" text-anchor=\"middle\" font-family=\"-apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"21\" font-weight=\"600\" fill=\"#f5f5f7\">Venue<\u002Ftext><text x=\"794\" y=\"172\" text-anchor=\"middle\" font-family=\"-apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"12\" fill=\"#8e8e93\">agent<\u002Ftext><rect x=\"714\" y=\"276\" width=\"160\" height=\"58\" rx=\"14\" fill=\"#000\" stroke=\"rgba(255,255,255,0.22)\"><\u002Frect><text x=\"794\" y=\"303\" text-anchor=\"middle\" font-family=\"-apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"21\" font-weight=\"600\" fill=\"#f5f5f7\">Sponsor<\u002Ftext><text x=\"794\" y=\"322\" text-anchor=\"middle\" font-family=\"-apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"12\" fill=\"#8e8e93\">agent<\u002Ftext><rect x=\"420\" y=\"351\" width=\"160\" height=\"58\" rx=\"14\" fill=\"#000\" stroke=\"rgba(255,255,255,0.22)\"><\u002Frect><text x=\"500\" y=\"378\" text-anchor=\"middle\" font-family=\"-apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"21\" font-weight=\"600\" fill=\"#f5f5f7\">Crew<\u002Ftext><text x=\"500\" y=\"397\" text-anchor=\"middle\" font-family=\"-apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"12\" fill=\"#8e8e93\">agent<\u002Ftext><rect x=\"126\" y=\"276\" width=\"160\" height=\"58\" rx=\"14\" fill=\"#000\" stroke=\"rgba(255,255,255,0.22)\"><\u002Frect><text x=\"206\" y=\"303\" text-anchor=\"middle\" font-family=\"-apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"21\" font-weight=\"600\" fill=\"#f5f5f7\">Vendor<\u002Ftext><text x=\"206\" y=\"322\" text-anchor=\"middle\" font-family=\"-apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"12\" fill=\"#8e8e93\">agent<\u002Ftext><rect x=\"126\" y=\"126\" width=\"160\" height=\"58\" rx=\"14\" fill=\"#000\" stroke=\"rgba(255,255,255,0.22)\"><\u002Frect><text x=\"206\" y=\"153\" text-anchor=\"middle\" font-family=\"-apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"21\" font-weight=\"600\" fill=\"#f5f5f7\">Booking agency<\u002Ftext><text x=\"206\" y=\"172\" text-anchor=\"middle\" font-family=\"-apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"12\" fill=\"#8e8e93\">agent<\u002Ftext><circle cx=\"500\" cy=\"230\" r=\"48\" fill=\"url(#vg)\"><\u002Fcircle><text x=\"500\" y=\"238\" text-anchor=\"middle\" font-family=\"-apple-system, BlinkMacSystemFont, sans-serif\" font-size=\"24\" font-weight=\"700\" fill=\"#ffffff\">VYB<\u002Ftext><\u002Fsvg>\n      <\u002Fdiv>\n      <p style=\"text-align:center;font-size:17px;color:#8e8e93;margin-top:6px;\">Artist ⇄ Venue · Booking agency ⇄ Vendors · Tour ⇄ Travel — any party, any workflow, settled agent-to-agent.<\u002Fp>\n      <p style=\"text-align:center;font-size:16px;color:#8e8e93;margin-top:8px;\"><b style=\"color:#c7c7cc;\">Guardrails:<\u002Fb> scoped agent identity · explicit human confirm on every payment · VYB underwrites &amp; reserves the risk.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n  <section data-label=\"Above the rails\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">21<\u002Fspan>\n      <div class=\"vision-wrap\">\n        <span class=\"eyebrow\">The position<\u002Fspan>\n        <h1>We sit <em>above<\u002Fem> the rails.<\u002Fh1>\n        <div class=\"analogy\">\n          <div class=\"analogy-row stripe\">\n            <div class=\"who\">Processors<\u002Fdiv>\n            <div class=\"what\">Stripe, Adyen &amp; banks move the money underneath.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"analogy-row vyb\">\n            <div class=\"who\"><span class=\"app-icon\">v<\u002Fspan> vyb<\u002Fdiv>\n            <div class=\"what\">owns the <b>workflow, settlement logic, relationships &amp; financial data<\u002Fb> — where the defensibility and the value compound.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"rails-note\" style=\"margin-top:30px;font-size:18px;line-height:1.5;color:#8e8e93;max-width:820px;\">Managed on these rails today, a registered Payfac at scale — the take expands as we internalize the stack.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"foot-tag\">VYB · FINANCIAL OS<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n  <section data-label=\"The ledger\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">22<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:20px;\">\n        <span class=\"eyebrow\">The ledger<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:46px;\">Designed around money movement, not tables.<\u002Fh2>\n        <p style=\"font-size:24px;line-height:1.5;color:#c7c7cc;max-width:80ch;margin-top:14px;\">Every action in a venue is a financial event — a ticket, a beer, parking, a vendor payout, a refund, a chargeback. Each one becomes an immutable event in a stream, lands in a double-entry ledger, and feeds the agent layer.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.05fr 0.95fr;gap:40px;flex:1;align-items:center;\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;\">\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:580px;\">\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Ticket sold<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Beer sold<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Parking<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Vendor paid<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Artist paid<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Refund<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Chargeback<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Settlement<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:22px;color:#636366;line-height:1;\">↓<\u002Fdiv>\n          <div style=\"width:100%;max-width:560px;text-align:center;padding:14px 26px;border-radius:14px;border:1px solid rgba(255,255,255,0.14);\">\n            <div style=\"font-size:20px;font-weight:600;color:#f5f5f7;letter-spacing:-0.01em;\">Event stream<\u002Fdiv>\n            <div style=\"font-size:15px;color:#8e8e93;margin-top:3px;\">immutable · append-only · every financial action<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:22px;color:#636366;line-height:1;\">↓<\u002Fdiv>\n          <div style=\"width:100%;max-width:560px;text-align:center;padding:16px 26px;border-radius:14px;background:var(--vyb-grad);color:#fff;box-shadow:0 14px 40px -16px rgba(0,113,227,.5);\">\n            <div style=\"font-size:21px;font-weight:600;letter-spacing:-0.01em;\">VYB Unified Ledger<\u002Fdiv>\n            <div style=\"font-size:15px;opacity:.85;margin-top:3px;\">double-entry · the source of truth<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:22px;color:#636366;line-height:1;\">↓<\u002Fdiv>\n          <div style=\"width:100%;max-width:560px;text-align:center;padding:14px 26px;border-radius:14px;background:#1d1d1f;border:1px solid rgba(255,255,255,0.1);\">\n            <div style=\"font-size:20px;font-weight:600;color:#f5f5f7;letter-spacing:-0.01em;\">Agent intelligence layer<\u002Fdiv>\n            <div style=\"font-size:15px;color:#8e8e93;margin-top:3px;\">reconcile · forecast · detect risk · optimize<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px;\">\n            <div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Double-entry, automatically<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.5;color:#a1a1a6;\">Every transaction becomes accounting the moment it happens — books that are always closed.<\u002Fdiv>\n            <div style=\"margin-top:10px;font-size:15px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;color:#8e8e93;line-height:1.6;\">Beer sale · $12<br><span style=\"color:#5ac8fa;\">Debit&nbsp;&nbsp;Cash&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$12<\u002Fspan><br><span style=\"color:#5ac8fa;\">Credit&nbsp;Concession&nbsp;Rev&nbsp;&nbsp;&nbsp;$12<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid rgba(0,113,227,0.5);border-radius:16px;padding:20px;background:rgba(0,113,227,0.07);\">\n            <div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Agent memory<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.5;color:#a1a1a6;\">Agents read the ledger continuously and write back anomalies, forecasts &amp; risk — operational knowledge that compounds show over show.<\u002Fdiv>\n            <div style=\"margin-top:10px;font-size:15px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;color:#5ac8fa;line-height:1.6;\">{ \"finding\": \"Beer inventory likely to run<br>&nbsp;&nbsp;out by 9:15 PM\", \"confidence\": 0.92 }<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:16px;color:#8e8e93;margin-top:14px;\"><b style=\"color:#c7c7cc;\">The build order is the strategy:<\u002Fb> event-driven ledger first — agents, reconciliation, forecasting, payments &amp; financing all sit on top.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n  <section data-label=\"The data moat\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">23<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:18px;\">\n        <span class=\"eyebrow\">The data moat<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:46px;\">The settled truth no one else can see.<\u002Fh2>\n        <p style=\"font-size:24px;line-height:1.5;color:#c7c7cc;max-width:80ch;margin-top:14px;\">VYB sits at the settlement layer — the only vantage point that sees who actually got paid, how fast, who's reliable, and what a room really grosses. It accrues as exhaust, compounds with every show, and can't be backfilled by anyone who shows up later.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:20px;\">\n        <div style=\"font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1.4px;color:#8e8e93;margin-bottom:12px;\">What every show teaches VYB<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;\">\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Venue performance<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Concession revenue<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Merch sales<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Settlement timing<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Vendor reliability<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Crew payment history<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Sponsor performance<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Chargeback rates<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Staffing needs<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Payout structures<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Regional demand<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;\">\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Underwriting<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#a1a1a6;\">Advance capital against repayment behavior only VYB can see — the financing book, de-risked.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">VYB Score<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#a1a1a6;\">A credit bureau for live events: factual, settlement-derived — not reviews.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Intelligence<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#a1a1a6;\">Demand, routing &amp; benchmarks every operator pays for.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:16px;color:#8e8e93;margin-top:18px;\">The front end gets us in. The rails get us the volume. <b style=\"color:#c7c7cc;\">The data is why we can't be caught.<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ROADMAP -->\n  <section data-label=\"How we get there\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">24<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:24px;\">\n        <span class=\"eyebrow\">How we get there<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Decide, then execute, then settle. The build order is the thesis.<\u002Fh2>\n        <p class=\"ik-lede\">Each phase's gate is earned trust, not calendar time. The agent must prove it decides well before it may execute, and execute well before it may settle.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"phases\" style=\"grid-template-columns:repeat(5,1fr);\">\n        <div class=\"phase\" style=\"padding-right:28px;\"><div class=\"ptag\">Phase 0 <span class=\"now\">Now<\u002Fspan><\u002Fdiv><h3>The watching agent<\u002Fh3><p>A persistent agent in every seat: watches the operation, catches what's slipping, proposes the next move. Confirmed catches are the metric.<\u002Fp><\u002Fdiv>\n        <div class=\"phase\" style=\"padding:0 28px;\"><div class=\"ptag\">Phase 1<\u002Fdiv><h3>Payments behind the router<\u002Fh3><p>Payment Router with the first rail. Mandates with budgets, caps and thresholds signed at the confirm tap. VYB Balance.<\u002Fp><\u002Fdiv>\n        <div class=\"phase\" style=\"padding:0 28px;\"><div class=\"ptag\">Phase 2<\u002Fdiv><h3>Machine payments, multi-rail<\u002Fh3><p>x402 and MPP for the agent as buyer. AP2-shaped mandate export. ACH and card-network credentials pulled in by workflow need.<\u002Fp><\u002Fdiv>\n        <div class=\"phase\" style=\"padding:0 28px;\"><div class=\"ptag\">Phase 3<\u002Fdiv><h3>\"Handle it\"<\u002Fh3><p>One objective — talent, production, hospitality, marketing, ticketing, finance — compiled and executed end to end with humans at the mandate edges.<\u002Fp><\u002Fdiv>\n        <div class=\"phase\" style=\"padding-left:28px;\"><div class=\"ptag\">Phase 4<\u002Fdiv><h3>The network<\u002Fh3><p>Agents transacting with agents. The commerce graph as intelligence. An Agent API other protocols' agents pay into.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WHY EVERYONE WINS -->\n  <section data-label=\"Why it works for everyone\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">25<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:28px;\">\n        <span class=\"eyebrow\">Why it works for everyone<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">VYB is demand for every protocol, and dependent on none.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid4\" style=\"align-items:stretch;\">\n        <div class=\"ik-card\"><div class=\"h\">For the protocols<\u002Fdiv><div class=\"d\">A vertical that brings real, recurring, high-value transactions — guarantees, settlements, payouts — onto rails that mostly carry shopping carts today.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">For operators<\u002Fdiv><div class=\"d\">Never choose a protocol. Never see one. Tell VYB the objective; approve at the edges; read the ledger.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">For artists, crews, vendors<\u002Fdiv><div class=\"d\">Get paid on the rail you prefer — bank, card, or a stablecoin account presented as dollars — the night of the show, with the paperwork already done.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">For investors<\u002Fdiv><div class=\"d\">The rails are commoditizing in public, fast. VYB owns what doesn't commoditize: the decision, the ledger and the commerce graph of live events.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"settle-bar\" style=\"margin-top:26px;\">\n        <div class=\"sb-mark\">v<\u002Fdiv>\n        <div><div class=\"sb-t\">Above the rails, between agentic software and payment solutions.<\u002Fdiv><div class=\"sb-s\">That in-between is the position — and every launch on slide 3 makes it more valuable.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n  <section data-label=\"The founder\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">2 :18px;line-height:1.55;color:#a1a1a6;\">A software security firm dedicated to making the financial technology industry safer — security consulting for businesses, protocols and foundations, and building and securing software.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\">\n          <div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">Why it matters for VYB<\u002Fdiv>\n          <div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">A financial operating system is judged on whether the money is right, every time. Ledger integrity, programmable controls and threat modeling are the starting point, not an afterthought.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"footer-mark\"><span class=\"app-icon\">v<\u002Fspan> vyb<\u002Fdiv>\n      <div class=\"foot-tag\">blake@vybapp.io &nbsp;·&nbsp; 678-548-4012<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- CLOSING -->\n  <section data-label=\"Closing\">\n    <div class=\"slide dark\">\n      <div class=\"close-wrap\">\n        <h1>Every protocol moves the money.<br><em>VYB knows what it's for.<\u002Fem><\u002Fh1>\n        <p class=\"sub\">The financial operating system and intelligence layer for live events — rail-agnostic, protocol-agnostic, and invisible to the human.<\u002Fp>\n        <div class=\"close-cta\"><span class=\"app-icon\" style=\"width:42px;height:42px;border-radius:10px;font-size:24px;\">v<\u002Fspan> blake@vybapp.io · 678-548-4012<\u002Fdiv>\n        <p class=\"close-meta\">Blake Jackovitch · Founder, VYB<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"foot-tag\">VYB · AGENTIC COMMERCE · CONFIDENTIAL<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n<\u002Fdeck-stage>\n\n<script src=\"dc950efc-437d-4f7e-ab99-2af1f7a922f8\"><\u002Fscript>\n<script src=\"7f9fccf6-4903-4aaa-bdb0-4393992d6e65\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
