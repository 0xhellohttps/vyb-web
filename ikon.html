      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 22 · HUMAN CONTROL REMAINS -->\n  <section data-label=\"Human control remains\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">21<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:28px;\">\n        <span class=\"eyebrow\">Human control remains<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">VYB doesn't remove financial controls. It makes them programmable.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\">\n        <div class=\"ik-tier t1\"><div class=\"tk\">Low risk<\u002Fdiv><div class=\"tv\">Auto-approve<\u002Fdiv><div class=\"td\">Recurring, in-budget, known payee, documentation on file. The agent executes and reports.<\u002Fdiv><div class=\"tex\">e.g. hospitality vendor · $4,800 · 6th show together<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-tier t2\"><div class=\"tk\">Medium risk<\u002Fdiv><div class=\"tv\">One-click approval<\u002Fdiv><div class=\"td\">Within policy but material, new, or above a threshold. The agent prepares everything; one person confirms.<\u002Fdiv><div class=\"tex\">e.g. production change order · +$22,800<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-tier t3\"><div class=\"tk\">High value<\u002Fdiv><div class=\"tv\">Multi-party approval<\u002Fdiv><div class=\"td\">Talent settlements, venue balances, anything above the ceiling. Two or more signatures, in order, with a full trail.<\u002Fdiv><div class=\"tex\">e.g. artist balance · $600,000 · show night<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ik-card\" style=\"margin-top:18px;padding:16px 24px;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;\"><div class=\"h\" style=\"margin:0;font-size:18px;\">An example policy — the kind IKON would define on day one<\u002Fdiv><span class=\"ik-tag\">Illustrative<\u002Fspan><\u002Fdiv>\n        <table class=\"ik-table\" style=\"font-size:15.5px;\">\n          <tr><th>Rule<\u002Fth><th>Condition<\u002Fth><th>Approver(s)<\u002Fth><th>Rail &amp; timing<\u002Fth><th>Agent may<\u002Fth><\u002Ftr>\n          <tr><td>Recurring vendor<\u002Ftd><td class=\"m\">Known payee · within budget line · under $10,000<\u002Ftd><td class=\"m\">None required<\u002Ftd><td class=\"m\">ACH · next batch<\u002Ftd><td><span class=\"st ok\">Execute &amp; report<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td>Material spend<\u002Ftd><td class=\"m\">$10,000 – $100,000, or any new payee or change order<\u002Ftd><td class=\"m\">Finance lead<\u002Ftd><td class=\"m\">ACH or wire · on approval<\u002Ftd><td><span class=\"st pd\">Prepare · one confirmation<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td>Talent &amp; venue<\u002Ftd><td class=\"m\">Over $100,000, or any talent / venue settlement<\u002Ftd><td class=\"m\">Finance lead + principal, in order<\u002Ftd><td class=\"m\">Wire · after final count<\u002Ftd><td><span class=\"st wt\">Prepare · two signatures<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td>Out of policy<\u002Ftd><td class=\"m\">Over budget line, missing documentation, duplicate suspected<\u002Ftd><td class=\"m\">Blocked until resolved<\u002Ftd><td class=\"m\">—<\u002Ftd><td><span class=\"st dm\">Flag only<\u002Fspan><\u002Ftd><\u002Ftr>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div class=\"settle-bar\" style=\"margin-top:18px;\">\n        <div class=\"sb-mark\">v<\u002Fdiv>\n        <div><div class=\"sb-t\">IKON defines the rules. VYB executes within them.<\u002Fdiv><div class=\"sb-s\">Thresholds, signers, rails and timing are policy objects — changed by IKON, enforced by the system, never bypassed by the agent.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 23 · WHY PAYMENTS MATTER -->\n  <section data-label=\"Why payments matter\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">22<\u002Fspan>\n      <div class=\"ik-act\">Act V · The money<\u002Fdiv>\n      <div class=\"ik-state\" style=\"margin:0;\">\n        <h1 style=\"max-width:16ch;\">Software creates workflow.<br><em>Payments create economics.<\u002Fem><\u002Fh1>\n        <p class=\"sub\">Every time money moves through VYB, the transaction itself carries the value. That turns VYB from software revenue into software + payments + financial infrastructure.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ik-hchain\" style=\"margin-top:44px;\">\n        <span class=\"step dim\">SaaS revenue<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">Software + payments + financial infrastructure<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 24 · VYB PAYMENT LAYER -->\n  <section data-label=\"The payment layer\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">23<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:22px;\">\n        <span class=\"eyebrow\">The VYB payment layer<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:52px;\">Start on existing rails. Own more of the stack over time.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:56px;flex:1;align-items:center;\">\n        <div class=\"ik-chain\">\n          <div class=\"step acc\" style=\"min-width:520px;\">VYB<small>orchestration · policy · ledger<\u002Fsmall><\u002Fdiv>\n          <div class=\"arr\">↓<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;\">\n            <div class=\"step\" style=\"min-width:165px;\">Card &amp; PSP<small>processor partners<\u002Fsmall><\u002Fdiv>\n            <div class=\"step\" style=\"min-width:165px;\">Banks<small>wire · ACH · RTP<\u002Fsmall><\u002Fdiv>\n            <div class=\"step\" style=\"min-width:165px;\">Payout rails<small>domestic · cross-border<\u002Fsmall><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"arr\">↓<\u002Fdiv>\n          <div class=\"step ink\" style=\"min-width:520px;\">Counterparty<small>artist · venue · vendor · staff<\u002Fsmall><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <div class=\"ik-card\"><div class=\"h\">Day one: orchestration<\u002Fdiv><div class=\"d\">VYB decides and instructs; established processors and banks move the funds. Nothing about IKON's banking relationships has to change to start.<\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-card\"><div class=\"h\">Every payment, one ledger<\u002Fdiv><div class=\"d\">Whichever rail carries it, the transaction lands as the same kind of entry — so reconciliation is automatic regardless of how the money moved.<\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-card acc\"><div class=\"h\">Over time: VYB owns more of the stack<\u002Fdiv><div class=\"d\">As volume grows, VYB moves from instructing rails to operating them — capturing more of the economics and shortening settlement for everyone on the network.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 25 · THE PAYFAC EVOLUTION -->\n  <section data-label=\"The PayFac evolution\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">24<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:30px;\">\n        <span class=\"eyebrow\">The evolution<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Don't lead with payment facilitation. Lead with the operating system.<\u002Fh2>\n        <p class=\"ik-lede\">Facilitation becomes the underlying infrastructure that lets VYB capture more economics as volume grows — it's the consequence of the operating system, not the pitch.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"phases\" style=\"grid-template-columns:repeat(4,1fr);\">\n        <div class=\"phase\" style=\"padding:0 34px 0 0;\"><div class=\"ptag\">Phase 1 <span class=\"now\">Start<\u002Fspan><\u002Fdiv><h3 style=\"color:#f5f5f7;\">Payment orchestration<\u002Fh3><p style=\"color:#a1a1a6;\">VYB instructs existing rails. IKON's banks and processors stay in place.<\u002Fp><\u002Fdiv>\n        <div class=\"phase\" style=\"padding:0 34px;border-color:rgba(255,255,255,0.14);\"><div class=\"ptag\">Phase 2<\u002Fdiv><h3 style=\"color:#f5f5f7;\">Payment facilitation<\u002Fh3><p style=\"color:#a1a1a6;\">VYB takes on merchant-of-record scope where it shortens settlement and lowers cost.<\u002Fp><\u002Fdiv>\n        <div class=\"phase\" style=\"padding:0 34px;border-color:rgba(255,255,255,0.14);\"><div class=\"ptag\">Phase 3<\u002Fdiv><h3 style=\"color:#f5f5f7;\">VYB financial network<\u002Fh3><p style=\"color:#a1a1a6;\">Counterparties settle with each other on-network — artist to venue, promoter to vendor — without leaving the ledger.<\u002Fp><\u002Fdiv>\n        <div class=\"phase\" style=\"padding:0 0 0 34px;border-color:rgba(255,255,255,0.14);\"><div class=\"ptag\">Phase 4<\u002Fdiv><h3 style=\"color:#f5f5f7;\">Embedded financial services<\u002Fh3><p style=\"color:#a1a1a6;\">Working capital against confirmed obligations, instant payouts, treasury — offered where the data already justifies them.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 26 · THE IKON FLYWHEEL -->\n  <section data-label=\"The IKON flywheel\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">25<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:10px;\">\n        <span class=\"eyebrow\">The IKON flywheel<\u002Fspan>\n        <h2 class=\"title\">Every event makes the next one cheaper to run.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"fly-stage\">\n        <div class=\"fly-ring\">\n          <svg viewBox=\"0 0 640 640\" aria-hidden=\"true\">\n            <defs><marker id=\"ikfa\" markerWidth=\"10\" markerHeight=\"10\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#0071e3\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n            <circle cx=\"320\" cy=\"320\" r=\"232\" fill=\"none\" stroke=\"rgba(0,0,0,0.08)\" stroke-width=\"1.5\"><\u002Fcircle>\n            <path d=\"M 320 88 A 232 232 0 1 1 250 99\" fill=\"none\" stroke=\"#0071e3\" stroke-width=\"2.5\" stroke-linecap=\"round\" marker-end=\"url(#ikfa)\" stroke-dasharray=\"10 10\" opacity=\"0.85\"><\u002Fpath>\n          <\u002Fsvg>\n          <div class=\"fly-center\"><div class=\"t\">The VYB<br>network effect<\u002Fdiv><div class=\"s\">Compounds with every show IKON runs.<\u002Fdiv><\u002Fdiv>\n          <div class=\"fly-node\" style=\"left:50%;top:13.5%;\"><div class=\"b\">1<\u002Fdiv><div class=\"l\">More events<\u002Fdiv><\u002Fdiv>\n          <div class=\"fly-node\" style=\"left:84%;top:31.5%;\"><div class=\"b\">2<\u002Fdiv><div class=\"l\">More transactions &amp;<br>counterparties<\u002Fdiv><\u002Fdiv>\n          <div class=\"fly-node\" style=\"left:84%;top:68.5%;\"><div class=\"b\">3<\u002Fdiv><div class=\"l\">More financial data<\u002Fdiv><\u002Fdiv>\n          <div class=\"fly-node\" style=\"left:50%;top:86.5%;\"><div class=\"b\">4<\u002Fdiv><div class=\"l\">Better intelligence<\u002Fdiv><\u002Fdiv>\n          <div class=\"fly-node\" style=\"left:16%;top:68.5%;\"><div class=\"b\">5<\u002Fdiv><div class=\"l\">More automation<\u002Fdiv><\u002Fdiv>\n          <div class=\"fly-node\" style=\"left:16%;top:31.5%;\"><div class=\"b\">6<\u002Fdiv><div class=\"l\">Lower operating cost<br>per event<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 27 · IKON IS NOT JUST A CUSTOMER -->\n  <section data-label=\"IKON as a network node\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">26<\u002Fspan>\n      <div class=\"ik-act\">Act VI · IKON as a network<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:0.9fr 1.1fr;gap:40px;flex:1;align-items:center;\">\n        <div>\n          <span class=\"eyebrow\" style=\"display:block;margin-bottom:22px;\">IKON is not just a customer<\u002Fspan>\n          <h2 class=\"title\" style=\"font-size:54px;color:#f5f5f7;\">IKON can become a network node.<\u002Fh2>\n          <p style=\"font-size:23px;line-height:1.5;color:#c7c7cc;margin-top:22px;max-width:34ch;\">Every event introduces VYB to everyone IKON pays and everyone who pays IKON. Each of them is onboarded to receive — and each of them runs shows of their own.<\u002Fp>\n          <p style=\"font-size:23px;line-height:1.5;color:#f5f5f7;margin-top:22px;max-width:34ch;font-weight:600;\">IKON becomes an acquisition engine for the VYB network.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ik-map\">\n          <svg viewBox=\"0 0 640 640\" aria-hidden=\"true\">\n            <g stroke=\"rgba(255,255,255,0.22)\" stroke-width=\"1.5\">\n              <line x1=\"320\" y1=\"320\" x2=\"320\" y2=\"70\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"497\" y2=\"143\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"570\" y2=\"320\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"497\" y2=\"497\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"320\" y2=\"570\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"143\" y2=\"497\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"70\" y2=\"320\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"143\" y2=\"143\"><\u002Fline>\n            <\u002Fg>\n          <\u002Fsvg>\n          <div class=\"hub\"><div class=\"m\">IKON<\u002Fdiv><div class=\"s\">on VYB<\u002Fdiv><\u002Fdiv>\n          <div class=\"nd acc\" style=\"left:50%;top:11%;\">Artists<\u002Fdiv>\n          <div class=\"nd\" style=\"left:77.7%;top:22.3%;\">Managers<\u002Fdiv>\n          <div class=\"nd\" style=\"left:89%;top:50%;\">Agencies<\u002Fdiv>\n          <div class=\"nd acc\" style=\"left:77.7%;top:77.7%;\">Venues<\u002Fdiv>\n          <div class=\"nd\" style=\"left:50%;top:89%;\">Production<\u002Fdiv>\n          <div class=\"nd acc\" style=\"left:22.3%;top:77.7%;\">Vendors<\u002Fdiv>\n          <div class=\"nd\" style=\"left:11%;top:50%;\">Sponsors<\u002Fdiv>\n          <div class=\"nd dim\" style=\"left:22.3%;top:22.3%;\">Other promoters<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 28 · THE ARTIST FLYWHEEL -->\n  <section data-label=\"The artist flywheel\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">27<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:30px;\">\n        <span class=\"eyebrow\">The artist flywheel<\u002Fspan>\n        <h2 class=\"title\">An IKON event introduces an artist to VYB. The artist keeps it.<\u002Fh2>\n        <p class=\"ik-lede\">The artist's team was paid through VYB, saw the settlement in real time, and has a verified profile on the network. Every show after that is easier to run on VYB than off it.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ik-hchain\" style=\"margin-bottom:30px;\">\n        <span class=\"step acc\">IKON show<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">Artist on VYB<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">Other shows<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">Touring<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">Studios<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">Vendors &amp; management<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">Settlements, everywhere<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-content:start;flex:0 0 auto;\">\n        <div class=\"ik-card\"><div class=\"h\">Same ledger, more shows<\u002Fdiv><div class=\"d\">The artist's next promoter is settling into a team already on VYB — the path of least resistance is to settle on-network too.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">Same agent, every seat<\u002Fdiv><div class=\"d\">The artist's manager gets the same operator IKON has: what's owed, what's paid, what's next — across every promoter, not just IKON.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">The artist becomes a node<\u002Fdiv><div class=\"d\">Every counterparty the artist brings — studios, crews, merch, management — is one more relationship the network already knows how to settle.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ik-card\" style=\"margin-top:22px;padding:22px 26px;display:grid;grid-template-columns:0.9fr 1.1fr;gap:30px;align-items:center;\">\n        <div><div class=\"h\" style=\"font-size:22px;\">The Artist Financial Passport<\u002Fdiv><div class=\"d\">What the artist's team keeps after the IKON show: a continuously developing profile of their career economics — every show, tour, merch run, sponsorship and license resolved into one picture they own.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-chips\"><span class=\"ik-chip\" style=\"font-size:17px;padding:9px 16px;\">Live performance<\u002Fspan><span class=\"ik-chip\" style=\"font-size:17px;padding:9px 16px;\">Touring &amp; routing<\u002Fspan><span class=\"ik-chip\" style=\"font-size:17px;padding:9px 16px;\">Merchandise<\u002Fspan><span class=\"ik-chip\" style=\"font-size:17px;padding:9px 16px;\">Sponsorship<\u002Fspan><span class=\"ik-chip\" style=\"font-size:17px;padding:9px 16px;\">Licensing<\u002Fspan><span class=\"ik-chip\" style=\"font-size:17px;padding:9px 16px;\">Cash flow<\u002Fspan><span class=\"ik-chip\" style=\"font-size:17px;padding:9px 16px;\">Settlement timing<\u002Fspan><span class=\"ik-chip on\" style=\"font-size:17px;padding:9px 16px;\">Market profitability<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\">Operators get the control center. Artists get the passport. <b>Both run on the same ledger.<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 29 · THE VENUE FLYWHEEL -->\n  <section data-label=\"The venue flywheel\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">28<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">The venue flywheel<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">The same thing happens with venues.<\u002Fh2>\n        <p class=\"ik-lede\">A venue settled on VYB for an IKON show hosts other promoters. Those promoters run other events. Those events have artists. Those artists have studios.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ik-chain\" style=\"flex:1;justify-content:center;\">\n        <div class=\"step acc\" style=\"min-width:480px;\">IKON<small>settles the venue on VYB<\u002Fsmall><\u002Fdiv>\n        <div class=\"arr\">↓<\u002Fdiv>\n        <div class=\"step\" style=\"min-width:480px;\">Venue<small>now a verified node · 70+ venues in IKON's footprint<\u002Fsmall><\u002Fdiv>\n        <div class=\"arr\">↓<\u002Fdiv>\n        <div class=\"step\" style=\"min-width:480px;\">Other promoters<small>settle with the venue on-network<\u002Fsmall><\u002Fdiv>\n        <div class=\"arr\">↓<\u002Fdiv>\n        <div class=\"step\" style=\"min-width:480px;\">Other events<small>each with its own artists, vendors, crews<\u002Fsmall><\u002Fdiv>\n        <div class=\"arr\">↓<\u002Fdiv>\n        <div class=\"step ink\" style=\"min-width:480px;\">Artists → studios → management<small>the graph keeps extending<\u002Fsmall><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"text-align:center;font-size:22px;\"><b>The network compounds.<\u002Fb> IKON's venue count is from IKON's public materials.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 30 · THE STUDIO CONNECTION -->\n  <section data-label=\"The studio connection\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">29<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:30px;\">\n        <span class=\"eyebrow\">The studio connection<\u002Fspan>\n        <h2 class=\"title\">Artists don't exist only on show day.<\u002Fh2>\n        <p class=\"ik-lede\">This is central to VYB's broader strategy. The artist's economic lifecycle runs well beyond the concert — and VYB is built to follow it.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ik-hchain\" style=\"justify-content:center;margin:20px 0 34px;\">\n        <span class=\"step\">Studio<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">Creation<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">Management<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">Promotion<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">Touring<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">Settlement<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"ik-grid2\" style=\"align-content:start;flex:0 0 auto;\">\n        <div class=\"ik-card\"><div class=\"h\">IKON is where VYB meets the artist at the highest-stakes moment<\u002Fdiv><div class=\"d\">Show night settlement is the transaction the artist's team cares most about. Getting it right, visibly, earns the rest of the lifecycle.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">VYB follows the artist through the entire lifecycle<\u002Fdiv><div class=\"d\">Sessions, releases, campaigns, tours — every phase has counterparties, obligations and settlements. One ledger for the artist, from the studio to the stadium.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-3);margin:26px 0 12px;\">What each phase settles<\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-content:start;flex:0 0 auto;gap:14px;\">\n        <div class=\"ik-tile\"><div class=\"k\">Studio &amp; creation<\u002Fdiv><div class=\"v\" style=\"font-size:24px;\">Sessions · engineers · producers<\u002Fdiv><div class=\"s\">Room bookings, session fees, producer points and splits — obligations between the artist, the studio and collaborators.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-tile\"><div class=\"k\">Management &amp; promotion<\u002Fdiv><div class=\"v\" style=\"font-size:24px;\">Commissions · campaigns · vendors<\u002Fdiv><div class=\"s\">Management commission computed from settled income; campaign spend and creative vendors approved against a budget.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-tile\"><div class=\"k\">Touring &amp; settlement<\u002Fdiv><div class=\"v\" style=\"font-size:24px;\">Guarantees · backend · crews<\u002Fdiv><div class=\"s\">The IKON show: guarantee, backend, crew payroll and merch — where the artist's ledger and the promoter's ledger meet.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 31 · KLTRE -->\n  <section data-label=\"KLTRE\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">30<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">KLTRE<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Creative infrastructure becomes financial infrastructure.<\u002Fh2>\n        <p class=\"ik-lede\">IKON's flagship Las Vegas venue is a recurring operational environment — not a one-night event. That makes it a second, continuous entry point for VYB.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:44px;flex:1;align-items:center;\">\n        <div>\n          <div style=\"font-size:15px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#8e8e93;margin-bottom:14px;\">A creative campus involves<\u002Fdiv>\n          <div class=\"ik-chips\">\n            <span class=\"ik-chip\">Artists<\u002Fspan><span class=\"ik-chip\">Engineers<\u002Fspan><span class=\"ik-chip\">Producers<\u002Fspan><span class=\"ik-chip\">Photographers<\u002Fspan><span class=\"ik-chip\">Videographers<\u002Fspan><span class=\"ik-chip\">Sessions<\u002Fspan><span class=\"ik-chip\">Bookings<\u002Fspan><span class=\"ik-chip\">Productions<\u002Fspan><span class=\"ik-chip\">Events<\u002Fspan><span class=\"ik-chip\">Vendors<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;\">\n          <div class=\"ik-card\"><div class=\"h\">Recurring, not episodic<\u002Fdiv><div class=\"d\">Sessions, bookings and in-house productions create obligations every week. VYB runs them the same way it runs a show — with far more repetitions to learn from.<\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-card acc\"><div class=\"h\">The studio-to-stage graph, in one building<\u002Fdiv><div class=\"d\">An artist who records at KLTRE and headlines an IKON show is already on the network for both. The lifecycle thesis becomes observable in one place.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\">KLTRE is described in IKON's public materials as its flagship venue in Las Vegas.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 32 · WHAT WE PROPOSE -->\n  <section data-label=\"What we propose\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">31<\u002Fspan>\n      <div class=\"ik-act\">Act VII · The strategic partnership<\u002Fdiv>\n      <div class=\"ik-state\" style=\"margin:0;\">\n        <h1>Start with <em>one event.<\u002Fem><\u002Fh1>\n        <p class=\"sub\">Not a massive transformation. Not replacing every system on day one. Build a VYB-powered financial layer around one live IKON event — then expand.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;margin-top:44px;flex-wrap:wrap;\">\n        <span class=\"ik-chip x\">No rip-and-replace<\u002Fspan><span class=\"ik-chip x\">No change to banking relationships<\u002Fspan><span class=\"ik-chip on\">One show · one ledger · one settlement<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 33 · PHASE I -->\n  <section data-label=\"Phase I\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">32<\u002Fspan>\n      <div class=\"ik-phase-head\"><div class=\"pn\">I<\u002Fdiv><div><span class=\"eyebrow\" style=\"display:block;margin-bottom:10px;\">Phase I<\u002Fspan><h2 class=\"title\" style=\"font-size:52px;\">Event financial control center.<\u002Fh2><\u002Fdiv><\u002Fdiv>\n      <p class=\"ik-lede\" style=\"margin-top:6px;\">VYB integrates with IKON's existing systems and builds the financial object for one event. Nothing moves yet — everything becomes visible.<\u002Fp>\n      <div class=\"ik-chips\" style=\"margin-top:30px;\">\n        <span class=\"ik-chip\">Event creation<\u002Fspan><span class=\"ik-chip\">Counterparties<\u002Fspan><span class=\"ik-chip\">Obligations<\u002Fspan><span class=\"ik-chip\">Invoices<\u002Fspan><span class=\"ik-chip\">Approvals<\u002Fspan><span class=\"ik-chip\">Payments (tracked)<\u002Fspan><span class=\"ik-chip\">Settlement (tracked)<\u002Fspan><span class=\"ik-chip\">Reconciliation<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"ik-scope\">\n        <div class=\"sc\"><div class=\"sk\">Integrates with · read-only<\u002Fdiv><ul><li><b>Ticketing<\u002Fb> settlement reports for the pilot event<\u002Fli><li><b>Accounting<\u002Fb> chart of accounts and vendor master<\u002Fli><li><b>Bank<\u002Fb> statements for reconciliation<\u002Fli><li><b>Contracts<\u002Fb> — deal memo, venue agreement, vendor POs<\u002Fli><\u002Ful><\u002Fdiv>\n        <div class=\"sc\"><div class=\"sk\">What IKON's team does<\u002Fdiv><ul><li>Names one pilot event and one finance owner<\u002Fli><li>Shares contracts and the event budget<\u002Fli><li>Approves in VYB alongside the current process — nothing is switched off<\u002Fli><li>Roughly one to two hours a week<\u002Fli><\u002Ful><\u002Fdiv>\n        <div class=\"sc\"><div class=\"sk\">Proposed measure of success<\u002Fdiv><ul><li>Every obligation on the event visible in the ledger before show night<\u002Fli><li>Ledger margin matches IKON's own close within an agreed tolerance<\u002Fli><li>Zero payments missed, none duplicated<\u002Fli><li>IKON's team prefers the ledger to the spreadsheet<\u002Fli><\u002Ful><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ik-goal\"><div class=\"gm\">v<\u002Fdiv><div><div class=\"gt\">Goal: create one financial truth.<\u002Fdiv><div class=\"gs\">The event ledger from slide 16, live, for a real IKON show — with IKON's team reading it alongside their current process.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ik-track\"><span class=\"on\"><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 34 · PHASE II -->\n  <section data-label=\"Phase II\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">33<\u002Fspan>\n      <div class=\"ik-phase-head\"><div class=\"pn\">II<\u002Fdiv><div><span class=\"eyebrow\" style=\"display:block;margin-bottom:10px;\">Phase II<\u002Fspan><h2 class=\"title\" style=\"font-size:52px;\">Payment orchestration.<\u002Fh2><\u002Fdiv><\u002Fdiv>\n      <p class=\"ik-lede\" style=\"margin-top:6px;\">Expand VYB's role from seeing the money to moving it — on IKON's existing rails, under IKON's approval policy.<\u002Fp>\n      <div class=\"ik-chips\" style=\"margin-top:30px;\">\n        <span class=\"ik-chip\">Vendor payments<\u002Fspan><span class=\"ik-chip\">Artist settlements<\u002Fspan><span class=\"ik-chip\">Event expenses<\u002Fspan><span class=\"ik-chip\">Recurring payments<\u002Fspan><span class=\"ik-chip\">Payment routing<\u002Fspan><span class=\"ik-chip\">Reconciliation — automatic<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"ik-scope\">\n        <div class=\"sc\"><div class=\"sk\">Adds · payment initiation<\u002Fdiv><ul><li><b>Bank<\u002Fb> connection for ACH and wire initiation from IKON's existing accounts<\u002Fli><li><b>Payee onboarding<\u002Fb> — identity, tax form, payout details, collected once<\u002Fli><li><b>Approval policy<\u002Fb> configured by IKON (slide 21)<\u002Fli><li>Remittance and status shared with every payee<\u002Fli><\u002Ful><\u002Fdiv>\n        <div class=\"sc\"><div class=\"sk\">What IKON's team does<\u002Fdiv><ul><li>Defines thresholds and signers<\u002Fli><li>Moves vendor and labor payments for the pilot events onto VYB first<\u002Fli><li>Then artist and venue settlements, once the policy has run clean<\u002Fli><li>Keeps the existing bank; nothing re-papers<\u002Fli><\u002Ful><\u002Fdiv>\n        <div class=\"sc\"><div class=\"sk\">Proposed measure of success<\u002Fdiv><ul><li>Share of event obligations paid through VYB, rising event over event<\u002Fli><li>Days from invoice to payment, falling<\u002Fli><li>Reconciliation done at execution — no month-end matching<\u002Fli><li>Vendor status inquiries drop to near zero<\u002Fli><\u002Ful><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ik-goal\"><div class=\"gm\">v<\u002Fdiv><div><div class=\"gt\">Goal: move money through the operating layer.<\u002Fdiv><div class=\"gs\">Every payment lands as a ledger entry the moment it executes. The post-event tail starts shrinking.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ik-track\"><span class=\"on\"><\u002Fspan><span class=\"on\"><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 35 · PHASE III -->\n  <section data-label=\"Phase III\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">34<\u002Fspan>\n      <div class=\"ik-phase-head\"><div class=\"pn\">III<\u002Fdiv><div><span class=\"eyebrow\" style=\"display:block;margin-bottom:10px;\">Phase III<\u002Fspan><h2 class=\"title\" style=\"font-size:52px;\">Intelligent event operator.<\u002Fh2><\u002Fdiv><\u002Fdiv>\n      <p class=\"ik-lede\" style=\"margin-top:6px;\">Deploy VYB agents across IKON's open events. They watch continuously and bring decisions to the people who own them.<\u002Fp>\n      <div class=\"ik-chips\" style=\"margin-top:30px;\">\n        <span class=\"ik-chip\">Revenue<\u002Fspan><span class=\"ik-chip\">Expenses<\u002Fspan><span class=\"ik-chip\">Obligations<\u002Fspan><span class=\"ik-chip\">Exceptions<\u002Fspan><span class=\"ik-chip\">Settlements<\u002Fspan><span class=\"ik-chip\">Cash flow across the calendar<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"ik-scope\">\n        <div class=\"sc\"><div class=\"sk\">Adds · the agent layer<\u002Fdiv><ul><li><b>Watchers<\u002Fb> on every open event: due dates, budget lines, cash position, exceptions<\u002Fli><li><b>Conversational access<\u002Fb> for IKON's finance, production and leadership seats<\u002Fli><li><b>Autonomy ladder<\u002Fb> — suggest → draft → execute within policy → execute &amp; report<\u002Fli><li>Every agent starts at suggest; policy moves it up<\u002Fli><\u002Ful><\u002Fdiv>\n        <div class=\"sc\"><div class=\"sk\">What IKON's team does<\u002Fdiv><ul><li>Reviews the daily \"what needs my attention\" brief<\u002Fli><li>Raises autonomy per workflow as trust is earned — vendors first, talent last<\u002Fli><li>Asks the business instead of building reports<\u002Fli><li>Extends VYB across the full calendar, not only pilot events<\u002Fli><\u002Ful><\u002Fdiv>\n        <div class=\"sc\"><div class=\"sk\">Proposed measure of success<\u002Fdiv><ul><li>Exceptions caught before their due date, not after<\u002Fli><li>Hours of finance time per event, falling<\u002Fli><li>Share of obligations executed without a manual step<\u002Fli><li>Forecast margin vs. closed margin, converging<\u002Fli><\u002Ful><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ik-goal\"><div class=\"gm\">v<\u002Fdiv><div><div class=\"gt\">Goal: turn financial operations from reactive to autonomous.<\u002Fdiv><div class=\"gs\">Low-risk actions execute on policy. Everything else arrives prepared, with one confirmation to go.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ik-track\"><span class=\"on\"><\u002Fspan><span class=\"on\"><\u002Fspan><span class=\"on\"><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 36 · PHASE IV -->\n  <section data-label=\"Phase IV\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">35<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:1fr 0.9fr;gap:40px;flex:1;align-items:center;\">\n        <div>\n          <div class=\"ik-phase-head\"><div class=\"pn\">IV<\u002Fdiv><div><span class=\"eyebrow\" style=\"display:block;margin-bottom:10px;\">Phase IV<\u002Fspan><h2 class=\"title\" style=\"font-size:52px;color:#f5f5f7;\">The IKON financial network.<\u002Fh2><\u002Fdiv><\u002Fdiv>\n          <p class=\"ik-lede\" style=\"margin-top:6px;max-width:44ch;\">Connect IKON's counterparties to each other on-network. The result: an interconnected live-commerce economy running through VYB.<\u002Fp>\n          <div class=\"ik-goal\" style=\"margin-top:30px;\"><div class=\"gm\">v<\u002Fdiv><div><div class=\"gt\">Goal: every relationship settles on one layer.<\u002Fdiv><div class=\"gs\">Artists, venues, vendors, studios, production, sponsors, other promoters.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-track\"><span class=\"on\"><\u002Fspan><span class=\"on\"><\u002Fspan><span class=\"on\"><\u002Fspan><span class=\"on\"><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ik-map\" style=\"width:560px;height:560px;\">\n          <svg viewBox=\"0 0 640 640\" aria-hidden=\"true\">\n            <g stroke=\"rgba(0,113,227,0.55)\" stroke-width=\"1.5\">\n              <line x1=\"320\" y1=\"320\" x2=\"320\" y2=\"70\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"497\" y2=\"143\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"570\" y2=\"320\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"497\" y2=\"497\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"320\" y2=\"570\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"143\" y2=\"497\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"70\" y2=\"320\"><\u002Fline><line x1=\"320\" y1=\"320\" x2=\"143\" y2=\"143\"><\u002Fline>\n            <\u002Fg>\n            <g stroke=\"rgba(255,255,255,0.16)\" stroke-width=\"1.2\" stroke-dasharray=\"6 6\">\n              <line x1=\"320\" y1=\"70\" x2=\"497\" y2=\"143\"><\u002Fline><line x1=\"497\" y1=\"143\" x2=\"570\" y2=\"320\"><\u002Fline><line x1=\"570\" y1=\"320\" x2=\"497\" y2=\"497\"><\u002Fline><line x1=\"497\" y1=\"497\" x2=\"320\" y2=\"570\"><\u002Fline><line x1=\"320\" y1=\"570\" x2=\"143\" y2=\"497\"><\u002Fline><line x1=\"143\" y1=\"497\" x2=\"70\" y2=\"320\"><\u002Fline><line x1=\"70\" y1=\"320\" x2=\"143\" y2=\"143\"><\u002Fline><line x1=\"143\" y1=\"143\" x2=\"320\" y2=\"70\"><\u002Fline>\n              <line x1=\"320\" y1=\"70\" x2=\"320\" y2=\"570\"><\u002Fline><line x1=\"70\" y1=\"320\" x2=\"570\" y2=\"320\"><\u002Fline>\n            <\u002Fg>\n          <\u002Fsvg>\n          <div class=\"hub\"><div class=\"m\">IKON<\u002Fdiv><div class=\"s\">network<\u002Fdiv><\u002Fdiv>\n          <div class=\"nd acc\" style=\"left:50%;top:11%;\">Artists<\u002Fdiv>\n          <div class=\"nd acc\" style=\"left:77.7%;top:22.3%;\">Venues<\u002Fdiv>\n          <div class=\"nd acc\" style=\"left:89%;top:50%;\">Vendors<\u002Fdiv>\n          <div class=\"nd acc\" style=\"left:77.7%;top:77.7%;\">Studios<\u002Fdiv>\n          <div class=\"nd acc\" style=\"left:50%;top:89%;\">Production<\u002Fdiv>\n          <div class=\"nd acc\" style=\"left:22.3%;top:77.7%;\">Sponsors<\u002Fdiv>\n          <div class=\"nd acc\" style=\"left:11%;top:50%;\">Promoters<\u002Fdiv>\n          <div class=\"nd acc\" style=\"left:22.3%;top:22.3%;\">KLTRE<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 37 · WHAT IKON GETS -->\n  <section data-label=\"What IKON gets\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">36<\u002Fspan>\n      <div class=\"ik-act\">Act VIII · The business case<\u002Fdiv>\n      <div class=\"s-head\" style=\"margin-bottom:20px;\">\n        <span class=\"eyebrow\">What IKON gets<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:52px;\">One operating layer across the financial lifecycle.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-kv\" style=\"flex:1;justify-content:center;\">\n        <div class=\"r\"><div class=\"k\">Operationally<\u002Fdiv><div class=\"v\">Less administrative work.<small>The post-event tail is handled by the system, not the team.<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n        <div class=\"r\"><div class=\"k\">Financially<\u002Fdiv><div class=\"v\">Faster settlement and better visibility.<small>Artists, venues and vendors paid on terms — with cash position known at every hour.<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n        <div class=\"r\"><div class=\"k\">Strategically<\u002Fdiv><div class=\"v\">A real-time understanding of event economics.<small>Margin by show, by market, by artist — live, not at month-end close.<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n        <div class=\"r\"><div class=\"k\">Organizationally<\u002Fdiv><div class=\"v\">One system connecting front, middle and back office.<small>Booking, production and finance read the same object.<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n        <div class=\"r\"><div class=\"k\">Artistically<\u002Fdiv><div class=\"v\">More time focused on producing experiences.<small>Which is the business IKON is actually in.<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 38 · WHAT VYB GETS -->\n  <section data-label=\"What VYB gets\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">37<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:28px;\">\n        <span class=\"eyebrow\">What VYB gets<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:52px;\">A high-value deployment environment.<\u002Fh2>\n        <p class=\"ik-lede\">We're candid about this because it's the basis of a real partnership, not a vendor relationship.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ik-grid4\" style=\"align-content:start;flex:0 0 auto;\">\n        <div class=\"ik-card\"><div class=\"h\">Transaction density<\u002Fdiv><div class=\"d\">Hundreds of obligations per show, dozens of shows per quarter.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">Complex counterparties<\u002Fdiv><div class=\"d\">Major artists, multiple venues, production at scale.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">Recurring events<\u002Fdiv><div class=\"d\">Residencies and festivals — the same relationships, settled again and again.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">Geographic reach<\u002Fdiv><div class=\"d\">Las Vegas, Chicago, Texas, Phoenix, Hawaii — multi-market from day one.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">Major artists<\u002Fdiv><div class=\"d\">Settlements at the top of the market, where the terms are the most complex and the stakes the highest.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">Multiple venues<\u002Fdiv><div class=\"d\">Arena, residency room, festival ground and a flagship venue of IKON's own — every venue relationship type.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">Production complexity<\u002Fdiv><div class=\"d\">Change orders, multi-vendor builds, day-of labor — the edge cases a ledger has to handle to be trusted.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">Real-world financial data<\u002Fdiv><div class=\"d\">The settlement truth that trains forecasting, routing and risk — earned show by show, never bought.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"settle-bar\" style=\"margin-top:auto;\">\n        <div class=\"sb-mark\">v<\u002Fdiv>\n        <div><div class=\"sb-t\">Most importantly: a live laboratory for VYB's financial infrastructure.<\u002Fdiv><div class=\"sb-s\">Real-world financial data, real settlement pressure, real counterparties — the conditions the product has to prove itself in.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 39 · THE BIGGER VISION -->\n  <section data-label=\"The bigger vision\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">38<\u002Fspan>\n      <div class=\"vision-wrap\" style=\"margin:0;\">\n        <span class=\"eyebrow\">The bigger vision<\u002Fspan>\n        <h1 style=\"font-size:82px;\">We don't want to build software for concerts.<br>We want to build the infrastructure that lets <em>live commerce operate.<\u002Fem><\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:20px 40px;align-items:center;margin-top:52px;\">\n        <div style=\"font-size:15px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#8e8e93;\">Today<\u002Fdiv>\n        <div class=\"ik-hchain\"><span class=\"step acc\">IKON<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">VYB<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#8e8e93;\">Tomorrow<\u002Fdiv>\n        <div class=\"ik-hchain\"><span class=\"step\">Artist<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">Studio<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">Promoter<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">Venue<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">Festival<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">Stadium<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">one financial infrastructure<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:34px;font-size:21px;\">IKON represents one of the strongest environments anywhere to prove that thesis.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 40 · CLOSING -->\n  <section data-label=\"Closing\">\n    <div class=\"slide dark\">\n      <div class=\"close-wrap\">\n        <h1 style=\"font-size:88px;\">Let's build the financial infrastructure underneath the <em>next generation<\u002Fem> of live entertainment.<\u002Fh1>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;max-width:1400px;\">\n          <div style=\"font-size:24px;line-height:1.5;color:#a1a1a6;\"><b style=\"color:#f5f5f7;\">IKON<\u002Fb> brings the scale, the relationships and the live-event complexity.<\u002Fdiv>\n          <div style=\"font-size:24px;line-height:1.5;color:#a1a1a6;\"><b style=\"color:#f5f5f7;\">VYB<\u002Fb> brings the financial infrastructure, the intelligence and the payment layer.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ik-chips\" style=\"margin-top:36px;\">\n          <span class=\"ik-chip on\">Every event becomes programmable<\u002Fspan><span class=\"ik-chip on\">Every obligation becomes trackable<\u002Fspan><span class=\"ik-chip on\">Every payment becomes intelligent<\u002Fspan><span class=\"ik-chip on\">Every participant becomes connected<\u002Fspan>\n        <\u002Fdiv>\n        <p class=\"close-meta\">VYB × IKON PRESENTS · The operating system for live commerce · blake@vybapp.io<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"footer-mark\"><span class=\"app-icon\">v<\u002Fspan> vyb<\u002Fdiv>\n      <div class=\"foot-tag\">CONFIDENTIAL · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n<\u002Fdeck-stage>\n\n<script src=\"dc950efc-437d-4f7e-ab99-2af1f7a922f8\"><\u002Fscript>\n<script src=\"7f9fccf6-4903-4aaa-bdb0-4393992d6e65\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
