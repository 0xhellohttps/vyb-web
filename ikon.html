document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>VYB × IKON Presents<\u002Ftitle>\n<style>\n  deck-stage:not(:defined) { visibility: hidden; }\n\n  :root {\n    --bg: #ffffff;\n    --ink: #1d1d1f;\n    --ink-2: #6e6e73;\n    --ink-3: #aeaeb2;\n    --line: rgba(0,0,0,0.12);\n    --line-soft: rgba(0,0,0,0.08);\n    --accent: #0071e3;\n    --green: #1f8a4c;\n    --mono: \"SF Mono\", ui-monospace, Menlo, Monaco, \"Cascadia Code\", \"Source Code Pro\", Consolas, monospace;\n    --system: -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Helvetica Neue\", sans-serif;\n    --vyb-grad: linear-gradient(150deg, #0071e3, #5e5ce6);\n  }\n\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  html, body { background: #000; }\n\n  deck-stage { display: block; }\n\n  section {\n    background: var(--bg);\n    color: var(--ink);\n    font-family: var(--mono);\n    overflow: hidden;\n  }\n\n  .slide { width: 100%; height: 100%; padding: 92px 120px; display: flex; flex-direction: column; position: relative; }\n\n  /* shared atoms */\n  .eyebrow { font-size: 24px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }\n  .slide-num { position: absolute; top: 92px; right: 120px; font-size: 24px; color: var(--ink-3); letter-spacing: 1px; }\n  .wordmark { font-family: var(--system); font-weight: 700; letter-spacing: -0.03em; }\n  .app-icon {\n    display: inline-flex; align-items: center; justify-content: center;\n    background: var(--vyb-grad); color: #fff; border-radius: 14px;\n    font-family: var(--system); font-weight: 700;\n    box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);\n  }\n  .footer-mark { position: absolute; left: 120px; bottom: 76px; display: flex; align-items: center; gap: 14px; font-family: var(--system); font-weight: 600; font-size: 26px; color: var(--ink); letter-spacing: -0.3px; }\n  .footer-mark .app-icon { width: 36px; height: 36px; border-radius: 9px; font-size: 21px; }\n  .foot-tag { position: absolute; right: 120px; bottom: 76px; font-size: 24px; color: var(--ink-3); letter-spacing: 1px; }\n\n  h1.big { font-size: 92px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; }\n  h2.title { font-size: 64px; font-weight: 600; line-height: 1.12; letter-spacing: -0.015em; }\n  .lede { font-size: 34px; line-height: 1.5; color: var(--ink-2); font-weight: 400; max-width: 30ch; }\n\n  /* ===== DARK slides ===== */\n  .slide.dark { background: #000; color: #f5f5f7; }\n  .slide.dark .lede { color: #a1a1a6; }\n  .slide.dark .slide-num { color: #48484a; }\n  .slide.dark .footer-mark { color: #f5f5f7; }\n  .slide.dark .foot-tag { color: #636366; }\n\n  /* ===== TITLE ===== */\n  .title-wrap { margin: auto 0; }\n  .title-logo { display: flex; align-items: center; gap: 28px; margin-bottom: 56px; }\n  .title-logo .app-icon { width: 104px; height: 104px; border-radius: 26px; font-size: 60px; }\n  .title-logo .wm { font-size: 76px; color: #f5f5f7; }\n  .title-wrap h1 { font-size: 88px; font-weight: 600; line-height: 1.08; letter-spacing: -0.02em; color: #f5f5f7; max-width: 22ch; }\n  .title-wrap .sub { margin-top: 40px; font-size: 34px; color: #a1a1a6; letter-spacing: .5px; }\n  .title-cursor { display: inline-block; width: 5px; height: 0.9em; background: var(--accent); margin-left: 10px; vertical-align: baseline; animation: blink 1s step-start infinite; }\n  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }\n\n  /* ===== generic header for content slides ===== */\n  .s-head { margin-bottom: 64px; }\n  .s-head .eyebrow { margin-bottom: 22px; display: block; }\n\n  /* problem grid */\n  .prob-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 80px; margin-top: 8px; }\n  .prob-item { padding: 42px 0; border-top: 1px solid var(--line); display: flex; gap: 32px; align-items: flex-start; }\n  .prob-x { font-size: 30px; color: #d11; flex-shrink: 0; padding-top: 4px; }\n  .prob-item h3 { font-size: 34px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 12px; }\n  .prob-item p { font-size: 26px; line-height: 1.5; color: var(--ink-2); }\n\n  /* solution split */\n  .sol { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 96px; flex: 1; align-items: center; }\n  .sol h2 { font-size: 58px; font-weight: 600; line-height: 1.15; letter-spacing: -0.015em; }\n  .sol h2 em { font-style: normal; color: var(--accent); }\n  .sol .sol-sub { margin-top: 34px; font-size: 30px; line-height: 1.55; color: var(--ink-2); max-width: 26ch; }\n  .sol-points { margin-top: 44px; display: flex; flex-direction: column; gap: 20px; }\n  .sol-points .sp { display: flex; align-items: center; gap: 18px; font-size: 27px; }\n  .sol-points .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }\n\n  /* phone mock */\n  .phone { width: 392px; height: 812px; border-radius: 62px; padding: 13px; background: linear-gradient(160deg,#2a2a2e,#0c0c0e); box-shadow: 0 2px 4px rgba(0,0,0,.5) inset, 0 0 0 2px rgba(255,255,255,.05) inset, 0 50px 100px -30px rgba(0,0,0,.5); margin: 0 auto; flex-shrink: 0; }\n  .phone-screen { width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #fafafa; position: relative; }\n  .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 126px; height: 34px; border-radius: 999px; background: #0a0a0c; z-index: 5; }\n  .imsg { position: absolute; inset: 0; background: #fafafa; color: #1c1c1e; display: flex; flex-direction: column; font-family: var(--system); }\n  .imsg-head { padding: 62px 18px 14px; text-align: center; border-bottom: .5px solid rgba(0,0,0,.07); }\n  .imsg-avatar { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 8px; background: var(--vyb-grad); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 28px; }\n  .imsg-title { font-size: 19px; font-weight: 600; }\n  .imsg-sub { font-size: 14px; color: rgba(28,28,30,.5); margin-top: 2px; }\n  .imsg-body { flex: 1; padding: 18px 16px; display: flex; flex-direction: column; gap: 11px; }\n  .imsg-body > * { flex-shrink: 0; }\n  .bub { max-width: 82%; padding: 12px 16px; border-radius: 22px; font-size: 18px; line-height: 1.35; }\n  .bub-in { align-self: flex-start; background: #e9e9eb; border-bottom-left-radius: 6px; }\n  .bub-out { align-self: flex-end; background: #0a84ff; color: #fff; border-bottom-right-radius: 6px; }\n  .bub-name { font-size: 13px; color: rgba(28,28,30,.45); margin: 4px 0 -6px 16px; font-weight: 600; }\n  .prop { align-self: flex-start; width: 94%; background: #fff; border-radius: 20px; overflow: hidden; border: .5px solid rgba(0,0,0,.08); box-shadow: 0 10px 26px -10px rgba(20,16,40,.22); }\n  .prop-top { display: flex; align-items: center; gap: 10px; padding: 14px 16px 11px; border-bottom: .5px solid rgba(0,0,0,.06); }\n  .prop-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--vyb-grad); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; }\n  .prop-kicker { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(28,28,30,.45); }\n  .prop-h { font-size: 18px; font-weight: 650; margin-top: 2px; }\n  .prop-rows { padding: 12px 16px; display: flex; flex-direction: column; gap: 9px; }\n  .prop-row { display: flex; justify-content: space-between; font-size: 16px; }\n  .prop-row span { color: rgba(28,28,30,.5); }\n  .prop-row b { font-weight: 600; }\n  .prop-cta { display: flex; gap: 8px; padding: 0 16px 16px; }\n  .prop-confirm { flex: 1; height: 44px; border-radius: 12px; background: #34c759; color: #fff; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px; }\n  .prop-later { width: 92px; height: 44px; border-radius: 12px; background: #f0f0f2; color: rgba(28,28,30,.6); font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; }\n\n  /* steps */\n  .steps4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 48px; flex: 1; align-content: center; }\n  .stp { border-top: 3px solid var(--accent); padding-top: 30px; }\n  .stp .n { font-size: 30px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }\n  .stp h3 { font-size: 34px; font-weight: 600; margin: 22px 0 16px; letter-spacing: -0.01em; }\n  .stp p { font-size: 25px; line-height: 1.5; color: var(--ink-2); }\n  .stp .code { display: inline-block; margin-top: 18px; font-size: 22px; background: rgba(0,113,227,.08); color: var(--accent); padding: 4px 14px; border-radius: 8px; }\n\n  /* features columns */\n  .feat-cols { display: grid; grid-template-columns: repeat(3,1fr); gap: 72px; flex: 1; align-content: start; margin-top: 8px; }\n  .feat-col h4 { font-size: 24px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }\n  .feat-col ul { list-style: none; }\n  .feat-col li { padding: 22px 0; border-bottom: 1px solid var(--line-soft); }\n  .feat-col li b { display: block; font-size: 27px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 6px; }\n  .feat-col li span { font-size: 21px; line-height: 1.45; color: var(--ink-2); }\n\n  /* enterprise stats */\n  .stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 0; flex: 1; align-items: center; }\n  .stat { padding: 0 64px; }\n  .stat:not(:last-child) { border-right: 1px solid var(--line); }\n  .stat:first-child { padding-left: 0; }\n  .stat .big-num { font-size: 96px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }\n  .stat .big-num .u { font-size: 42px; color: var(--accent); }\n  .stat .lab { font-size: 25px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin: 26px 0 16px; } ing: -0.04em; line-height: .9; color: var(--accent); }\n  .ik-goal { display: flex; align-items: center; gap: 20px; padding: 22px 30px; border-radius: 16px; background: var(--vyb-grad); color: #fff; box-shadow: 0 18px 50px -18px rgba(0,113,227,.55); margin-top: 26px; }\n  .ik-goal .gm { width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; font-family: var(--system); font-weight: 700; font-size: 25px; flex-shrink: 0; }\n  .ik-goal .gt { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }\n  .ik-goal .gs { font-size: 17px; opacity: .85; margin-top: 3px; }\n  .ik-track { display: flex; gap: 8px; margin-top: 20px; }\n  .ik-track span { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); }\n  .ik-track span.on { background: var(--accent); }\n  .slide:not(.dark) .ik-track span { background: rgba(0,0,0,0.08); }\n  .slide:not(.dark) .ik-track span.on { background: var(--accent); }\n\n  /* big statement */\n  .ik-state { margin: auto 0; }\n  .ik-state h1 { font-size: 84px; font-weight: 600; line-height: 1.06; letter-spacing: -0.022em; color: #f5f5f7; max-width: 20ch; }\n  .ik-state h1 em { font-style: normal; color: var(--accent); }\n  .ik-state .sub { margin-top: 36px; font-size: 30px; line-height: 1.5; color: #a1a1a6; max-width: 40ch; }\n  .slide:not(.dark) .ik-state h1 { color: var(--ink); }\n  .slide:not(.dark) .ik-state .sub { color: var(--ink-2); }\n\n  /* two-party table (37/38) */\n  .ik-kv { display: flex; flex-direction: column; }\n  .ik-kv .r { display: grid; grid-template-columns: 280px 1fr; gap: 30px; align-items: baseline; padding: 22px 0; border-top: 1px solid rgba(255,255,255,0.12); }\n  .ik-kv .r:first-child { border-top: none; }\n  .ik-kv .k { font-size: 20px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent); }\n  .ik-kv .v { font-size: 27px; line-height: 1.4; color: #f5f5f7; letter-spacing: -0.01em; }\n  .ik-kv .v small { display: block; font-size: 18px; color: #8e8e93; margin-top: 4px; }\n  .slide:not(.dark) .ik-kv .r { border-color: var(--line-soft); }\n  .slide:not(.dark) .ik-kv .v { color: var(--ink); }\n  .slide:not(.dark) .ik-kv .v small { color: var(--ink-2); }\n\n  .ik-tag { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #ff9f0a; border: 1px solid rgba(255,159,10,.5); border-radius: 999px; padding: 5px 12px; }\n  .ik-act { font-size: 18px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #636366; margin-bottom: 26px; }\n  .slide:not(.dark) .ik-act { color: var(--ink-3); }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<script>\n  /* prevent first-paint flash: hide animatable content before the deck renders */\n  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {\n    document.body.classList.add('anim-ready');\n  }\n<\u002Fscript>\n\n<deck-stage width=\"1920\" height=\"1080\">\n\n  \n  <!-- 1 · COVER -->\n  <section data-label=\"Cover\">\n    <div class=\"slide dark\">\n      <div class=\"title-wrap\">\n        <div class=\"title-logo\">\n          <span class=\"app-icon\">v<\u002Fspan>\n          <span class=\"wm wordmark\">vyb<\u002Fspan>\n          <span style=\"font-size:52px;color:#48484a;font-weight:300;margin:0 6px;\">×<\u002Fspan>\n          <span class=\"wm\" style=\"font-size:64px;color:#f5f5f7;letter-spacing:.06em;\">IKON PRESENTS<\u002Fspan>\n        <\u002Fdiv>\n        <h1>The financial infrastructure for the next generation of live entertainment.<span class=\"title-cursor\"><\u002Fspan><\u002Fh1>\n        <div style=\"display:flex;gap:64px;margin-top:44px;\">\n          <div><div style=\"font-family:var(--system);font-size:30px;font-weight:700;color:#f5f5f7;\">VYB<\u002Fdiv><div style=\"font-size:21px;color:#a1a1a6;margin-top:6px;\">Financial infrastructure + intelligence for live commerce<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-family:var(--system);font-size:30px;font-weight:700;color:#f5f5f7;\">IKON Presents<\u002Fdiv><div style=\"font-size:21px;color:#a1a1a6;margin-top:6px;\">Independent live entertainment at scale<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"footer-mark\"><span class=\"app-icon\">v<\u002Fspan> vyb<\u002Fdiv>\n      <div class=\"foot-tag\">CONFIDENTIAL · STRATEGIC PARTNERSHIP PROPOSAL · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 2 · THE THESIS -->\n  <section data-label=\"The thesis\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">01<\u002Fspan>\n      <div class=\"ik-act\">Act I · The opportunity<\u002Fdiv>\n      <div class=\"ik-state\" style=\"margin:0;\">\n        <h1 style=\"max-width:18ch;\">Live entertainment has become technologically sophisticated — <em>except for the money.<\u002Fem><\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;margin-top:52px;flex-wrap:wrap;\">\n        <span class=\"ik-chip on\">Ticketing · digital<\u002Fspan>\n        <span class=\"ik-chip on\">Marketing · digital<\u002Fspan>\n        <span class=\"ik-chip on\">Streaming · digital<\u002Fspan>\n        <span class=\"ik-chip on\">Discovery · digital<\u002Fspan>\n        <span class=\"ik-chip x\">Settlement · spreadsheets, email, wires<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:26px;line-height:1.5;color:#c7c7cc;max-width:64ch;margin-top:40px;\">The economic infrastructure connecting the participants in a live event is still fragmented. <b style=\"color:#f5f5f7;\">VYB is building the financial operating system that connects it.<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3 · WHY IKON -->\n  <section data-label=\"Why IKON\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">02<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:36px;\">\n        <span class=\"eyebrow\">Why IKON<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:56px;\">IKON is exactly the kind of company VYB was built for.<\u002Fh2>\n        <p class=\"ik-lede\" style=\"max-width:74ch;\">An independent live entertainment company operating across concert promotion, event production, festivals, residencies and premium live experiences — with its own flagship venue and a calendar that spans major artists and multiple markets.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"stat-row\" style=\"flex:0 0 auto;margin-bottom:38px;\">\n        <div class=\"stat\"><div class=\"big-num\" style=\"font-size:84px;\">200<span class=\"u\">+<\u002Fspan><\u002Fdiv><div class=\"lab\">Events<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"big-num\" style=\"font-size:84px;\">250<span class=\"u\">+<\u002Fspan><\u002Fdiv><div class=\"lab\">Artists<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"big-num\" style=\"font-size:84px;\">1M<span class=\"u\">+<\u002Fspan><\u002Fdiv><div class=\"lab\">Fans<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ik-chips\">\n        <span class=\"ik-chip\">Las Vegas<\u002Fspan><span class=\"ik-chip\">Chicago<\u002Fspan><span class=\"ik-chip\">Houston<\u002Fspan><span class=\"ik-chip\">Dallas<\u002Fspan><span class=\"ik-chip\">Phoenix<\u002Fspan><span class=\"ik-chip\">Honolulu · Maui<\u002Fspan><span class=\"ik-chip\">Residencies<\u002Fspan><span class=\"ik-chip\">Festivals<\u002Fspan><span class=\"ik-chip\">Arena &amp; stadium scale<\u002Fspan><span class=\"ik-chip on\">KLTRE · flagship venue<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\"><b>IKON doesn't need another piece of software.<\u002Fb> It needs the infrastructure underneath everything it already does. &nbsp;·&nbsp; Figures from IKON's public materials.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 4 · SCALE OF THE PROBLEM -->\n  <section data-label=\"One event, hundreds of relationships\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">03<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:18px;\">\n        <span class=\"eyebrow\">The scale of the problem<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">One event creates hundreds of financial relationships.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-tree\">\n        <div class=\"node root\">The event<small>one night · one P&amp;L · dozens of counterparties<\u002Fsmall><\u002Fdiv>\n        <svg class=\"fan\" viewBox=\"0 0 760 44\" aria-hidden=\"true\"><path d=\"M380 0 V14 M380 14 H100 V44 M380 14 V44 M380 14 H660 V44\" fill=\"none\" stroke=\"rgba(255,255,255,0.28)\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>\n        <div class=\"row\">\n          <div class=\"node\">Artist<small>guarantee · backend · riders<\u002Fsmall><\u002Fdiv>\n          <div class=\"node\">Venue<small>rent · settlement · ancillaries<\u002Fsmall><\u002Fdiv>\n          <div class=\"node\">Promoter<small>IKON · the risk holder<\u002Fsmall><\u002Fdiv>\n        <\u002Fdiv>\n        <svg class=\"fan wide\" viewBox=\"0 0 1040 44\" aria-hidden=\"true\"><path d=\"M240 0 V14 M520 0 V14 M800 0 V14 M240 14 H800 M170 44 V28 M520 44 V28 M870 44 V28 M170 28 H870 M520 14 V28\" fill=\"none\" stroke=\"rgba(255,255,255,0.28)\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>\n        <div class=\"row\">\n          <div class=\"node\">Production<small>staging · sound · lighting · video<\u002Fsmall><\u002Fdiv>\n          <div class=\"node\">Vendors<small>security · hospitality · transport<\u002Fsmall><\u002Fdiv>\n          <div class=\"node\">Staff<small>crews · contractors · day-of labor<\u002Fsmall><\u002Fdiv>\n        <\u002Fdiv>\n        <svg class=\"fan\" viewBox=\"0 0 760 44\" aria-hidden=\"true\"><path d=\"M100 0 V16 M380 0 V16 M660 0 V16 M100 16 H660 M380 16 V44\" fill=\"none\" stroke=\"rgba(255,255,255,0.28)\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>\n        <div class=\"node sink\">Settlement<small>every relationship has to close<\u002Fsmall><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ik-hchain\" style=\"justify-content:center;margin-top:16px;\">\n        <span class=\"step dim\">Contracts<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step dim\">Obligations<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step dim\">Invoices<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step dim\">Approvals<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step dim\">Payments<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step dim\">Reconciliation<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"text-align:center;\">Every relationship runs this chain. Today, every link lives in a different tool — or a different inbox.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 5 · THE HIDDEN COST -->\n  <section data-label=\"The hidden cost\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">04<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:40px;\">\n        <span class=\"eyebrow\">The hidden cost<\u002Fspan>\n        <h2 class=\"title\">The event ends. The financial work doesn't.<\u002Fh2>\n        <p class=\"ik-lede\">A sold-out night can still produce weeks of back-office work — none of it visible to the fan, all of it carried by the promoter.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ik-grid2\" style=\"align-content:start;gap:0 80px;\">\n        <ul class=\"ik-list no\">\n          <li>Invoice collection across dozens of vendors<\u002Fli>\n          <li>Payment approvals routed by email<\u002Fli>\n          <li>Talent settlement built in a spreadsheet at load-out<\u002Fli>\n          <li>Expense verification against the budget<\u002Fli>\n          <li>Bank reconciliation, line by line<\u002Fli>\n        <\u002Ful>\n        <ul class=\"ik-list no\">\n          <li>Vendor management and status chasing<\u002Fli>\n          <li>Tax documentation for every payee<\u002Fli>\n          <li>Accounting close, weeks after the show<\u002Fli>\n          <li>Reporting to partners and artists<\u002Fli>\n          <li>Cash-flow management across overlapping events<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"margin-top:30px;\">\n        <div style=\"font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;\">The tail of a typical show · what the promoter's team is still doing<\u002Fdiv>\n        <div class=\"ik-tl\" style=\"grid-template-columns:repeat(6,1fr);\">\n          <div class=\"t on\"><div class=\"tw\">Show night<\u002Fdiv><div class=\"tv\">Talent settled<\u002Fdiv><div class=\"td\">Final count, deductions, backend — built by hand at load-out.<\u002Fdiv><\u002Fdiv>\n          <div class=\"t\"><div class=\"tw\">Days 1–7<\u002Fdiv><div class=\"tv\">Invoices arrive<\u002Fdiv><div class=\"td\">Production, security, hospitality, transport — by email, in every format.<\u002Fdiv><\u002Fdiv>\n          <div class=\"t\"><div class=\"tw\">Days 7–21<\u002Fdiv><div class=\"tv\">Approvals<\u002Fdiv><div class=\"td\">Matched to the budget by hand; questions bounce between finance and production.<\u002Fdiv><\u002Fdiv>\n          <div class=\"t\"><div class=\"tw\">Days 14–30<\u002Fdiv><div class=\"tv\">Payments<\u002Fdiv><div class=\"td\">Batched wires and ACH; vendors call to ask where they stand.<\u002Fdiv><\u002Fdiv>\n          <div class=\"t\"><div class=\"tw\">Days 30–45<\u002Fdiv><div class=\"tv\">Reconciliation<\u002Fdiv><div class=\"td\">Bank lines matched to invoices; the show's true margin appears for the first time.<\u002Fdiv><\u002Fdiv>\n          <div class=\"t\"><div class=\"tw\">Days 45–60<\u002Fdiv><div class=\"tv\">Close &amp; reporting<\u002Fdiv><div class=\"td\">Accounting close, partner reports, tax documents — while the next six shows are already live.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"settle-bar\" style=\"margin-top:auto;\">\n        <div class=\"sb-mark\">v<\u002Fdiv>\n        <div><div class=\"sb-t\">VYB turns the post-event financial tail into an automated operating system.<\u002Fdiv><div class=\"sb-s\">The work still happens — it just stops being manual, and stops waiting for the show to end.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 6 · INTRODUCING VYB -->\n  <section data-label=\"Introducing VYB\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">05<\u002Fspan>\n      <div class=\"ik-act\">Act II · VYB<\u002Fdiv>\n      <div class=\"ik-state\" style=\"margin:0;\">\n        <h1>VYB is the <em>financial operating system<\u002Fem> for live commerce.<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:14px;margin-top:48px;flex-wrap:wrap;\">\n        <span class=\"ik-chip x\">Not another accounting system<\u002Fspan>\n        <span class=\"ik-chip x\">Not another ticketing platform<\u002Fspan>\n        <span class=\"ik-chip x\">Not another payment processor<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:27px;line-height:1.5;color:#c7c7cc;max-width:60ch;margin-top:40px;\"><b style=\"color:#f5f5f7;\">VYB sits between the participants and orchestrates the economics of the event.<\u002Fb> It decides what should happen, executes it, and settles it — on one ledger.<\u002Fp>\n      <div class=\"foot-tag\">VYB · FINANCIAL OS<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 7 · ARCHITECTURE -->\n  <section data-label=\"The VYB architecture\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">06<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:22px;\">\n        <span class=\"eyebrow\">The VYB architecture<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Commerce underneath. Intelligence on top. One ledger between them.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.1fr 0.9fr;gap:48px;flex:1;align-items:center;\">\n        <div class=\"ik-chain\">\n          <div class=\"step ink\" style=\"min-width:560px;\">VYB Intelligence<small>the operator's agent — reads, reasons, proposes<\u002Fsmall><\u002Fdiv>\n          <div class=\"arr\">↓<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;\">\n            <div class=\"step\" style=\"min-width:275px;\">Agents<small>watch · catch · finish<\u002Fsmall><\u002Fdiv>\n            <div class=\"step\" style=\"min-width:275px;\">Decision engine<small>policy · risk · timing<\u002Fsmall><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"arr\">↓<\u002Fdiv>\n          <div class=\"step acc\" style=\"min-width:560px;\">VYB Ledger<small>double-entry · event-scoped · the source of truth<\u002Fsmall><\u002Fdiv>\n          <div class=\"arr\">↓<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;\">\n            <div class=\"step\" style=\"min-width:275px;\">Payments<small>routing across rails<\u002Fsmall><\u002Fdiv>\n            <div class=\"step\" style=\"min-width:275px;\">Settlement<small>who · how much · when<\u002Fsmall><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"arr\">↓<\u002Fdiv>\n          <div class=\"step ink\" style=\"min-width:560px;\">Live commerce<small>tickets · talent · venues · vendors · sponsors<\u002Fsmall><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <div class=\"ik-card\"><div class=\"h\">Every dollar becomes an event<\u002Fdiv><div class=\"d\">A ticket, a deposit, a vendor invoice, a settlement — each lands as an immutable entry tagged to the show that created it.<\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-card\"><div class=\"h\">Every entry feeds the agent<\u002Fdiv><div class=\"d\">Agents read the ledger continuously: what's owed, what's late, what's over budget, what can be settled today.<\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-card acc\"><div class=\"h\">Every decision routes back to money<\u002Fdiv><div class=\"d\">The agent proposes; policy approves; the payment layer executes. Decide → execute → settle, on one system.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\">VYB becomes the connective tissue between <b>commerce and intelligence.<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 8 · SOFTWARE TO INFRASTRUCTURE -->\n  <section data-label=\"From software to infrastructure\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">07<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:44px;\">\n        <span class=\"eyebrow\">From software to infrastructure<\u002Fspan>\n        <h2 class=\"title\">The difference.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ba\" style=\"flex:1;min-height:0;\">\n        <div class=\"ba-col ba-today\">\n          <div class=\"ba-tag\">Traditional SaaS<\u002Fdiv>\n          <div class=\"ba-h\" style=\"font-size:34px;\">\"Here is software to help you manage your business.\"<\u002Fdiv>\n          <ul class=\"ba-mess\">\n            <li>You enter the data<\u002Fli>\n            <li>You chase the approvals<\u002Fli>\n            <li>You move the money somewhere else<\u002Fli>\n            <li>The vendor's value stops at the dashboard<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"ba-col ba-vyb\">\n          <div class=\"ba-tag\">VYB<\u002Fdiv>\n          <div class=\"ba-h\" style=\"font-size:34px;\">\"Give us the economic relationships and we'll orchestrate them.\"<\u002Fdiv>\n          <ul class=\"ba-check\">\n            <li>The relationships are the data<\u002Fli>\n            <li>Approvals are policy, not email<\u002Fli>\n            <li>Money moves inside the system<\u002Fli>\n            <li>Value compounds with every transaction<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:26px;font-size:22px;\"><b>That distinction matters.<\u002Fb> The deeper VYB goes into the transaction lifecycle, the more valuable the network becomes — for IKON, and for everyone IKON transacts with.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 9 · IKON + VYB -->\n  <section data-label=\"IKON + VYB\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">08<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:24px;\">\n        <span class=\"eyebrow\">IKON + VYB<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">One operating layer across the entire event.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.2fr 0.8fr;gap:56px;flex:1;align-items:center;\">\n        <div>\n          <div style=\"font-size:15px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#8e8e93;margin-bottom:14px;\">Everything IKON already runs<\u002Fdiv>\n          <div class=\"ik-chips\">\n            <span class=\"ik-chip\">Event<\u002Fspan><span class=\"ik-chip\">Artist<\u002Fspan><span class=\"ik-chip\">Venue<\u002Fspan><span class=\"ik-chip\">Production<\u002Fspan><span class=\"ik-chip\">Vendors<\u002Fspan><span class=\"ik-chip\">Staff<\u002Fspan><span class=\"ik-chip\">Sponsors<\u002Fspan><span class=\"ik-chip\">Ticket revenue<\u002Fspan><span class=\"ik-chip\">Merch &amp; VIP<\u002Fspan><span class=\"ik-chip\">Marketing spend<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:21px;line-height:1.5;color:#a1a1a6;margin-top:24px;max-width:44ch;\">None of these change. They stop being separate financial silos and become nodes on one graph.<\u002Fp>\n          <div style=\"font-size:15px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#8e8e93;margin:28px 0 12px;\">What stays exactly where it is<\u002Fdiv>\n          <ul class=\"ik-list small\">\n            <li><b>Ticketing<\u002Fb> — revenue connects through settlement reports, not a replacement<\u002Fli>\n            <li><b>Banks<\u002Fb> — VYB instructs; IKON's existing accounts and rails move the money<\u002Fli>\n            <li><b>Accounting<\u002Fb> — the ledger exports the close instead of waiting for it<\u002Fli>\n            <li><b>Contracts<\u002Fb> — deal memos and vendor agreements become obligations as they are<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"ik-chain\">\n          <div class=\"step ink\" style=\"min-width:520px;\">IKON<small>events · relationships · revenue<\u002Fsmall><\u002Fdiv>\n          <div class=\"arr\">↓<\u002Fdiv>\n          <div class=\"step acc\" style=\"min-width:520px;\">VYB<small>the financial operating layer<\u002Fsmall><\u002Fdiv>\n          <div class=\"arr\">↓<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;\">\n            <div class=\"step\" style=\"min-width:165px;\">Ledger<\u002Fdiv>\n            <div class=\"step\" style=\"min-width:165px;\">Payments<\u002Fdiv>\n            <div class=\"step\" style=\"min-width:165px;\">Intelligence<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10 · THE EVENT BECOMES A FINANCIAL OBJECT -->\n  <section data-label=\"The event as a financial object\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">09<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">The event becomes a financial object<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:52px;\">Not a folder of spreadsheets. A live financial representation of the show.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:0.95fr 1.05fr;gap:48px;flex:1;align-items:center;\">\n        <div>\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:16px;\"><span class=\"ik-tag\">Illustrative event<\u002Fspan><span style=\"font-size:15px;color:var(--ink-3);\">hypothetical figures · not IKON data<\u002Fspan><\u002Fdiv>\n          <div style=\"font-family:var(--system);font-size:40px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;\">Arena headliner<br>Las Vegas · one night<\u002Fdiv>\n          <p style=\"font-size:21px;line-height:1.5;color:var(--ink-2);margin-top:16px;max-width:40ch;\">We'll follow this one event through the rest of the deck — before doors, at settlement, and after — to show what VYB knows at every moment.<\u002Fp>\n          <p style=\"font-size:19px;line-height:1.5;color:var(--ink-3);margin-top:16px;max-width:40ch;\">14,000 capacity · headliner guarantee + backend · venue, production, vendor and labor contracts · one sponsor.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:14px;\">\n          <div class=\"ik-tile\"><div class=\"k\">Expected revenue<\u002Fdiv><div class=\"v\">$2.66M<\u002Fdiv><div class=\"s\">tickets · sponsorship · ancillaries<\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-tile\"><div class=\"k\">Collected to date<\u002Fdiv><div class=\"v\">$2.40M<\u002Fdiv><div class=\"s\">ticket settlement received<\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-tile\"><div class=\"k\">Committed<\u002Fdiv><div class=\"v\">$2.15M<\u002Fdiv><div class=\"s\">artist · venue · production · vendors · labor · marketing<\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-tile\"><div class=\"k\">Paid<\u002Fdiv><div class=\"v\">$860K<\u002Fdiv><div class=\"s\">deposits released on schedule<\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-tile\"><div class=\"k\">Outstanding<\u002Fdiv><div class=\"v\">$1.29M<\u002Fdiv><div class=\"s\">approved, scheduled, not yet paid<\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-tile\"><div class=\"k\">Projected margin<\u002Fdiv><div class=\"v acc\">$510K<\u002Fdiv><div class=\"s\">≈ 19% · updated on every entry<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\">VYB knows expected vs. actual revenue, every obligation by counterparty, every outstanding payment, settlement status, cash position and event profitability — <b>at the same moment IKON does.<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 11 · BEFORE THE EVENT -->\n  <section data-label=\"Before the event\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">10<\u002Fspan>\n      <div class=\"ik-act\">Act III · The IKON event<\u002Fdiv>\n      <div class=\"s-head\" style=\"margin-bottom:20px;\">\n        <span class=\"eyebrow\">Before the event<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">VYB starts working before doors open.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:50px;flex:1;align-items:center;\">\n        <div class=\"ik-hchain\" style=\"display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;\">\n          <span class=\"step\">1 · Create event<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">2 · Counterparties<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">3 · Contracts &amp; obligations<\u002Fspan>\n          <span class=\"step\" style=\"grid-column:1;\">4 · Payment schedules<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">5 · Approval policy<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step\">6 · Connect revenue<\u002Fspan>\n          <span class=\"step acc\" style=\"grid-column:1 / -1;text-align:center;\">7 · Monitor the economics — continuously<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;\">\n          <div class=\"ik-card\"><div class=\"h\">Las Vegas · arena headliner<\u002Fdiv><div class=\"d\">Event object created. Artist, venue, production company, 11 vendors, labor agency and marketing agency attached as obligation counterparties; one sponsor on the revenue side. Contract terms become obligations with due dates.<\u002Fdiv><\u002Fdiv>\n          <div class=\"ik-card acc\"><div class=\"h\">Day one, VYB already knows<\u002Fdiv><div class=\"d\">$2.15M committed against $2.66M expected · first deposits due in 14 days · the artist's 50% guarantee deposit is the largest single obligation · break-even sits at ~81% of expected revenue.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\">The financial infrastructure for the show exists weeks before the show does. <b>Illustrative figures.<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 12 · ARTIST ECONOMICS -->\n  <section data-label=\"Artist economics\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">11<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:34px;\">\n        <span class=\"eyebrow\">Artist economics<\u002Fspan>\n        <h2 class=\"title\">Artist settlement becomes programmable.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;\">\n        <div>\n          <div style=\"font-size:15px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#d11;margin-bottom:12px;\">Today<\u002Fdiv>\n          <div class=\"ik-hchain\"><span class=\"step dim\">Contract<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step dim\">Spreadsheet<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step dim\">Email<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step dim\">Accountant<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step dim\">Bank<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step dim\">Confirmation<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:15px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);margin-bottom:12px;\">With VYB<\u002Fdiv>\n          <div class=\"ik-hchain\"><span class=\"step acc\">Contract<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">Obligation<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">Approval<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">Settlement<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">Ledger<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.15fr 0.85fr;gap:28px;margin-top:28px;flex:1;align-items:start;\">\n        <div class=\"ik-card\" style=\"padding:20px 24px;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;\"><div class=\"h\" style=\"margin:0;font-size:20px;\">Artist settlement statement · Las Vegas<\u002Fdiv><span class=\"ik-tag\">Illustrative<\u002Fspan><\u002Fdiv>\n          <table class=\"ik-table\">\n            <tr><th>Line<\u002Fth><th>Source<\u002Fth><th style=\"text-align:right;\">Amount<\u002Fth><th>Status<\u002Fth><\u002Ftr>\n            <tr><td>Guarantee<\u002Ftd><td class=\"m\">Deal memo · fixed<\u002Ftd><td class=\"n\">$1,200,000<\u002Ftd><td><span class=\"st pd\">Obligation<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Deposit · 50%<\u002Ftd><td class=\"m\">Due T-30 · wire<\u002Ftd><td class=\"n\">$600,000<\u002Ftd><td><span class=\"st ok\">Paid<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Balance · 50%<\u002Ftd><td class=\"m\">Show night · after final count<\u002Ftd><td class=\"n\">$600,000<\u002Ftd><td><span class=\"st wt\">Ready · 2 signatures<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><td>Backend · 85% over break-even<\u002Ftd><td class=\"m\">Computed from ledger · net of approved costs<\u002Ftd><td class=\"n\">pending final count<\u002Ftd><td><span class=\"st dm\">Live<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr class=\"tot\"><td>Every line traces to a contract clause and a ledger entry<\u002Ftd><td><\u002Ftd><td class=\"n\">$1,200,000 + backend<\u002Ftd><td><\u002Ftd><\u002Ftr>\n          <\u002Ftable>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;\">Settlement timeline<\u002Fdiv>\n          <div class=\"ik-tl\" style=\"grid-template-columns:repeat(2,1fr);gap:14px;\">\n            <div class=\"t on\"><div class=\"tw\">T-60<\u002Fdiv><div class=\"tv\">Contract signed<\u002Fdiv><div class=\"td\">Deal memo terms become obligations with dates.<\u002Fdiv><\u002Fdiv>\n            <div class=\"t in\"><div class=\"tw\">T-30<\u002Fdiv><div class=\"tv\">Deposit released<\u002Fdiv><div class=\"td\">Approved on policy; the artist's team sees it land.<\u002Fdiv><\u002Fdiv>\n            <div class=\"t\"><div class=\"tw\">Show night<\u002Fdiv><div class=\"tv\">Final count<\u002Fdiv><div class=\"td\">Box office pulled; deductions verified against the memo.<\u002Fdiv><\u002Fdiv>\n            <div class=\"t out\"><div class=\"tw\">Show night +0<\u002Fdiv><div class=\"tv\">Balance &amp; backend<\u002Fdiv><div class=\"td\">Discrepancies surfaced line by line; manager confirms; paid night-of.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:18px;font-size:20px;\">The system knows <b>who gets paid, why, how much, when, and from which event.<\u002Fb> The artist's team sees the same numbers IKON does.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 13 · VENDOR ECONOMICS -->\n  <section data-label=\"Vendor economics\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">12<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:28px;\">\n        <span class=\"eyebrow\">Vendor economics<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Production vendors shouldn't have to chase IKON for payment.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-content:start;flex:0 0 auto;\">\n        <div class=\"ik-card\"><div class=\"h\">The vendor sees the transaction<\u002Fdiv><div class=\"d\">A digital invoice against a known obligation. Status at every step — received, approved, scheduled, paid — without a phone call.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">IKON sees the obligation<\u002Fdiv><div class=\"d\">Every invoice lands against the event budget line it belongs to. Over-budget, duplicate, or unexpected — flagged before approval, not after payment.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">VYB sees the entire network<\u002Fdiv><div class=\"d\">Which vendors are reliable, which invoices recur, which rails they prefer — routing and documentation handled once, reused on every show.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;\">\n        <span class=\"ik-chip\" style=\"font-size:18px;padding:10px 18px;\">Digital invoices<\u002Fspan><span class=\"ik-chip\" style=\"font-size:18px;padding:10px 18px;\">Automated approvals<\u002Fspan><span class=\"ik-chip\" style=\"font-size:18px;padding:10px 18px;\">Payment status<\u002Fspan><span class=\"ik-chip\" style=\"font-size:18px;padding:10px 18px;\">Payment routing<\u002Fspan><span class=\"ik-chip\" style=\"font-size:18px;padding:10px 18px;\">Documentation<\u002Fspan><span class=\"ik-chip\" style=\"font-size:18px;padding:10px 18px;\">Reconciliation<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"ik-card\" style=\"margin-top:18px;padding:18px 24px;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;\"><div class=\"h\" style=\"margin:0;font-size:19px;\">Las Vegas · vendor book — 11 vendors · $140,000 committed · 3 invoices awaiting approval ($46,200)<\u002Fdiv><span class=\"ik-tag\">Illustrative<\u002Fspan><\u002Fdiv>\n        <table class=\"ik-table\" style=\"font-size:15.5px;\">\n          <tr><th>Vendor<\u002Fth><th>Category<\u002Fth><th style=\"text-align:right;\">Obligation<\u002Fth><th>Invoice<\u002Fth><th>Rail<\u002Fth><th>Status<\u002Fth><\u002Ftr>\n          <tr><td>Staging &amp; rigging<\u002Ftd><td class=\"m\">Production vendor<\u002Ftd><td class=\"n\">$58,000<\u002Ftd><td class=\"m\">Deposit + balance<\u002Ftd><td class=\"m\">ACH<\u002Ftd><td><span class=\"st ok\">Deposit paid<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td>Security firm<\u002Ftd><td class=\"m\">Event security<\u002Ftd><td class=\"n\">$32,000<\u002Ftd><td class=\"m\">Received T-3 · matches PO<\u002Ftd><td class=\"m\">ACH<\u002Ftd><td><span class=\"st wt\">Awaiting approval<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td>Ground transport<\u002Ftd><td class=\"m\">Artist &amp; crew<\u002Ftd><td class=\"n\">$9,500<\u002Ftd><td class=\"m\">Received T-3 · matches PO<\u002Ftd><td class=\"m\">ACH<\u002Ftd><td><span class=\"st wt\">Awaiting approval<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td>Backline rental<\u002Ftd><td class=\"m\">Production vendor<\u002Ftd><td class=\"n\">$4,700<\u002Ftd><td class=\"m\">Received T-4 · matches PO<\u002Ftd><td class=\"m\">ACH<\u002Ftd><td><span class=\"st wt\">Awaiting approval<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td>Hospitality<\u002Ftd><td class=\"m\">Catering · green room<\u002Ftd><td class=\"n\">$4,800<\u002Ftd><td class=\"m\">6th show together<\u002Ftd><td class=\"m\">ACH<\u002Ftd><td><span class=\"st ok\">Auto-approved on policy<\u002Fspan><\u002Ftd><\u002Ftr>\n          <tr><td>6 further vendors<\u002Ftd><td class=\"m\">LED, barricade, radios, merch ops, cleaning, medical<\u002Ftd><td class=\"n\">$31,000<\u002Ftd><td class=\"m\">Not yet invoiced<\u002Ftd><td class=\"m\">—<\u002Ftd><td><span class=\"st pd\">Obligation open<\u002Fspan><\u002Ftd><\u002Ftr>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 14 · STAFF & OPERATIONAL PAYMENTS -->\n  <section data-label=\"Staff &amp; operational payments\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">13<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:34px;\">\n        <span class=\"eyebrow\">Staff &amp; operational payments<\u002Fspan>\n        <h2 class=\"title\">Events involve enormous numbers of people.<\u002Fh2>\n        <p class=\"ik-lede\">Every one of them is a payee. Every payee needs onboarding, verification, tax documentation and a payment — usually for a single night.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"payee-grid\" style=\"grid-template-columns:repeat(4,1fr);\">\n        <div class=\"payee\"><div class=\"pk\">Contractors<\u002Fdiv><div class=\"pd\">Riggers, techs, specialists<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Production staff<\u002Fdiv><div class=\"pd\">Stage, sound, lighting, video<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Security<\u002Fdiv><div class=\"pd\">Contracted firms &amp; individuals<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Hospitality<\u002Fdiv><div class=\"pd\">Runners, catering, green room<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Transportation<\u002Fdiv><div class=\"pd\">Ground, freight, artist travel<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Freelancers<\u002Fdiv><div class=\"pd\">Photo, video, content<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Event personnel<\u002Fdiv><div class=\"pd\">Box office, ushers, guest list<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Day-of labor<\u002Fdiv><div class=\"pd\">Load-in, load-out, conversion<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;\">\n        <div class=\"ik-tile\"><div class=\"k\">Onboard once<\u002Fdiv><div class=\"v\" style=\"font-size:26px;\">Verified profile<\u002Fdiv><div class=\"s\">Identity, tax form and payout details collected the first time — reused on every IKON show after.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-tile\"><div class=\"k\">Pay on policy<\u002Fdiv><div class=\"v\" style=\"font-size:26px;\">Rate × hours<\u002Fdiv><div class=\"s\">Timesheets or agency invoices matched to the labor budget line before approval.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-tile\"><div class=\"k\">Settle fast<\u002Fdiv><div class=\"v\" style=\"font-size:26px;\">Days, not weeks<\u002Fdiv><div class=\"s\">Batched payouts on the rail each payee chose; status visible to them without a call.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-tile\"><div class=\"k\">Document automatically<\u002Fdiv><div class=\"v\" style=\"font-size:26px;\">Tagged at source<\u002Fdiv><div class=\"s\">Every payout carries its tax classification and event tag — year-end reporting is a query.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"settle-bar\" style=\"margin-top:auto;\">\n        <div class=\"sb-mark\">v<\u002Fdiv>\n        <div><div class=\"sb-t\">Every person becomes a verified economic participant.<\u002Fdiv><div class=\"sb-s\">Onboarded once, paid on every show — with the documentation already on file.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 15 · VENUE ECONOMICS -->\n  <section data-label=\"Venue economics\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">14<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:24px;\">\n        <span class=\"eyebrow\">Venue economics<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">The venue is another node on the same graph.<\u002Fh2>\n        <p class=\"ik-lede\">Ticket revenue, venue obligations, production, ancillaries and talent all reconcile against each other — in one place, for one event.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"econ-eq\" style=\"grid-template-columns:1fr auto 1fr auto 1fr auto 1fr auto 1fr auto 1.1fr;flex:1;align-content:center;\">\n        <div class=\"eq-step\" style=\"border-color:rgba(255,255,255,0.14);\"><div class=\"eq-n\" style=\"color:#f5f5f7;font-size:40px;\">$2.40M<\u002Fdiv><div class=\"eq-l\" style=\"color:#a1a1a6;\">Ticket revenue<\u002Fdiv><\u002Fdiv>\n        <div class=\"eq-arrow\">−<\u002Fdiv>\n        <div class=\"eq-step\" style=\"border-color:rgba(255,255,255,0.14);\"><div class=\"eq-n\" style=\"color:#f5f5f7;font-size:40px;\">$310K<\u002Fdiv><div class=\"eq-l\" style=\"color:#a1a1a6;\">Venue obligations<\u002Fdiv><\u002Fdiv>\n        <div class=\"eq-arrow\">−<\u002Fdiv>\n        <div class=\"eq-step\" style=\"border-color:rgba(255,255,255,0.14);\"><div class=\"eq-n\" style=\"color:#f5f5f7;font-size:40px;\">$285K<\u002Fdiv><div class=\"eq-l\" style=\"color:#a1a1a6;\">Production<\u002Fdiv><\u002Fdiv>\n        <div class=\"eq-arrow\">+<\u002Fdiv>\n        <div class=\"eq-step\" style=\"border-color:rgba(255,255,255,0.14);\"><div class=\"eq-n\" style=\"color:#f5f5f7;font-size:40px;\">$260K<\u002Fdiv><div class=\"eq-l\" style=\"color:#a1a1a6;\">Sponsor &amp; ancillaries<\u002Fdiv><\u002Fdiv>\n        <div class=\"eq-arrow\">−<\u002Fdiv>\n        <div class=\"eq-step\" style=\"border-color:rgba(255,255,255,0.14);\"><div class=\"eq-n\" style=\"color:#f5f5f7;font-size:40px;\">$1.20M<\u002Fdiv><div class=\"eq-l\" style=\"color:#a1a1a6;\">Talent<\u002Fdiv><\u002Fdiv>\n        <div class=\"eq-arrow\">=<\u002Fdiv>\n        <div class=\"eq-step final\" style=\"background:linear-gradient(135deg,rgba(0,113,227,0.22),rgba(94,92,230,0.16));\"><div class=\"eq-n\" style=\"color:#5ac8fa;font-size:40px;\">$865K<\u002Fdiv><div class=\"eq-l\" style=\"color:#a1a1a6;\">before vendors, labor &amp; marketing ($355K) → <b style=\"color:#f5f5f7;\">$510K<\u002Fb> projected<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px;\">\n        <div class=\"ik-tile\"><div class=\"k\">Box office settlement<\u002Fdiv><div class=\"v\" style=\"font-size:28px;\">$2.40M<\u002Fdiv><div class=\"s\">Venue's ticket report vs. ticketing platform report — matched line by line, automatically.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-tile\"><div class=\"k\">Venue obligations · $310K<\u002Fdiv><div class=\"v\" style=\"font-size:28px;\">Rent $220K<\u002Fdiv><div class=\"s\">+ facility &amp; staffing fees $60K + ancillary share $30K — each its own obligation with its own due date.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-tile\"><div class=\"k\">Deposits<\u002Fdiv><div class=\"v\" style=\"font-size:28px;\">$155K paid<\u002Fdiv><div class=\"s\">Venue deposit released T-45; balance $155K due show night alongside the artist.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-tile\"><div class=\"k\">Shared view<\u002Fdiv><div class=\"v\" style=\"font-size:28px;\">One statement<\u002Fdiv><div class=\"s\">The venue's finance team reads the same settlement object IKON does — by permission, not by email.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\">IKON interacts with venues as counterparties today. <b>On VYB, the venue's settlement and IKON's settlement are the same document.<\u002Fb> Illustrative figures.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 16 · REVENUE COMES IN -->\n  <section data-label=\"Revenue comes in\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">15<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:30px;\">\n        <span class=\"eyebrow\">Revenue comes in<\u002Fspan>\n        <h2 class=\"title\">VYB connects revenue to obligations.<\u002Fh2>\n        <p class=\"ik-lede\">Revenue doesn't land in a bank account and become an accounting problem. It enters the financial graph, where every obligation is already waiting for it.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;\">\n        <div class=\"ik-tile\" style=\"border-top:3px solid var(--accent);\"><div class=\"k\">Collected<\u002Fdiv><div class=\"v\">$2.40M<\u002Fdiv><div class=\"s\">ticket settlement · in the ledger<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-tile\" style=\"border-top:3px solid #5e5ce6;\"><div class=\"k\">Committed<\u002Fdiv><div class=\"v\">$2.15M<\u002Fdiv><div class=\"s\">all obligations · all counterparties<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-tile\" style=\"border-top:3px solid #ff9f0a;\"><div class=\"k\">Payable now<\u002Fdiv><div class=\"v\">$1.29M<\u002Fdiv><div class=\"s\">approved · not yet paid<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-tile\" style=\"border-top:3px solid #1f8a4c;\"><div class=\"k\">Available for settlement<\u002Fdiv><div class=\"v acc\">$1.54M<\u002Fdiv><div class=\"s\">collected − paid · covers every open obligation<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px;\">\n        <div class=\"ik-card\"><div class=\"h\">Real-time event liquidity intelligence<\u002Fdiv><div class=\"d\">At any hour, VYB can answer: what's in, what's owed, what's payable, and what's free — per event and across the whole calendar.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">Overlapping shows stop colliding<\u002Fdiv><div class=\"d\">Six events in one month draw on one cash position. VYB sees the sequence of inflows and due dates across all of them and flags the crunch before it happens.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px;\">\n        <div style=\"font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;\">Cash timeline · the example event · illustrative<\u002Fdiv>\n        <div class=\"ik-tl\" style=\"grid-template-columns:repeat(6,1fr);\">\n          <div class=\"t out\"><div class=\"tw\">T-45 · T-30<\u002Fdiv><div class=\"tv out\">−$860K<\u002Fdiv><div class=\"td\">Venue, production and artist deposits released on schedule.<\u002Fdiv><\u002Fdiv>\n          <div class=\"t in\"><div class=\"tw\">T-30 → T-1<\u002Fdiv><div class=\"tv in\">+$2.40M<\u002Fdiv><div class=\"td\">Ticket settlements arrive as sales close; each one lands against the event.<\u002Fdiv><\u002Fdiv>\n          <div class=\"t out\"><div class=\"tw\">Show night<\u002Fdiv><div class=\"tv out\">−$755K<\u002Fdiv><div class=\"td\">Artist balance $600K + venue balance $155K, both after final count.<\u002Fdiv><\u002Fdiv>\n          <div class=\"t out\"><div class=\"tw\">Days 1–7<\u002Fdiv><div class=\"tv out\">−$535K<\u002Fdiv><div class=\"td\">Production balance, vendors, labor agency, marketing — as invoices match.<\u002Fdiv><\u002Fdiv>\n          <div class=\"t in\"><div class=\"tw\">Days 7–30<\u002Fdiv><div class=\"tv in\">+$260K<\u002Fdiv><div class=\"td\">Sponsor activation fee $150K and merch / VIP share $110K settle in.<\u002Fdiv><\u002Fdiv>\n          <div class=\"t on\"><div class=\"tw\">Close<\u002Fdiv><div class=\"tv\">+$510K<\u002Fdiv><div class=\"td\">Net position equals projected profit — known from day one, confirmed at close.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 17 · THE EVENT LEDGER (hero) -->\n  <section data-label=\"The event ledger\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">16<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:0.72fr 1.28fr;gap:56px;flex:1;align-items:center;\">\n        <div>\n          <span class=\"eyebrow\" style=\"display:block;margin-bottom:22px;\">The event ledger<\u002Fspan>\n          <h2 class=\"title\" style=\"font-size:62px;color:#f5f5f7;\">One source of financial truth.<\u002Fh2>\n          <p style=\"font-size:23px;line-height:1.5;color:#c7c7cc;margin-top:24px;max-width:30ch;\">Every transaction is connected to the event that created it. Every figure below is derived from entries — not typed in.<\u002Fp>\n          <ul class=\"ik-list small\" style=\"margin-top:28px;\">\n            <li>Double-entry, event-scoped<\u002Fli>\n            <li>Immutable event stream underneath<\u002Fli>\n            <li>Read continuously by the agent<\u002Fli>\n            <li>Shared, by permission, with artist &amp; venue<\u002Fli>\n          <\u002Ful>\n          <div style=\"margin-top:28px;\"><span class=\"ik-tag\">Illustrative · not IKON data<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ik-ledger\">\n          <div class=\"lh\">\n            <div class=\"t\">EVENT · Arena headliner — Las Vegas<small>IKON Presents · 14,000 cap · settlement window open<\u002Fsmall><\u002Fdiv>\n            <div class=\"status live\">● Live<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"rows\">\n            <div class=\"lr\"><div class=\"k\">Revenue<small>expected · tickets + sponsor + ancillary<\u002Fsmall><\u002Fdiv><div class=\"bar\"><i style=\"width:100%\"><\u002Fi><\u002Fdiv><div class=\"v\">$2,660,000<\u002Fdiv><\u002Fdiv>\n            <div class=\"lr\"><div class=\"k\">Collected<small>settled into the ledger<\u002Fsmall><\u002Fdiv><div class=\"bar\"><i class=\"g\" style=\"width:90%\"><\u002Fi><\u002Fdiv><div class=\"v\">$2,400,000<small>90% of expected<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n            <div class=\"lr\"><div class=\"k\">Committed<small>6 obligation classes · 16 counterparties<\u002Fsmall><\u002Fdiv><div class=\"bar\"><i class=\"p\" style=\"width:81%\"><\u002Fi><\u002Fdiv><div class=\"v\">$2,150,000<small>81% of revenue<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n            <div class=\"lr\"><div class=\"k\">Paid<small>deposits released on schedule<\u002Fsmall><\u002Fdiv><div class=\"bar\"><i class=\"w\" style=\"width:32%\"><\u002Fi><\u002Fdiv><div class=\"v\">$860,000<small>40% of committed<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n            <div class=\"lr\"><div class=\"k\">Outstanding<small>approved · scheduled · unpaid<\u002Fsmall><\u002Fdiv><div class=\"bar\"><i class=\"o\" style=\"width:48.5%\"><\u002Fi><\u002Fdiv><div class=\"v\">$1,290,000<small>artist balance $600K · due show night<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n            <div class=\"lr hi\"><div class=\"k\">Available<small>collected − paid<\u002Fsmall><\u002Fdiv><div class=\"bar\"><i style=\"width:58%\"><\u002Fi><\u002Fdiv><div class=\"v\">$1,540,000<small>covers all outstanding · $250K headroom<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n            <div class=\"lr hi\"><div class=\"k\">Projected profit<small>revenue − committed · live<\u002Fsmall><\u002Fdiv><div class=\"bar\"><i style=\"width:19%\"><\u002Fi><\u002Fdiv><div class=\"v\">$510,000<small>≈ 19.2% margin<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"lf\"><span>Last entry: production change order <b>+$22,800<\u002Fb> · 14 min ago<\u002Fspan><span>Agent: <b>settlement ready<\u002Fb><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 18 · WHERE VYB BECOMES DIFFERENT -->\n  <section data-label=\"Rails vs. product\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">17<\u002Fspan>\n      <div class=\"ik-act\">Act IV · Intelligence<\u002Fdiv>\n      <div class=\"ik-state\" style=\"margin:0;\">\n        <h1 style=\"max-width:16ch;\">Payments are the rails.<br><em>Intelligence is the product.<\u002Fem><\u002Fh1>\n        <p class=\"sub\">VYB doesn't simply move money. It understands <b style=\"color:#f5f5f7;\">why<\u002Fb> the money is moving — which contract, which event, which decision — and acts on it.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ik-hchain\" style=\"margin-top:44px;\">\n        <span class=\"step acc\">Decides<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">Executes<\u002Fspan><span class=\"arr\">→<\u002Fspan><span class=\"step acc\">Settles<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"foot-tag\">VYB · AGENTIC COMMERCE<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 19 · THE VYB AGENT -->\n  <section data-label=\"The VYB agent\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">18<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:0.8fr 1.2fr;gap:56px;flex:1;align-items:center;\">\n        <div>\n          <span class=\"eyebrow\" style=\"display:block;margin-bottom:22px;\">The VYB agent<\u002Fspan>\n          <h2 class=\"title\" style=\"font-size:54px;color:#f5f5f7;\">An AI financial operator for IKON.<\u002Fh2>\n          <p style=\"font-size:23px;line-height:1.5;color:#c7c7cc;margin-top:22px;max-width:32ch;\">It reads the ledger continuously, catches what's slipping, and brings the decision to the person who owns it — with the action ready to confirm.<\u002Fp>\n          <ul class=\"ik-list small\" style=\"margin-top:26px;\">\n            <li>Persistent — watches every open event<\u002Fli>\n            <li>Proposes, then acts on confirmation<\u002Fli>\n            <li>Every answer traces to a ledger entry<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"ik-console\">\n          <div class=\"ch\"><span class=\"app-icon\">v<\u002Fspan><b>IKON Finance · vyb<\u002Fb> · Las Vegas · arena headliner · T-3 days<\u002Fdiv>\n          <div class=\"cb\">\n            <div class=\"ik-q\">What needs my attention today?<\u002Fdiv>\n            <div class=\"ik-a\"><span class=\"n\">01<\u002Fspan><span>Three vendor invoices are awaiting approval — <b>$46,200<\u002Fb>, all within budget lines.<\u002Fspan><span class=\"act\">Approve all<\u002Fspan><\u002Fdiv>\n            <div class=\"ik-a\"><span class=\"n\">02<\u002Fspan><span>The artist settlement is ready: <b>$600,000<\u002Fb> balance, contract terms met, funds available.<\u002Fspan><span class=\"act\">Schedule<\u002Fspan><\u002Fdiv>\n            <div class=\"ik-a\"><span class=\"n\">03<\u002Fspan><span>Production is <b>8% above forecast<\u002Fb> (+$22,800) after yesterday's change order.<\u002Fspan><span class=\"act warn\">Review<\u002Fspan><\u002Fdiv>\n            <div class=\"ik-a\"><span class=\"n\">04<\u002Fspan><span>You have <b>$1.54M<\u002Fb> available for settlement across this event.<\u002Fspan><\u002Fdiv>\n            <div class=\"ik-a\"><span class=\"n\">05<\u002Fspan><span>Two obligations reach their due date within 72 hours — venue balance and labor agency.<\u002Fspan><span class=\"act\">Queue<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\">Illustrative conversation on the example event.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 20 · ASK THE BUSINESS -->\n  <section data-label=\"Ask the business\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">19<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:34px;\">\n        <span class=\"eyebrow\">Ask the business<\u002Fspan>\n        <h2 class=\"title\">The financial system becomes conversational.<\u002Fh2>\n        <p class=\"ik-lede\">Instead of navigating dashboards, IKON asks. Every answer is computed from the ledger at the moment of the question.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-content:start;flex:0 0 auto;gap:16px;\">\n        <div class=\"ik-card\"><div class=\"h\">\"How did the event perform?\"<\u002Fdiv><div class=\"d\">Revenue vs. expected, margin vs. forecast, variance by line — for one show or the whole quarter.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">\"What do we still owe?\"<\u002Fdiv><div class=\"d\">Every open obligation, by counterparty and due date, across every open event.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">\"What has been paid?\"<\u002Fdiv><div class=\"d\">Every settled entry, with the rail, the approval, and the document that authorized it.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">\"What is our projected margin?\"<\u002Fdiv><div class=\"d\">Live, and recomputed on every entry — a change order moves the number the minute it's approved.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">\"Which vendors are outstanding?\"<\u002Fdiv><div class=\"d\">Who's been invoiced, who hasn't, who's late — and who's late on every show.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">\"Can we settle the artist today?\"<\u002Fdiv><div class=\"d\">Terms met, count final, funds available: yes. And the settlement is queued for one confirmation.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ik-console\" style=\"margin-top:18px;background:#0b0b0d;\">\n        <div class=\"ch\"><span class=\"app-icon\">v<\u002Fspan><b>IKON Finance · vyb<\u002Fb> · asked on the example event · T-2 days<\u002Fdiv>\n        <div class=\"cb\" style=\"padding:16px 24px;gap:10px;\">\n          <div class=\"ik-q\" style=\"font-size:19px;\">What is our projected margin on Las Vegas, and what moved it?<\u002Fdiv>\n          <div class=\"ik-a\" style=\"font-size:17.5px;\"><span class=\"n\">A<\u002Fspan><span><b>$510,000 · 19.2%<\u002Fb>. Down <b>$22,800<\u002Fb> since Tuesday: production change order CO-04 (LED wall upgrade) approved by the production lead against the production line. Revenue unchanged; sponsor and ancillary income still expected. Break-even remains at 81% of expected revenue.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:14px;\">Same agent, every seat: the promoter's desk, the tour accountant, the artist's manager — <b>each sees what they're permitted to see.<\u002Fb> Illustrative.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 21 · AGENTIC PAYMENTS -->\n  <section data-label=\"Agentic payments\">\n    <div class=\"slide dark\">\n      <span class=\"slide-num\">20<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:24px;\">\n        <span class=\"eyebrow\">Agentic payments<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:52px;\">The future is not clicking \"Pay.\"<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:50px;flex:1;align-items:center;\">\n        <div>\n          <div class=\"ik-console\">\n            <div class=\"ch\"><span class=\"app-icon\">v<\u002Fspan><b>IKON Finance · vyb<\u002Fb> · Las Vegas · show night · 01:40<\u002Fdiv>\n            <div class=\"cb\">\n              <div class=\"ik-q\">Settle all approved event obligations.<\u002Fdiv>\n              <div class=\"ik-a\"><span class=\"n\">plan<\u002Fspan><span><b>$1,290,000<\u002Fb> across 16 payees · 2 rails. Artist balance $600K and venue balance $155K by wire; production balance $180K, 11 vendors $140K, labor agency $95K and marketing agency $120K by ACH.<\u002Fspan><\u002Fdiv>\n              <div class=\"ik-a\"><span class=\"n\">check<\u002Fspan><span>Funds available <b>$1.54M<\u002Fb> — $250K headroom after all obligations. Documentation on file for every payee. One obligation is above the multi-party threshold.<\u002Fspan><span class=\"act warn\">1 pending<\u002Fspan><\u002Fdiv>\n              <div class=\"ik-a\"><span class=\"n\">exec<\u002Fspan><span>15 of 16 executed — <b>$690,000<\u002Fb> settled, ledger updated, remittance sent to each payee. Artist balance $600,000 queued for its second signature.<\u002Fspan><span class=\"act\">Done<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size:23px;line-height:1.5;color:#c7c7cc;max-width:36ch;\">One instruction. VYB determines the rest — then executes.<\u002Fp>\n          <div class=\"ik-chips\" style=\"margin-top:22px;\">\n            <span class=\"ik-chip\">Who<\u002Fspan><span class=\"ik-chip\">How much<\u002Fspan><span class=\"ik-chip\">When<\u002Fspan><span class=\"ik-chip\">From which account<\u002Fspan><span class=\"ik-chip\">Through which rail<\u002Fspan><span class=\"ik-chip\">With what documentation<\u002Fspan><span class=\"ik-chip on\">Under what approval policy<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:19px;line-height:1.5;color:#8e8e93;margin-top:22px;max-width:40ch;\">Every step is a ledger entry. Every entry is auditable. Illustrative figures.<\u002Fp>\n
