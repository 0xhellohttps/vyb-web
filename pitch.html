<style>
:root{color-scheme:light dark;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.card{width:min(92vw,420px);text-align:center;padding:24px}

h1{font-family:var(--sys);font-size:24px;font-weight:600;letter-spacing:-.4px;margin-bottom:8px}
p{font-size:12.5px;color:var(--sec);line-height:1.6;margin-bottom:22px}
form{display:flex;flex-direction:column;gap:10px}
input{font-family:var(--mono);font-size:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);text-align:center;outline:none;transition:border-color .2s}
input:focus{border-color:var(--acc)}
button{font-family:var(--mono);font-size:13px;font-weight:600;padding:12px;border:none;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.8} button:disabled{opacity:.5;cursor:default}
.err{color:#c93a2e;font-size:11.5px;min-height:16px;margin-top:10px}
.foot{margin-top:26px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ter)}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
async function keyFromPass(pass) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iters, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function show(key) {
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.nonce)}, key, b64(P.ct));
  const doc = new TextDecoder().decode(pt);
  document.open(); document.write(doc); document.close();
}
async function tryPass(pass, silent) {
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; if (!silent) err.textContent = 'Unlocking\u2026';
  try {
    const key = await keyFromPass(pass);
    try { sessionStorage.setItem('vyb-site-k', b64e(await crypto.subtle.exportKey('raw', key))); } catch (e) {}
    await show(key);
  } catch (e) { go.disabled = false; err.textContent = silent ? '' : 'Wrong passphrase.'; }
}
document.getElementById('f').addEventListener('submit', ev => {
  ev.preventDefault(); tryPass(document.getElementById('pw').value.trim(), false);
});
(async () => {
  try {
    const saved = sessionStorage.getItem('vyb-site-k');
    if (!saved) return;
    const key = await crypto.subtle.importKey('raw', b64(saved), {name:'AES-GCM'}, true, ['decrypt']);
    await show(key);
  } catch (e) {}
})();
