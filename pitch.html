     <div class=\"flow-chip\">POS<\u002Fdiv>\n          <div class=\"flow-chip\">Ticketing<\u002Fdiv>\n          <div class=\"flow-chip\">Calendar<\u002Fdiv>\n          <div class=\"flow-chip\">Deal terms<\u002Fdiv>\n          <div class=\"flow-chip\">Labor<\u002Fdiv>\n          <div class=\"flow-chip\">Vendors<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"flow-arrow\">↓<\u002Fdiv>\n        <div class=\"flow-bar\"><div class=\"fb-t\">VYB · Intelligence Engine<\u002Fdiv><div class=\"fb-s\">One record of the room &mdash; every feed joined, every finding traced back to the line it came from<\u002Fdiv><\u002Fdiv>\n        <div class=\"flow-cap\">One engine · a different finding for every seat<\u002Fdiv>\n        <div class=\"agent-quad\">\n          <div class=\"agent\">\n            <div class=\"aseat\">Operator<\u002Fdiv>\n            <div class=\"ak\">You're comping more than you think<\u002Fdiv>\n            <div class=\"ad\">$0 tabs on guest-list nights are reading as voids &mdash; the scan and the tab were never joined.<\u002Fdiv>\n            <div class=\"an\">needs POS + ticketing<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"agent\">\n            <div class=\"aseat\">Artist<\u002Fdiv>\n            <div class=\"ak\">This room settles 4 days late &mdash; price it in<\u002Fdiv>\n            <div class=\"ad\">The memo says net-7; the settlement record says net-11. Same guarantee, worth less.<\u002Fdiv>\n            <div class=\"an\">needs settlement + deal terms<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"agent\">\n            <div class=\"aseat\">Manager<\u002Fdiv>\n            <div class=\"ak\">Three rooms on the fall run pay past terms<\u002Fdiv>\n            <div class=\"ad\">Build the lag into the advance model before the routing is committed.<\u002Fdiv>\n            <div class=\"an\">needs settlement + calendar<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"agent\">\n            <div class=\"aseat\">Booking agent<\u002Fdiv>\n            <div class=\"ak\">Midweek holds priced off weekend comps<\u002Fdiv>\n            <div class=\"ad\">The rooms accepting fastest are the ones where the Tue/Wed ask sits under band.<\u002Fdiv>\n            <div class=\"an\">needs calendar + deal terms<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"flow-bar blind\"><div class=\"fb-t\">The honest half · what it cannot see<\u002Fdiv><div class=\"fb-s\">A room with no ticketing feed has findings that stay undetectable. VYB reports its own blind spots instead of scoring the room as if the data were complete &mdash; which is what makes the rest of it credible.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Autonomous back office\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:18px;\">\n        <span class=\"eyebrow\">The operating system · autonomous<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:46px;\">Back offices talk to back offices. Ours run themselves.<\u002Fh2>\n        <p style=\"font-size:23px;line-height:1.5;color:#c7c7cc;max-width:84ch;margin-top:12px;\">Every counterparty on VYB gets a finance agent. The venue's agent and the vendor's agent exchange the invoice, match it to the contract, reconcile it against the ledger and queue the payout — no email, no spreadsheet, no chasing. Humans set the policy and tap the money.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:18px 20px;display:grid;grid-template-columns:170px 1fr 150px;gap:16px;align-items:center;\">\n          <div><div style=\"font-size:19px;font-weight:600;color:#f5f5f7;margin-bottom:6px;margin-bottom:3px;\">Vendor invoice → paid<\u002Fdiv><div style=\"font-size:13px;color:#8e8e93;\">Vendor agent ⇄ Venue agent<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center;\"><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Invoice submitted<\u002Fspan><span style=\"color:#636366;font-size:14px;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Matched to contract &amp; event<\u002Fspan><span style=\"color:#636366;font-size:14px;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Reconciled to ledger<\u002Fspan><span style=\"color:#636366;font-size:14px;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Within policy → approved<\u002Fspan><span style=\"color:#636366;font-size:14px;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Payout queued · 1099 tagged<\u002Fspan><\u002Fdiv>\n          <div style=\"text-align:right;\"><div style=\"font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:#0a84ff;font-weight:600;margin-bottom:8px;margin-bottom:2px;\">Human touch<\u002Fdiv><div style=\"font-size:15px;font-weight:600;color:#30d158;\">None under policy cap<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:18px 20px;display:grid;grid-template-columns:170px 1fr 150px;gap:16px;align-items:center;\">\n          <div><div style=\"font-size:19px;font-weight:600;color:#f5f5f7;margin-bottom:6px;margin-bottom:3px;\">Artist settlement<\u002Fdiv><div style=\"font-size:13px;color:#8e8e93;\">Venue agent ⇄ Artist agent<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center;\"><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Box office &amp; deductions pulled<\u002Fspan><span style=\"color:#636366;font-size:14px;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Verified against deal memo<\u002Fspan><span style=\"color:#636366;font-size:14px;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Discrepancy surfaced line-by-line<\u002Fspan><span style=\"color:#636366;font-size:14px;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Manager confirms<\u002Fspan><span style=\"color:#636366;font-size:14px;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Paid night-of<\u002Fspan><\u002Fdiv>\n          <div style=\"text-align:right;\"><div style=\"font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:#0a84ff;font-weight:600;margin-bottom:8px;margin-bottom:2px;\">Human touch<\u002Fdiv><div style=\"font-size:15px;font-weight:600;color:#0a84ff;\">One tap<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:18px 20px;display:grid;grid-template-columns:170px 1fr 150px;gap:16px;align-items:center;\">\n          <div><div style=\"font-size:19px;font-weight:600;color:#f5f5f7;margin-bottom:6px;margin-bottom:3px;\">Sponsor revenue share<\u002Fdiv><div style=\"font-size:13px;color:#8e8e93;\">Sponsor agent ⇄ Venue agent<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center;\"><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Activation metrics read<\u002Fspan><span style=\"color:#636366;font-size:14px;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Share computed from contract<\u002Fspan><span style=\"color:#636366;font-size:14px;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Report generated<\u002Fspan><span style=\"color:#636366;font-size:14px;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Payout queued<\u002Fspan><\u002Fdiv>\n          <div style=\"text-align:right;\"><div style=\"font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:#0a84ff;font-weight:600;margin-bottom:8px;margin-bottom:2px;\">Human touch<\u002Fdiv><div style=\"font-size:15px;font-weight:600;color:#ff9f0a;\">Review the report<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px;align-items:stretch;\">\n        <div style=\"border:1px solid rgba(0,113,227,0.5);border-radius:16px;padding:18px 20px;background:rgba(0,113,227,0.07);\">\n          <div style=\"font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:#0a84ff;font-weight:600;margin-bottom:8px;\">The autonomy ladder<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap;\">\n            <span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Suggest<\u002Fspan><span style=\"color:#636366;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Draft<\u002Fspan><span style=\"color:#636366;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;\">Execute within policy<\u002Fspan><span style=\"color:#636366;\">→<\u002Fspan><span style=\"font-size:14px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:6px 11px;border-color:rgba(0,113,227,0.7);color:#f5f5f7;\">Execute &amp; report<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.5;color:#a1a1a6;margin-top:10px;\">Every agent starts at <b style=\"color:#f5f5f7;\">Suggest<\u002Fb>. Policy caps move it up the ladder — per counterparty, per amount, per workflow. Trust is earned in the ledger, not granted in a setting.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:18px 20px;\">\n          <div style=\"font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:#0a84ff;font-weight:600;margin-bottom:8px;\">Guardrails<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.5;color:#a1a1a6;\">Scoped agent identity · policy caps by role · explicit human confirm on every payment above policy · every agent action written to the ledger as an auditable event · VYB underwrites &amp; reserves the risk.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:16px;color:#8e8e93;margin-top:14px;\">The $33M night reconciles overnight because no one is emailing PDFs. <b style=\"color:#c7c7cc;\">Agent-to-agent is how the back office scales without headcount.<\u002Fb><\u002Fp>\n    <div class=\"settle-bar\" style=\"margin-top:18px;\"><div class=\"sb-mark\">v<\u002Fdiv><div><div class=\"sb-t\">The network: agents that transact with agents.<\u002Fdiv><div class=\"sb-s\">Every party runs a VYB agent — artist, venue, agency, vendor, sponsor, crew — negotiating and settling directly with one another, VYB the protocol and rails underneath. Guardrails: scoped agent identity · explicit human confirm on every payment · VYB underwrites and reserves the risk.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The ledger\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:20px;\">\n        <span class=\"eyebrow\">The ledger<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:46px;\">Designed around money movement, not tables.<\u002Fh2>\n        <p style=\"font-size:24px;line-height:1.5;color:#c7c7cc;max-width:80ch;margin-top:14px;\">Every action in a venue is a financial event — a ticket, a beer, parking, a vendor payout, a refund, a chargeback. Each one becomes an immutable event in a stream, lands in a double-entry ledger, and feeds the agent layer.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.05fr 0.95fr;gap:40px;flex:1;align-items:center;\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px;\">\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:580px;\">\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Ticket sold<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Beer sold<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Parking<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Vendor paid<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Artist paid<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Refund<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Chargeback<\u002Fspan>\n            <span style=\"font-size:15px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Settlement<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:22px;color:#636366;line-height:1;\">↓<\u002Fdiv>\n          <div style=\"width:100%;max-width:560px;text-align:center;padding:14px 26px;border-radius:14px;border:1px solid rgba(255,255,255,0.14);\">\n            <div style=\"font-size:20px;font-weight:600;color:#f5f5f7;letter-spacing:-0.01em;\">Event stream<\u002Fdiv>\n            <div style=\"font-size:15px;color:#8e8e93;margin-top:3px;\">immutable · append-only · every financial action<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:22px;color:#636366;line-height:1;\">↓<\u002Fdiv>\n          <div style=\"width:100%;max-width:560px;text-align:center;padding:16px 26px;border-radius:14px;background:var(--vyb-grad);color:#fff;box-shadow:0 14px 40px -16px rgba(0,113,227,.5);\">\n            <div style=\"font-size:21px;font-weight:600;letter-spacing:-0.01em;\">VYB Unified Ledger<\u002Fdiv>\n            <div style=\"font-size:15px;opacity:.85;margin-top:3px;\">double-entry · the source of truth<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:22px;color:#636366;line-height:1;\">↓<\u002Fdiv>\n          <div style=\"width:100%;max-width:560px;text-align:center;padding:14px 26px;border-radius:14px;background:#1d1d1f;border:1px solid rgba(255,255,255,0.1);\">\n            <div style=\"font-size:20px;font-weight:600;color:#f5f5f7;letter-spacing:-0.01em;\">Agent intelligence layer<\u002Fdiv>\n            <div style=\"font-size:15px;color:#8e8e93;margin-top:3px;\">reconcile · forecast · detect risk · optimize<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px;\">\n            <div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Double-entry, automatically<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.5;color:#a1a1a6;\">Every transaction becomes accounting the moment it happens — books that are always closed.<\u002Fdiv>\n            <div style=\"margin-top:10px;font-size:15px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;color:#8e8e93;line-height:1.6;\">Beer sale · $12<br><span style=\"color:#5ac8fa;\">Debit&nbsp;&nbsp;Cash&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$12<\u002Fspan><br><span style=\"color:#5ac8fa;\">Credit&nbsp;Concession&nbsp;Rev&nbsp;&nbsp;&nbsp;$12<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid rgba(0,113,227,0.5);border-radius:16px;padding:20px;background:rgba(0,113,227,0.07);\">\n            <div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Agent memory<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.5;color:#a1a1a6;\">Agents read the ledger continuously and write back anomalies, forecasts &amp; risk — operational knowledge that compounds show over show.<\u002Fdiv>\n            <div style=\"margin-top:10px;font-size:15px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;color:#5ac8fa;line-height:1.6;\">{ \"finding\": \"Beer inventory likely to run<br>&nbsp;&nbsp;out by 9:15 PM\", \"confidence\": 0.92 }<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:16px;color:#8e8e93;margin-top:14px;\"><b style=\"color:#c7c7cc;\">The build order is the strategy:<\u002Fb> event-driven ledger first — agents, reconciliation, forecasting, payments &amp; financing all sit on top.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Killer feature\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">16<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:32px;\">\n        <span class=\"eyebrow\">The killer feature<\u002Fspan>\n        <h2 class=\"title\">$33M, reconciled overnight.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ba\">\n        <div class=\"ba-col ba-today\">\n          <div class=\"ba-tag\">Today<\u002Fdiv>\n          <div class=\"ba-h\">A sold-out stadium night — $33M grossed across tickets, VIP, merch, F&amp;B &amp; parking.<\u002Fdiv>\n          <ul class=\"ba-mess\">\n            <li>40+ vendors &amp; contractors<\u002Fli>\n            <li>6 payment &amp; ticketing systems<\u002Fli>\n            <li>Promoter, venue &amp; tour accounting<\u002Fli>\n            <li>Dozens of spreadsheets<\u002Fli>\n          <\u002Ful>\n          <div class=\"ba-foot\">Weeks to reconcile.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ba-col ba-vyb\">\n          <div class=\"ba-tag\">With VYB<\u002Fdiv>\n          <div class=\"ba-h\">Doors close Sunday, 11:59 PM. The agent executes:<\u002Fdiv>\n          <ul class=\"ba-check\">\n            <li>Vendor revenue split<\u002Fli>\n            <li>Artist settlement<\u002Fli>\n            <li>Sponsor revenue share<\u002Fli>\n            <li>Tax allocation &amp; chargeback reserve<\u002Fli>\n            <li>Venue settlement<\u002Fli>\n          <\u002Ful>\n          <div class=\"ba-foot\">Completed overnight.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Economics\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">17<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:32px;\">\n        <span class=\"eyebrow\">The economics<\u002Fspan>\n        <h2 class=\"title\">One venue. Real volume.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"econ-eq\">\n        <div class=\"eq-step\"><div class=\"eq-n\">150<\u002Fdiv><div class=\"eq-l\">events / year at one regional venue<\u002Fdiv><\u002Fdiv>\n        <div class=\"eq-arrow\">→<\u002Fdiv>\n        <div class=\"eq-step\"><div class=\"eq-n\">$40M<\u002Fdiv><div class=\"eq-l\">gross payment volume — $20M owned acceptance + $20M payouts<\u002Fdiv><\u002Fdiv>\n        <div class=\"eq-arrow\">→<\u002Fdiv>\n        <div class=\"eq-step\"><div class=\"eq-n\">0.40<span class=\"u\">%<\u002Fspan><\u002Fdiv><div class=\"eq-l\">blended net take on GPV at scale<\u002Fdiv><\u002Fdiv>\n        <div class=\"eq-arrow\">=<\u002Fdiv>\n        <div class=\"eq-step final\"><div class=\"eq-n\">$160K<span class=\"u\"> + SaaS<\u002Fspan><\u002Fdiv><div class=\"eq-l\">per venue, per year<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"econ-foot\" style=\"margin-top:30px;\">Each venue is ~<b>$160K a year<\u002Fb> in payment facilitation, plus SaaS. Start with 10 anchor accounts, scale to ~200 operators routing their GPV through VYB, and the <b>four revenue layers<\u002Fb> stack into ~$4.5M / month:<\u002Fp>\n      <div class=\"path1m\">\n        <div class=\"path-bar\">\n          <div class=\"path-seg s1\" style=\"flex:60;\"><div class=\"pv\">$0.6M<\u002Fdiv><div class=\"pl\">Platform software<\u002Fdiv><\u002Fdiv>\n          <div class=\"path-seg s2\" style=\"flex:270;\"><div class=\"pv\">$2.7M<\u002Fdiv><div class=\"pl\">Payment facilitation<\u002Fdiv><\u002Fdiv>\n          <div class=\"path-seg s3\" style=\"flex:90;\"><div class=\"pv\">$0.9M<\u002Fdiv><div class=\"pl\">Embedded finance<\u002Fdiv><\u002Fdiv>\n          <div class=\"path-seg s4\" style=\"flex:30;\"><div class=\"pv\">$0.3M<\u002Fdiv><div class=\"pl\">Industry intelligence<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"path-total\">= <b>$4.5M / month<\u002Fb> recurring · ≈ $54M ARR<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The anchor\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:22px;\">\n        <span class=\"eyebrow\">The anchor<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:46px;\">One artist lights up the whole network.<\u002Fh2>\n        <p style=\"font-size:24px;line-height:1.5;color:#c7c7cc;max-width:80ch;margin-top:14px;\">The move isn't a celebrity endorsement. A top-tier stadium artist joins as an equity holder, an operational design partner, and VYB's first major transaction network — bringing their entire ecosystem onto the rails.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:22px;\">\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Equity holder<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#a1a1a6;\">Aligned for the long game — incentivized to grow VYB and bring others, not cash a check.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Operational design partner<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#a1a1a6;\">Their tour's real workflows shape the product — built for the hardest events from day one.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">First transaction network<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#a1a1a6;\">Their venues, vendors, crew &amp; sponsors all transact through VYB to work with them.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px 24px;background:rgba(0,113,227,0.08);\">\n        <div style=\"font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:#8e8e93;margin-bottom:8px;\">Illustrative ignition<\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.5;color:#f5f5f7;\">A <b>$33M/show, $500M+ tour<\u002Fb> routed through VYB clears the Stage-2/3 PayFac thresholds from a single anchor — onboarding its venues, vendors, crew &amp; sponsors, and seeding the data moat with the highest-signal events on earth.<\u002Fdiv>\n      <\u002Fdiv>\n    <div class=\"settle-bar\" style=\"margin-top:18px;\"><div class=\"sb-mark\">v<\u002Fdiv><div><div class=\"sb-t\">Made repeatable: VYB Pulse.<\u002Fdiv><div class=\"sb-s\">A selective annual cohort of ~3 emerging artists — $15K–$25K each in non-recoupable development capital (no royalties, masters or equity), plus rails, reconciliation, tour economics, mentorship and VYB’s network. Every artist we back plays the venues, festivals and promoters VYB intends to serve: ~150 rooms and ~$2.25M of event activity a year, and an organic reason to walk into every one of them.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Artist passport\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:18px;\">\n        <span class=\"eyebrow\">The artist passport<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:46px;\">A financial operating system for the artist.<\u002Fh2>\n        <p style=\"font-size:24px;line-height:1.5;color:#c7c7cc;max-width:80ch;margin-top:14px;\">At the center of VYB Pulse is the <b style=\"color:#f5f5f7;\">Artist Financial Passport<\u002Fb> — a continuously developing profile of an artist's career economics. Every show, tour, merch run, sponsorship and license resolves into one picture the artist and their team actually own.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:20px;\">\n        <div style=\"font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1.4px;color:#8e8e93;margin-bottom:12px;\">What the passport sees<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;\">\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Live performance<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Touring &amp; routing<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Merchandise<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Sponsorship<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Licensing<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Cash flow<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Settlement timing<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.2;color:#c7c7cc;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:8px 13px;\">Market profitability<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;\">\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">For the artist<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#a1a1a6;\">What a room really pays, which markets are profitable, and where the business is actually growing.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">For the team<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#a1a1a6;\">Routing and tour economics modeled before the offer is signed — not reconciled months after.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:20px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">For VYB<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#a1a1a6;\">The same settlement truth behind the data moat, extended down to the individual artist.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:16px;color:#8e8e93;margin-top:18px;\">Operators get the control center. Artists get the passport. <b style=\"color:#c7c7cc;\">Both run on the same ledger.<\u002Fb><\u002Fp>\n    <p class=\"ik-foot\" style=\"margin-top:18px;\"><b>How Pulse is funded:<\u002Fb> philanthropic on top, commercial underneath. Non-recoupable grants through an appropriately structured nonprofit, co-funded by sponsors, cultural institutions and philanthropic capital; VYB earns the ordinary way on the rails those careers run on. Three operating companies build one product; the foundation develops the artists who bring the next customers back to it.<\u002Fp>\n    <p class=\"ik-foot\" style=\"margin-top:14px;\"><b>Same record, other direction — pairing.<\u002Fb> For artists the engine finds the rooms worth playing: the artist’s agent asks (Midwest, six rooms, 400–800 cap, net-7, routing under 300 mi), the venue’s agent holds, counters and confirms — scored against settled truth, not reviews. One card instead of forty emails.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Privacy &amp; compliance\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Privacy &amp; compliance<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:48px;\">VYB never needs to know who the fan is. Privacy by architecture — and compliance as a product.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\"><div class=\"ik-card\"><div class=\"h\">Identity never enters VYB<\u002Fdiv><div class=\"d\">Ticketing, payments and the venue CRM stay the source of truth for who the fan is. VYB sees operational signal, aggregated and anonymous: “Section 118 · beer sales +8%”, never “John Smith bought a beer.” Same insight for the operator; most of COPPA and GDPR becomes somebody else’s problem by design.<\u002Fdiv><\u002Fdiv><div class=\"ik-card acc\"><div class=\"h\">The privacy gateway<\u002Fdiv><div class=\"d\">Every stream passes through a gateway before it reaches an agent: identities tokenized, records aggregated, noise injected — differential privacy, the same technique the largest privacy-preserving analytics systems run on. A 12-year-old attends a show; VYB receives {attendance: 1, ticket_type: GA, spend: 42}. No child data ever exists inside VYB.<\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">Compliance as a product<\u002Fdiv><div class=\"d\">Consent is captured once at purchase, stored in the VYB ledger, and inherited by every downstream system and agent — marketing allowed, location denied, sharing denied, enforced automatically. Stadiums and festivals share operational data precisely because VYB doesn’t store fan identity. Privacy posture becomes the sales pitch.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">While everyone else builds customer data platforms, VYB is the privacy-first intelligence layer for live events. The moat is settled operational truth — not a warehouse of fan PII.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Why we win\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:32px;\">\n        <span class=\"eyebrow\">Why we win<\u002Fspan>\n        <h2 class=\"title\">From the group chat to the main stage.<\u002Fh2>\n        <p style=\"font-size:26px;line-height:1.5;color:#c7c7cc;max-width:70ch;margin-top:20px;\">Ticketmaster owns the ticket, Toast &amp; Square the POS, Stripe, Adyen, Shift4 &amp; Fiserv the rails — all optimized for transaction capture. <b style=\"color:#f5f5f7;\">None own the cross-party settlement graph of a live event.<\u002Fb> VYB is optimized for financial intelligence across the whole ecosystem — a different layer of the stack. We start in that seam, get artists running on VYB every day, and grow into the events themselves.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex:1;align-content:center;\">\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\">\n          <div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">On both sides of the money<\u002Fdiv>\n          <div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">The group chat puts VYB where artists &amp; tours live; the ledger puts it where operators move money. We're the only layer in both — so demand and supply pull each other onto the network.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\">\n          <div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">Back office first, then the marquee<\u002Fdiv>\n          <div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">No fight with Ticketmaster — we own the un-owned settlement &amp; payout layer plus the mid-market's owned box office, F&amp;B &amp; merch. The core stays neutral rails every operator can trust; longer term, the artist network opens an optional path into VYB-promoted events.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\">\n          <div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">Every event deepens the moat<\u002Fdiv>\n          <div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">Each settled show adds vendors, artists &amp; venues to the network and its trust data. Switching cost, routing intelligence &amp; financing edge all compound with volume.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:17px;color:#8e8e93;margin-top:8px;margin-left:170px;\">The unfair advantage: direct relationships with major artists, promoters &amp; venues — <b style=\"color:#c7c7cc;\">distribution the incumbents can't easily replicate.<\u002Fb><\u002Fp>\n      <div class=\"footer-mark\"><span class=\"app-icon\">v<\u002Fspan> vyb<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"North star\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">18<\u002Fspan>\n      <div class=\"s-head\">\n        <span class=\"eyebrow\">North star<\u002Fspan>\n        <h2 class=\"title\">We measure confirmed catches. Then dollars moved.<\u002Fh2>\n        <p style=\"font-size:20px;line-height:1.5;color:var(--ink-2);margin-top:10px;max-width:62ch;\">The beat record leads — every catch a team confirms is intelligence no one else holds. GPV remains the endgame engine underneath.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ns\">\n        <div class=\"ns-hero\">\n          <div class=\"gpv\">GPV<\u002Fdiv>\n          <div class=\"gpv-sub\">Gross Payment Volume — how many dollars move through VYB.<\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"ns-line\">If VYB becomes the financial operating system for live events, <b>GPV becomes the engine<\u002Fb> that drives transaction fees, financing products, analytics, and enterprise value.<\u002Fp>\n        <div class=\"ns-metrics\">\n          <div class=\"m\"><div class=\"mk\">ARR<\u002Fdiv><div class=\"ms\">Recurring software revenue<\u002Fdiv><\u002Fdiv>\n          <div class=\"m\"><div class=\"mk\">Active venues<\u002Fdiv><div class=\"ms\">Rooms operating on VYB<\u002Fdiv><\u002Fdiv>\n          <div class=\"m\"><div class=\"mk\">Active festivals<\u002Fdiv><div class=\"ms\">Events run through VYB<\u002Fdiv><\u002Fdiv>\n          <div class=\"m\"><div class=\"mk\">Active vendors<\u002Fdiv><div class=\"ms\">Suppliers paid via VYB<\u002Fdiv><\u002Fdiv>\n          <div class=\"m\"><div class=\"mk\">Active artists<\u002Fdiv><div class=\"ms\">Settled through VYB<\u002Fdiv><\u002Fdiv>\n          <div class=\"m\"><div class=\"mk\">Products originated<\u002Fdiv><div class=\"ms\">Financing volume issued<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"footer-mark\"><span class=\"app-icon\">v<\u002Fspan> vyb<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The vision\">\n    <div class=\"slide dark\">\n      <div class=\"vision-wrap\">\n        <span class=\"eyebrow\">The prize<\u002Fspan>\n        <h1 style=\"font-size:92px;\">VYB isn't a music app.<br>It's the <em>financial OS<\u002Fem><br>and <em>intelligence layer<\u002Fem><br>for live events.<\u002Fh1>\n        <p style=\"font-size:24px;line-height:1.5;color:#c7c7cc;max-width:60ch;margin-top:26px;\">Can VYB run a $500M+ tour's settlements, vendor payouts, merch revenue &amp; venue reconciliation? If yes, that's a far larger company than a traditional PayFac.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"foot-tag\">VYB · FINANCIAL OS<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Closing\">\n    <div class=\"slide dark\">\n      <div class=\"close-wrap\">\n        <h1>Every booking,<br><em>one tap.<\u002Fem><\u002Fh1>\n        <p class=\"sub\">VYB is rolling out to touring teams now. The financial operating system for live events, starting in the group chat — built native for iPhone.<\u002Fp>\n        <div class=\"close-cta\"><span class=\"app-icon\" style=\"width:42px;height:42px;border-radius:10px;font-size:24px;\">v<\u002Fspan> Get early access<\u002Fdiv>\n        <p class=\"close-meta\">iPhone only · iOS 17+ · Invite code required<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"foot-tag\">vyb.app<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The founder\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:34px;display:grid;grid-template-columns:auto 1fr;gap:44px;align-ite ity consulting for businesses, protocols and foundations, and building and securing software.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\">\n          <div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">Why it matters for VYB<\u002Fdiv>\n          <div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">A financial operating system is judged on whether the money is right, every time. Ledger integrity, programmable controls and threat modeling are the starting point, not an afterthought.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"footer-mark\"><span class=\"app-icon\">v<\u002Fspan> vyb<\u002Fdiv>\n      <div class=\"foot-tag\">blake@vybapp.io &nbsp;·&nbsp; 678-548-4012<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n<\u002Fdeck-stage>\n\n<script src=\"dc950efc-437d-4f7e-ab99-2af1f7a922f8\"><\u002Fscript>\n<script src=\"7f9fccf6-4903-4aaa-bdb0-4393992d6e65\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
