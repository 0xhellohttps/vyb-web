const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pass) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(P.salt), iterations:P.iters, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.nonce)}, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
async function tryUnlock(pass, silent) {
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; if (!silent) err.textContent = 'Unlocking\u2026';
  try {
    const doc = await unlock(pass);
    try { sessionStorage.setItem('vyb-pitch-k', pass); } catch (e) {}
    document.open(); document.write(doc); document.close();
  } catch (e) {
    go.disabled = false;
    err.textContent = silent ? '' : 'Wrong passphrase.';
  }
}
document.getElementById('f').addEventListener('submit', ev => {
  ev.preventDefault();
  tryUnlock(document.getElementById('pw').value.trim(), false);
});
try {
  const saved = sessionStorage.getItem('vyb-pitch-k');
  if (saved) tryUnlock(saved, true);
} catch (e) {}
