  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

8,30,.6); font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; }\n\n  /* steps */\n  .steps4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 48px; flex: 1; align-content: center; }\n  .stp { border-top: 3px solid var(--accent); padding-top: 30px; }\n  .stp .n { font-size: 30px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }\n  .stp h3 { font-size: 34px; font-weight: 600; margin: 22px 0 16px; letter-spacing: -0.01em; }\n  .stp p { font-size: 25px; line-height: 1.5; color: var(--ink-2); }\n  .stp .code { display: inline-block; margin-top: 18px; font-size: 22px; background: rgba(0,113,227,.08); color: var(--accent); padding: 4px 14px; border-radius: 8px; }\n\n  /* features columns */\n  .feat-cols { display: grid; grid-template-columns: repeat(3,1fr); gap: 72px; flex: 1; align-content: start; margin-top: 8px; }\n  .feat-col h4 { font-size: 24px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }\n  .feat-col ul { list-style: none; }\n  .feat-col li { padding: 22px 0; border-bottom: 1px solid var(--line-soft); }\n  .feat-col li b { display: block; font-size: 27px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 6px; }\n  .feat-col li span { font-size: 21px; line-height: 1.45; color: var(--ink-2); }\n\n  /* enterprise stats */\n  .stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 0; flex: 1; align-items: center; }\n  .stat { padding: 0 64px; }\n  .stat:not(:last-child) { border-right: 1px solid var(--line); }\n  .stat:first-child { padding-left: 0; }\n  .stat .big-num { font-size: 96px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }\n  .stat .big-num .u { font-size: 42px; color: var(--accent); }\n  .stat .lab { font-size: 25px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin: 26px 0 16px; }\n nd finishes the work. Never miss a beat.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"foot-tag\">PITCH · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Problem &amp; solution\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">01<\u002Fspan>\n      <div class=\"sol\">\n        <div>\n          <span class=\"eyebrow\" style=\"display:block;margin-bottom:24px;\">The problem → the fix<\u002Fspan>\n          <h2>Touring runs on group chats.<br><em>Now the chat runs the tour.<\u002Fem><\u002Fh2>\n          <div class=\"ps-probs\">\n            <div class=\"ps-prob\"><span class=\"prob-x\">✕<\u002Fspan> Bookings live in DMs &amp; memory<\u002Fdiv>\n            <div class=\"ps-prob\"><span class=\"prob-x\">✕<\u002Fspan> Settlement lags for weeks<\u002Fdiv>\n            <div class=\"ps-prob\"><span class=\"prob-x\">✕<\u002Fspan> Disputes, chargebacks &amp; blind spots<\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"sol-sub\" style=\"margin-top:26px;\">VYB drops your vyb into the thread — a persistent agent that watches everything, proposes the next move, and acts the moment you tap confirm.<\u002Fp>\n          <div class=\"sol-points\">\n            <div class=\"sp\"><span class=\"dot\"><\u002Fspan> Books shows &amp; settles money on one tap<\u002Fdiv>\n            <div class=\"sp\"><span class=\"dot\"><\u002Fspan> Syncs every device on the tour in &lt; 0.5s<\u002Fdiv>\n            <div class=\"sp\"><span class=\"dot\"><\u002Fspan> No new app for the team to learn<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"phone\">\n          <div class=\"phone-screen\">\n            <div class=\"notch\"><\u002Fdiv>\n            <div class=\"imsg\">\n              <div class=\"imsg-head\">\n                <div class=\"imsg-avatar\">v<\u002Fdiv>\n                <div class=\"imsg-title\">Midwest Run · Tour Group<\u002Fdiv>\n                <div class=\"imsg-sub\">You, Mara, Dev, @vyb · 4 people<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"imsg-body\">\n                <div class=\"bub-name\">Mara · Manager<\u002Fdiv>\n                <div class=\"bub bub-in\">@vyb the Chicago promoter bumped their offer to $4,200 — can we take it?<\u002Fdiv>\n                <div class=\"prop\">\n                  <div class=\"prop-top\">\n                    <div class=\"prop-mark\">v<\u002Fdiv>\n                    <div>\n                      <div class=\"prop-kicker\">Booking · needs confirm<\u002Fdiv>\n                      <div class=\"prop-h\">Metro Chicago · Fri Oct 17<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div class=\"prop-rows\">\n                    <div class=\"prop-row\"><span>Guarantee<\u002Fspan><b>$4,200<\u002Fb><\u002Fdiv>\n                    <div class=\"prop-row\"><span>Deposit<\u002Fspan><b>$1,260 · 30%<\u002Fb><\u002Fdiv>\n                    <div class=\"prop-row\"><span>Routing<\u002Fspan><b>+38 mi · Milwaukee<\u002Fb><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div class=\"prop-cta\">\n                    <div class=\"prop-confirm\">✓ Confirm in app<\u002Fdiv>\n                    <div class=\"prop-later\">Hold<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"bub bub-out\">Confirmed ✓ on the calendar &amp; deposit queued.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The product\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">02<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:32px;\">\n        <span class=\"eyebrow\">How it works · the product<\u002Fspan>\n        <h2 class=\"title\">One app. From first text to settled show.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"prod-steps\">\n        <div class=\"pstep\"><span class=\"pstn\">01<\u002Fspan> Add the number<\u002Fdiv>\n        <div class=\"pstep-arrow\">→<\u002Fdiv>\n        <div class=\"pstep\"><span class=\"pstn\">02<\u002Fspan> Tag <b>@vyb<\u002Fb><\u002Fdiv>\n        <div class=\"pstep-arrow\">→<\u002Fdiv>\n        <div class=\"pstep\"><span class=\"pstn\">03<\u002Fspan> Review the card<\u002Fdiv>\n        <div class=\"pstep-arrow\">→<\u002Fdiv>\n        <div class=\"pstep\"><span class=\"pstn\">04<\u002Fspan> Confirm anywhere<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"feat-cols\">\n        <div class=\"feat-col\">\n          <h4>Booking &amp; ops<\u002Fh4>\n          <ul>\n            <li><b>iMessage Concierge<\u002Fb><span>Proposals right in the thread<\u002Fspan><\u002Fli>\n            <li><b>Bidding queue<\u002Fb><span>Holds, offers &amp; routing math<\u002Fspan><\u002Fli>\n            <li><b>Live calendar sync<\u002Fb><span>Changes write to every calendar<\u002Fspan><\u002Fli>\n            <li><b>Live map &amp; trust scores<\u002Fb><span>Crew, venues &amp; honest ratings<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"feat-col\">\n          <h4>Money<\u002Fh4>\n          <ul>\n            <li><b>Tap-to-confirm<\u002Fb><span>Every payment is a signed record<\u002Fspan><\u002Fli>\n            <li><b>The VYB Card<\u002Fb><span>Virtual cards in Apple Wallet<\u002Fspan><\u002Fli>\n            <li><b>Artist settlements<\u002Fb><span>Splits settled night-of<\u002Fspan><\u002Fli>\n            <li><b>Per-persona caps<\u002Fb><span>Spend limits by role<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"feat-col\">\n          <h4>Studio &amp; creative<\u002Fh4>\n          <ul>\n            <li><b>Studio management<\u002Fb><span>Rooms, sessions &amp; gear<\u002Fspan><\u002Fli>\n            <li><b>File sharing<\u002Fb><span>Stems &amp; sessions, scoped access<\u002Fspan><\u002Fli>\n            <li><b>Bounce version control<\u002Fb><span>Every take tracked &amp; revertible<\u002Fspan><\u002Fli>\n            <li><b>Playback<\u002Fb><span>Time-coded comments on the playhead<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"footer-mark\"><span class=\"app-icon\">v<\u002Fspan> vyb<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Product philosophy\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:24px;\">\n        <span class=\"eyebrow\">Product philosophy<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:46px;\">One user. Every service. Zero seams.<\u002Fh2>\n        <p style=\"font-size:24px;line-height:1.5;color:#c7c7cc;max-width:80ch;margin-top:14px;\">Pick a niche end user drowning in fragmentation. Aggregate every service their workflow touches into one unified layer. Deliver it through an experience so streamlined the fragmentation simply disappears.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:26px;flex-wrap:wrap;justify-content:center;\">\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;max-width:560px;justify-content:center;\">\n          <span style=\"font-size:15px;line-height:1.2;color:#a1a1a6;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Booking<\u002Fspan>\n          <span style=\"font-size:15px;line-height:1.2;color:#a1a1a6;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Calendars<\u002Fspan>\n          <span style=\"font-size:15px;line-height:1.2;color:#a1a1a6;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Payments<\u002Fspan>\n          <span style=\"font-size:15px;line-height:1.2;color:#a1a1a6;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Settlements<\u002Fspan>\n          <span style=\"font-size:15px;line-height:1.2;color:#a1a1a6;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Files &amp; stems<\u002Fspan>\n          <span style=\"font-size:15px;line-height:1.2;color:#a1a1a6;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Travel<\u002Fspan>\n          <span style=\"font-size:15px;line-height:1.2;color:#a1a1a6;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Merch<\u002Fspan>\n          <span style=\"font-size:15px;line-height:1.2;color:#a1a1a6;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:999px;padding:7px 12px;\">Accounting<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:24px;color:#636366;\">→<\u002Fspan>\n        <span style=\"font-size:19px;font-weight:600;color:#fff;background:var(--vyb-grad);border-radius:12px;padding:14px 24px;box-shadow:0 12px 32px -14px rgba(0,113,227,.55);\">VYB · one unified layer<\u002Fspan>\n        <span style=\"font-size:24px;color:#636366;\">→<\u002Fspan>\n        <span style=\"font-size:19px;font-weight:600;color:#f5f5f7;border:1px solid rgba(255,255,255,0.22);border-radius:12px;padding:14px 24px;\">One streamlined experience<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;\">\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:22px;\">\n          <div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">A niche, not a market<\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.55;color:#a1a1a6;\">The touring artist, the manager, the venue operator — users whose day runs across a dozen disconnected tools. Horizontal software ignores them. That's the opening.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:22px;\">\n          <div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">A layer, not another tool<\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.55;color:#a1a1a6;\">VYB doesn't add a thirteenth tab. It aggregates booking, money, scheduling &amp; files behind one layer — fragmentation consolidated, not rearranged.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(0,113,227,0.5);border-radius:16px;padding:22px;background:rgba(0,113,227,0.07);\">\n          <div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Experience is the adoption<\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.55;color:#a1a1a6;\">Consolidation only sticks if it feels better than what it replaces. One conversational surface, one tap to act — native, instant, Apple-grade.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:16px;color:#8e8e93;margin-top:22px;\">The same philosophy on both sides: <b style=\"color:#c7c7cc;\">the artist's group chat up front, the operator's ledger underneath.<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The vyb\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:30px;\">\n        <span class=\"eyebrow\">The agent<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:46px;\">Every seat gets its vyb.<\u002Fh2>\n        <p style=\"font-size:24px;line-height:1.5;color:#c7c7cc;max-width:78ch;margin-top:14px;\">Artist, DJ, photographer, manager, tour manager, booking agent, venue operator — one product, seven seats, each with a persistent agent scoped to that seat’s capabilities and day.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex:1;align-content:center;\"><div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\"><div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">It watches<\u002Fdiv><div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">Calendar, holds and offers, the chat, drop and PO dates — the operation’s own record, not a scraped feed.<\u002Fdiv><\u002Fdiv><div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\"><div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">It catches<\u002Fdiv><div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">The unit of value is the caught beat: surfaced with evidence, before the human noticed, with the finished next action attached.<\u002Fdiv><\u002Fdiv><div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\"><div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">It finishes<\u002Fdiv><div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">Propose → confirm → execute. The follow-up chased, the schedule moved, the paper advanced — your tap on anything consequential.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"margin-top:16px;\" class=\"ik-card acc\"><div class=\"h\">It plans — Rollout<\u002Fdiv><div class=\"d\">The campaign, planned with two vybs: the artist’s reads social sentiment, virality drivers and cultural moments; the desk’s owns money, timing and partners. Both seats sign the treatment and it compiles into owned, dated work — tasks, calendar, armed watchers, spend quotes with projected ROAS.<\u002Fdiv><\u002Fdiv>\n      <p style=\"font-size:20px;color:#a1a1a6;margin-top:26px;text-align:center;\">North-star metric: <b style=\"color:#f5f5f7;\">confirmed catches per team per week<\u002Fb> — every confirm and dismissal is a labeled data point.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Trust\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:30px;\">\n        <span class=\"eyebrow\">Trust, by architecture<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:46px;\">Autonomy is earned per action. Money never graduates.<\u002Fh2>\n        <p style=\"font-size:24px;line-height:1.5;color:#c7c7cc;max-width:78ch;margin-top:14px;\">Per action-type, per team, a vyb climbs a permission ladder as its catches are confirmed. One kind of action is floored forever.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:18px;flex:1;align-content:center;\"><div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\"><div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">01 · Suggest<\u002Fdiv><div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">The catch, with evidence. Nothing moves.<\u002Fdiv><\u002Fdiv><div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\"><div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">02 · Approve required<\u002Fdiv><div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">The vyb proposes; a human taps. <b style=\"color:#f5f5f7;\">Every money-moving action lives here, permanently.<\u002Fb><\u002Fdiv><\u002Fdiv><div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\"><div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">03 · Auto, with revert<\u002Fdiv><div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">Calendar moves, follow-ups — inside a revert window.<\u002Fdiv><\u002Fdiv><div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;\"><div style=\"font-size:24px;font-weight:600;color:#f5f5f7;margin-bottom:10px;\">04 · Auto<\u002Fdiv><div style=\"font-size:18px;line-height:1.55;color:#a1a1a6;\">Earned per action type, per team. Audited like everything else.<\u002Fdiv><\u002Fdiv><\u002Fdiv><p style=\"font-size:19px;color:#a1a1a6;margin-top:24px;text-align:center;\">Scoped capabilities per seat · disclosure carries its permission across team boundaries · append-only audit · findings disclose their own blind spots.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The moat\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">The moat<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:48px;\">Dashboards don’t compound. Agent memory, data networks and settled truth do.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;gap:16px;\"><div class=\"ik-card\"><div class=\"h\">The seat graph<\u002Fdiv><div class=\"d\">Both sides of every negotiation on one protocol — a network effect at the agent layer.<\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">Domain state<\u002Fdiv><div class=\"d\">A generalist starts from a blank browser. A vyb starts from the operation’s own record.<\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">The labeled record<\u002Fdiv><div class=\"d\">Every confirm and dismissal is a labeled example of what matters in music ops — and each act’s taste.<\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">Memory as switching cost<\u002Fdiv><div class=\"d\">The vyb that has watched your operation for a year is irreplaceable.<\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">The data network<\u002Fdiv><div class=\"d\">VYB owns the event-driven ledger underneath — every venue that connects makes forecasting, anomaly detection and the agents smarter for all the rest.<\u002Fdiv><\u002Fdiv><div class=\"ik-card acc\"><div class=\"h\">The settled truth<\u002Fdiv><div class=\"d\">The settlement layer is the only vantage that sees who actually got paid, how fast, who’s reliable and what a room really grosses. It accrues as exhaust, compounds with every show, and can’t be backfilled — underwriting, a VYB Score, and benchmarks every operator pays for.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\"><b>The front end gets us in. The rails get us the volume. The data is why we can’t be caught.<\u002Fb> None of the first four assets require owning a dollar of payment volume.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Enterprise\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">03<\u002Fspan>\n      <div class=\"s-head\">\n        <span class=\"eyebrow\">VYB for Enterprise<\u002Fspan>\n        <h2 class=\"title\">The margin lives in operations.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"stat-row\">\n        <div class=\"stat\">\n          <div class=\"big-num\">T+1<span class=\"u\"> → instant<\u002Fspan><\u002Fdiv>\n          <div class=\"lab\">Faster settlement<\u002Fdiv>\n          <p>Guarantees, deposits, and splits settle the moment a show is confirmed — not days later.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"stat\">\n          <div class=\"big-num\">100<span class=\"u\">% signed<\u002Fspan><\u002Fdiv>\n          <div class=\"lab\">Signed settlements<\u002Fdiv>\n          <p>Every payment is one explicit in-app tap — a signed settlement record. B2B disputes fall away; card chargebacks are reserved for, not assumed away.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"stat\">\n          <div class=\"big-num\">4.6<span class=\"u\"> / 5<\u002Fspan><\u002Fdiv>\n          <div class=\"lab\">Reputation<\u002Fdiv>\n          <p>Attributed-safe trust scores surface risk before load-in, and travel with the network.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;margin-bottom:56px;font-size:19px;\"><b>Business model — the intelligence is the product.<\u002Fb> The artist’s seat is free forever; teams ($59 / seat / mo, Desk Pro $149 adds Rollout), labels ($199 / act / mo, Roster OS) and managed spend (6% when the vybs execute campaign, travel and merch POs under tap-confirm) pay for the intelligence around them. Three streams, all earned before a dollar of payments infrastructure. Target pricing.<\u002Fp>\n      <div class=\"footer-mark\"><span class=\"app-icon\">v<\u002Fspan> vyb<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Market\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">04<\u002Fspan>\n      <div class=\"s-head\">\n        <span class=\"eyebrow\">Who VYBs well<\u002Fspan>\n        <h2 class=\"title\">Built for the rooms that run live events.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"mkt\">\n        <div class=\"mkt-card\"><div class=\"n\">01<\u002Fdiv><h4>Hotels<\u002Fh4><p>Residencies, lobby sets &amp; in-house events on one ledger.<\u002Fp><\u002Fdiv>\n        <div class=\"mkt-card\"><div class=\"n\">02<\u002Fdiv><h4>Hospitality groups<\u002Fh4><p>Programming across a whole portfolio of venues.<\u002Fp><\u002Fdiv>\n        <div class=\"mkt-card\"><div class=\"n\">03<\u002Fdiv><h4>Stadiums<\u002Fh4><p>High-stakes settlements &amp; payouts at arena scale.<\u002Fp><\u002Fdiv>\n        <div class=\"mkt-card\"><div class=\"n\">04<\u002Fdiv><h4>Large-scale venues<\u002Fh4><p>Holds, offers &amp; routing for a packed calendar.<\u002Fp><\u002Fdiv>\n        <div class=\"mkt-card\"><div class=\"n\">05<\u002Fdiv><h4>Restaurants<\u002Fh4><p>Talent for service &amp; private events, settled nightly.<\u002Fp><\u002Fdiv>\n        <div class=\"mkt-card\"><div class=\"n\">06<\u002Fdiv><h4>Clubs<\u002Fh4><p>DJs, deposits, night-of splits &amp; venue reputation.<\u002Fp><\u002Fdiv>\n        <div class=\"mkt-card\"><div class=\"n\">07<\u002Fdiv><h4>Booking agents<\u002Fh4><p>Hold queue &amp; offers across a whole roster.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"footer-mark\"><span class=\"app-icon\">v<\u002Fspan> vyb<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Why now\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Why now<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:46px;\">This company couldn't have been built five years ago.<\u002Fh2>\n        <p style=\"font-size:24px;line-height:1.5;color:#c7c7cc;max-width:80ch;margin-top:14px;\">The rails, the data, and the AI all arrived at once — while running a venue got harder. The infrastructure finally exists to unify venue finance.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1;align-content:center;\">\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:22px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Cashless venues are standard<\u002Fdiv><div style=\"font-size:16px;line-height:1.5;color:#a1a1a6;\">Every fan dollar is now digital — capturable as a financial event the moment it's spent.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:22px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Real-time payment rails<\u002Fdiv><div style=\"font-size:16px;line-height:1.5;color:#a1a1a6;\">RTP, FedNow &amp; instant payouts mean settlement no longer has to take days — it has to be orchestrated.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:22px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Open APIs everywhere<\u002Fdiv><div style=\"font-size:16px;line-height:1.5;color:#a1a1a6;\">Ticketing, POS &amp; banking finally expose their data — the unified ledger is now buildable.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(0,113,227,0.5);border-radius:16px;padding:22px;background:rgba(0,113,227,0.07);\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Agentic AI works<\u002Fdiv><div style=\"font-size:16px;line-height:1.5;color:#a1a1a6;\">Systems that act — reconcile, forecast, settle — not just report. The labor layer of finance is automatable for the first time.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:22px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Complexity keeps rising<\u002Fdiv><div style=\"font-size:16px;line-height:1.5;color:#a1a1a6;\">More revenue streams per event than ever — ticketing, parking, F&amp;B, merch, suites, sponsorship — each on its own system.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:22px;\"><div style=\"font-size:20px;font-weight:600;color:#f5f5f7;margin-bottom:8px;\">Lean teams, CFO mandate<\u002Fdiv><div style=\"font-size:16px;line-height:1.5;color:#a1a1a6;\">Finance teams are short-staffed and under explicit orders to automate — the buyer is already looking for this.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:16px;color:#8e8e93;margin-top:22px;\">Five years ago this was a dashboard. <b style=\"color:#c7c7cc;\">Today it can be the financial operating system.<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Architecture\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">05<\u002Fspan>\n      <div class=\"s-head\">\n        <span class=\"eyebrow\">Revenue architecture<\u002Fspan>\n        <h2 class=\"title\">Four layers. One operating system.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"arch\">\n        <div class=\"layer\">\n          <div><div class=\"lnum\">LAYER 01<\u002Fdiv><div class=\"lname\">Platform software<\u002Fdiv><\u002Fdiv>\n          <div class=\"lprod\">Artist, vendor, contract &amp; event management · settlement reporting · workflow automation<\u002Fdiv>\n          <div class=\"lrev\"><span>Subscription<\u002Fspan><span>Enterprise licensing<\u002Fspan><span>Setup fees<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"layer\">\n          <div><div class=\"lnum\">LAYER 02<\u002Fdiv><div class=\"lname\">Payment facilitation<\u002Fdiv><\u002Fdiv>\n          <div class=\"lprod\">Artist payouts, vendor &amp; contractor payments, production settlements, sponsorship disbursements<\u002Fdiv>\n          <div class=\"lrev\"><span>Processing<\u002Fspan><span>Settlement fees<\u002Fspan><span>Instant payout<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"layer\">\n          <div><div class=\"lnum\">LAYER 03<\u002Fdiv><div class=\"lname\">Embedded financial services<\u002Fdiv><\u002Fdiv>\n          <div class=\"lprod\">Vendor financing · artist advances · festival working capital · invoice financing<\u002Fdiv>\n          <div class=\"lrev\"><span>Origination<\u002Fspan><span>Interest spread<\u002Fspan><span>Revenue share<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"layer\">\n          <div><div class=\"lnum\">LAYER 04<\u002Fdiv><div class=\"lname\">Industry intelligence<\u002Fdiv><\u002Fdiv>\n          <div class=\"lprod\">Venue &amp; festival benchmarking · artist demand · operational &amp; financial insights<\u002Fdiv>\n          <div class=\"lrev\"><span>Premium data<\u002Fspan><span>Analytics packages<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"arch-note\">Each layer deepens dependency — the layers below fund the higher-margin layers above. Beneath all four sits the <b>payment router<\u002Fb>: the agent says “pay”, the router picks the rail — Stripe, ACH, cards, MPP, x402, stablecoin — and writes one ledger entry.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Flywheel\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">06<\u002Fspan>\n      <div class=\"s-head\">\n        <span class=\"eyebrow\">The flywheel<\u002Fspan>\n        <h2 class=\"title\">Every show makes the next one easier.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"fly-stage\">\n        <div class=\"fly-ring\">\n          <svg viewBox=\"0 0 640 640\" aria-hidden=\"true\">\n            <defs>\n              <marker id=\"fa\" markerWidth=\"10\" markerHeight=\"10\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#0071e3\"><\u002Fpath><\u002Fmarker>\n            <\u002Fdefs>\n            <circle cx=\"320\" cy=\"320\" r=\"232\" fill=\"none\" stroke=\"rgba(0,0,0,0.08)\" stroke-width=\"1.5\"><\u002Fcircle>\n            <path d=\"M 320 88 A 232 232 0 1 1 250 99\" fill=\"none\" stroke=\"#0071e3\" stroke-width=\"2.5\" stroke-linecap=\"round\" marker-end=\"url(#fa)\" stroke-dasharray=\"10 10\" opacity=\"0.85\"><\u002Fpath>\n          <\u002Fsvg>\n          <div class=\"fly-center\"><div class=\"t\">Compounds<br>with scale<\u002Fdiv><div class=\"s\">More volume → more data → more product.<\u002Fdiv><\u002Fdiv>\n          <div class=\"fly-node\" style=\"left:50%;top:13.5%;\"><div class=\"b\">1<\u002Fdiv><div class=\"l\">Orgs operate<br>through VYB<\u002Fdiv><\u002Fdiv>\n          <div class=\"fly-node\" style=\"left:84%;top:31.5%;\"><div class=\"b\">2<\u002Fdiv><div class=\"l\">Payments flow<br>through VYB<\u002Fdiv><\u002Fdiv>\n          <div class=\"fly-node\" style=\"left:84%;top:68.5%;\"><div class=\"b\">3<\u002Fdiv><div class=\"l\">Financial data<br>is created<\u002Fdiv><\u002Fdiv>\n          <div class=\"fly-node\" style=\"left:50%;top:86.5%;\"><div class=\"b\">4<\u002Fdiv><div class=\"l\">Financing<br>opportunities open<\u002Fdiv><\u002Fdiv>\n          <div class=\"fly-node\" style=\"left:16%;top:68.5%;\"><div class=\"b\">5<\u002Fdiv><div class=\"l\">More revenue<br>per customer<\u002Fdiv><\u002Fdiv>\n          <div class=\"fly-node\" style=\"left:16%;top:31.5%;\"><div class=\"b\">6<\u002Fdiv><div class=\"l\">Retention &amp;<br>network effects<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Go-to-market\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">07<\u002Fspan>\n      <div class=\"s-head\">\n        <span class=\"eyebrow\">Go-to-market<\u002Fspan>\n        <h2 class=\"title\">Land the operations. Then own the money.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"phases\">\n        <div class=\"phase\">\n          <div class=\"ptag\">Phase 01 <span class=\"now\">NOW<\u002Fspan><\u002Fdiv>\n          <h3>Land anchor customers<\u002Fh3>\n          <p>Get festivals, venue groups &amp; studios running their operations through VYB. Optimize for adoption, not margin.<\u002Fp>\n          <div class=\"pmodel\">\n            <div class=\"ph\">Revenue<\u002Fdiv>\n            <ul><li>$250–$2,500 / mo platform fee<\u002Fli><li>$2.5K–$25K implementation<\u002Fli><li>Annual enterprise contracts<\u002Fli><\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"phase\">\n          <div class=\"ptag\">Phase 02<\u002Fdiv>\n          <h3>Own payment flows<\u002Fh3>\n          <p>Route vendor, artist, contractor &amp; sponsor settlements through VYB and monetize transaction volume.<\u002Fp>\n          <div class=\"pmodel\">\n            <div class=\"ph\">Revenue<\u002Fdiv>\n            <ul><li>0.25%–1% of payment volume<\u002Fli><li>A $5M festival → $12.5K–$50K / yr<\u002Fli><li>Instant-payout &amp; FX fees<\u002Fli><\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"phase\">\n          <div class=\"ptag\">Phase 03<\u002Fdiv>\n          <h3>Embedded finance<\u002Fh3>\n          <p>Advance capital against contracted receivables — repaid automatically from settlement. The highest-margin layer.<\u002Fp>\n          <div class=\"pmodel\">\n            <div class=\"ph\">Revenue<\u002Fdiv>\n            <ul><li>Vendor &amp; invoice financing<\u002Fli><li>Artist advances<\u002Fli><li>Festival working capital<\u002Fli><\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"settle-bar\" style=\"margin-top:22px;margin-bottom:56px;\"><div class=\"sb-mark\">v<\u002Fdiv><div><div class=\"sb-t\">The wedge is settlement &amp; vendor payments. The launch is one show.<\u002Fdiv><div class=\"sb-s\">Clubs, theaters, mid-size festivals, venue groups, studios — own one painful workflow end-to-end. A controlled pilot proves the workflow and the ROI; a flagship show lands the whole network in a night; then expand from every node it touched. Dependency is the signal, not the buzz.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"footer-mark\"><span class=\"app-icon\">v<\u002Fspan> vyb<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Market size\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">08<\u002Fspan>\n      <div class=\"tam\">\n        <div>\n          <span class=\"eyebrow\" style=\"display:block;margin-bottom:28px;\">Market<\u002Fspan>\n          <h2 class=\"title\" style=\"font-size:50px;margin-bottom:14px;\">The TAM isn't software spend.<br>It's transaction volume.<\u002Fh2>\n          <div class=\"tam-list\">\n            <div class=\"tam-row t1\">\n              <div class=\"th\"><span class=\"tk\">TAM<\u002Fspan><span class=\"tv\">Long-term<\u002Fspan><\u002Fdiv>\n              <p>Global live entertainment &amp; music operations — hundreds of billions in annual economic activity across festivals, venues, touring, sponsorship &amp; production.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"tam-row t2\">\n              <div class=\"th\"><span class=\"tk\">SAM<\u002Fspan><span class=\"tv\">Near-term<\u002Fspan><\u002Fdiv>\n              <p>Mid-sized festivals, independent venue groups, studios &amp; regional promoters — big enough to spend, small enough to move fast.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"tam-row t3\">\n              <div class=\"th\"><span class=\"tk\">SOM<\u002Fspan><span class=\"tv\">First 3–5 years<\u002Fspan><\u002Fdiv>\n              <p>100–500 venues · 25–100 festivals · thousands of connected artists &amp; vendors routing volume through the platform.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tam-circles\">\n          <div class=\"tam-c c1\"><span>TAM<\u002Fspan><\u002Fdiv>\n          <div class=\"tam-c c2\"><span>SAM<\u002Fspan><\u002Fdiv>\n          <div class=\"tam-c c3\"><span>SOM<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Why a stadium\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">09<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:34px;\">\n        <span class=\"eyebrow\">Why a stadium<\u002Fspan>\n        <h2 class=\"title\">A small city — running for one night.<\u002Fh2>\n        <p class=\"wedge-lead\">One fan, one night: $180 ticket, $45 parking, $110 food &amp; beer, $165 merch — <b>$500 across four systems that never talk to each other.<\u002Fb> Now multiply by the room. A single event fires <b>thousands of payment relationships<\u002Fb> at once. That complexity is exactly what payments infrastructure is built to own.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"payee-grid\">\n        <div class=\"payee\"><div class=\"pk\">Vendors<\u002Fdiv><div class=\"pd\">Merch, supplies, rentals<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Sponsors<\u002Fdiv><div class=\"pd\">Activation settlements<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Food &amp; beverage<\u002Fdiv><div class=\"pd\">Concession operators<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Security<\u002Fdiv><div class=\"pd\">Contracted firms<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Parking<\u002Fdiv><div class=\"pd\">Lot operators<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Production<\u002Fdiv><div class=\"pd\">Crews &amp; staging<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Performers<\u002Fdiv><div class=\"pd\">Talent &amp; guarantees<\u002Fdiv><\u002Fdiv>\n        <div class=\"payee\"><div class=\"pk\">Temporary labor<\u002Fdiv><div class=\"pd\">Day-of staff<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"settle-bar\">\n        <div class=\"sb-mark\">v<\u002Fdiv>\n        <div><div class=\"sb-t\">Every relationship settles through one layer.<\u002Fdiv><div class=\"sb-s\">Each transaction tagged to an event, a vendor, and a contract.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The operating system\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">10<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:30px;\">\n        <span class=\"eyebrow\">The operating system<\u002Fspan>\n        <h2 class=\"title\">Operators run six systems.<br>They should run one.<\u002Fh2>\n        <p class=\"wedge-lead\">POS, processor, settlement portal, vendor payouts, accounting, reporting — six logins and a reconciliation nightmare. VYB is the financial operating system for a venue, festival or tour. <b>The PayFac is the engine underneath; the intelligence layer sits on top.<\u002Fb><\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:44px;flex:1;\">\n        <div style=\"flex:1;\">\n          <div style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--ink-2);margin-bottom:14px;\">Today · six tools<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n            <div style=\"border:1px solid rgba(0,0,0,0.12);border-radius:12px;padding:14px 16px;font-size:17px;font-weight:500;color:var(--ink);background:#fff;\">POS software<\u002Fdiv>\n            <div style=\"border:1px solid rgba(0,0,0,0.12);border-radius:12px;padding:14px 16px;font-size:17px;font-weight:500;color:var(--ink);background:#fff;\">Merchant processor<\u002Fdiv>\n            <div style=\"border:1px solid rgba(0,0,0,0.12);border-radius:12px;padding:14px 16px;font-size:17px;font-weight:500;color:var(--ink);background:#fff;\">Settlement portal<\u002Fdiv>\n            <div style=\"border:1px solid rgba(0,0,0,0.12);border-radius:12px;padding:14px 16px;font-size:17px;font-weight:500;color:var(--ink);background:#fff;\">Vendor payouts<\u002Fdiv>\n            <div style=\"border:1px solid rgba(0,0,0,0.12);border-radius:12px;padding:14px 16px;font-size:17px;font-weight:500;color:var(--ink);background:#fff;\">Accounting<\u002Fdiv>\n            <div style=\"border:1px solid rgba(0,0,0,0.12);border-radius:12px;padding:14px 16px;font-size:17px;font-weight:500;color:var(--ink);background:#fff;\">Reporting<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:46px;color:var(--accent);font-weight:300;line-height:1;\">→<\u002Fdiv>\n        <div style=\"flex:0 0 300px;\">\n          <div style=\"background:var(--vyb-grad);color:#fff;border-radius:20px;padding:36px 28px;text-align:center;box-shadow:0 18px 50px -20px rgba(0,113,227,0.5);\">\n            <div style=\"font-size:32px;font-weight:700;letter-spacing:-0.01em;\">VYB<\u002Fdiv>\n            <div style=\"font-size:17px;opacity:0.92;margin-top:6px;\">One financial operating system<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;font-size:13px;letter-spacing:0.4px;color:var(--ink-2);margin-top:14px;\">PayFac engine underneath<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Above the rails\">\n    <div class=\"slide dark\">\n      <div class=\"vision-wrap\">\n        <span class=\"eyebrow\">The position<\u002Fspan>\n        <h1>We sit <em>above<\u002Fem> the rails.<\u002Fh1>\n        <div class=\"analogy\">\n          <div class=\"analogy-row stripe\">\n            <div class=\"who\">Processors<\u002Fdiv>\n            <div class=\"what\">Stripe, Adyen &amp; banks move the money underneath.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"analogy-row vyb\">\n            <div class=\"who\"><span class=\"app-icon\">v<\u002Fspan> vyb<\u002Fdiv>\n            <div class=\"what\">owns the <b>workflow, settlement logic, relationships &amp; financial data<\u002Fb> — where the defensibility and the value compound.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"rails-note\" style=\"margin-top:30px;font-size:18px;line-height:1.5;color:#8e8e93;max-width:820px;\">Managed on these rails today, a registered Payfac at scale — the take expands as we internalize the stack.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"font-size:22px;line-height:1.5;color:#c7c7cc;max-width:70ch;margin-top:26px;\"><b style=\"color:#f5f5f7;\">The endgame: own the decisions that cause the money to move — the money layer follows.<\u002Fb> Stripe is the rail underneath, initially; the trajectory owns everything above it. The Stripe for live events — the money, the ledger, and the intelligence on top of it.<\u002Fp>\n      <div class=\"foot-tag\">VYB · FINANCIAL OS<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Payments roadmap\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">11<\u002Fspan>\n      <div class=\"s-head\">\n        <span class=\"eyebrow\">The payments roadmap<\u002Fspan>\n        <h2 class=\"title\">Layer on Stripe today.<br>Own the rails at scale.<\u002Fh2>\n        <p class=\"wedge-lead\">Margin is a timeline, not a leap — we start as a thin layer on the rails for speed and graduate to a registered Payfac as volume compounds, so the take expands at every step. <b>GPV thresholds illustrative.<\u002Fb><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"phases\">\n        <div class=\"phase\">\n          <div class=\"ptag\">Stage 01 <span class=\"now\">NOW<\u002Fspan><\u002Fdiv>\n          <h3>Layer on the rails<\u002Fh3>\n          <p>Stripe Connect &amp; Adyen for Platforms. Onboard sub-merchants, split &amp; settle — capital-light, optimize for adoption.<\u002Fp>\n          <div class=\"pmodel\">\n            <div class=\"ph\">Net take<\u002Fdiv>\n            <ul><li>~0.1–0.2% on GPV<\u002Fli><li>Provider holds registration &amp; risk<\u002Fli><li>Day one<\u002Fli><\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"phase\">\n          <div class=\"ptag\">Stage 02<\u002Fdiv>\n          <h3>Managed Payfac<\u002Fh3>\n          <p>Payfac-as-a-Service (Finix / Infinicept). VYB owns onboarding &amp; risk rules; the provider keeps the card-network registration.<\u002Fp>\n          <div class=\"pmodel\">\n            <div class=\"ph\">Net take<\u002Fdiv>\n            <ul><li>~0.25–0.4% on GPV<\u002Fli><li>Instant payouts &amp; branded onboarding<\u002Fli><li>~$25–50M GPV<\u002Fli><\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"phase\">\n          <div class=\"ptag\">Stage 03<\u002Fdiv>\n          <h3>Registered Payfac<\u002Fh3>\n          <p>Visa / Mastercard Payfac program + sponsor bank. VYB becomes the registered facilitator and merchant of record.<\u002Fp>\n          <div class=\"pmodel\">\n            <div class=\"ph\">Net take<\u002Fdiv>\n            <ul><li>~0.4%+ blended — the at-scale figure<\u002Fli><li>Embedded finance switches on<\u002Fli><li>~$75–100M+ GPV<\u002Fli><\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The moment\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:24px;\">\n        <span class=\"eyebrow\">The moment<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Fourteen months. Eleven launches. The agent-payment stack arrived.<\u002Fh2>\n        <p class=\"ik-lede\">Every major network, the two largest AI labs' partners, and the leading stablecoin builders shipped an agent-payment primitive between April 2025 and June 2026.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"ik-tl\" style=\"grid-template-columns:repeat(6,1fr);gap:14px 12px;\">\n        <div class=\"t on\"><div class=\"tw\">Apr 29 · 2025<\u002Fdiv><div class=\"tv\">Mastercard Agent Pay<\u002Fdiv><div class=\"td\">Agentic tokens; live for all US cardholders by November.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t on\"><div class=\"tw\">Apr 30 · 2025<\u002Fdiv><div class=\"tv\">Visa Intelligent Commerce<\u002Fdiv><div class=\"td\">Agent-ready cards; Trusted Agent Protocol follows Oct 14.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t on\"><div class=\"tw\">May · 2025<\u002Fdiv><div class=\"tv\">x402 · Coinbase<\u002Fdiv><div class=\"td\">HTTP 402 revived: pay-per-request in USDC.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t on\"><div class=\"tw\">Sep · 2025<\u002Fdiv><div class=\"tv\">AP2 · Google<\u002Fdiv><div class=\"td\">Signed mandates; 60+ partners incl. Mastercard, PayPal, Amex, Visa.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t on\"><div class=\"tw\">Sep 29 · 2025<\u002Fdiv><div class=\"tv\">ACP · OpenAI + Stripe<\u002Fdiv><div class=\"td\">Instant Checkout in ChatGPT; Shared Payment Tokens.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t on\"><div class=\"tw\">Jan 11 · 2026<\u002Fdiv><div class=\"tv\">UCP · Google + Shopify<\u002Fdiv><div class=\"td\">Discovery to checkout; Walmart, Target, Etsy, Visa, Mastercard, Amex.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t in\"><div class=\"tw\">Feb 11 · 2026<\u002Fdiv><div class=\"tv\">Coinbase Agentic Wallets<\u002Fdiv><div class=\"td\">Purpose-built agent wallets; TEE-isolated keys.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t in\"><div class=\"tw\">Mar 18 · 2026<\u002Fdiv><div class=\"tv\">Tempo mainnet + MPP<\u002Fdiv><div class=\"td\">Stripe + Paradigm's payments L1 and the Machine Payments Protocol, same day.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t in\"><div class=\"tw\">Apr 14 · 2026<\u002Fdiv><div class=\"tv\">Amex ACE<\u002Fdiv><div class=\"td\">Developer kit plus Agent Purchase Protection.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t in\"><div class=\"tw\">Apr 29 · 2026<\u002Fdiv><div class=\"tv\">MPP sessions<\u002Fdiv><div class=\"td\">Streaming micropayments under a pre-authorized limit.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t in\"><div class=\"tw\">Jun 10 · 2026<\u002Fdiv><div class=\"tv\">Mastercard AP4M<\u002Fdiv><div class=\"td\">Agent Pay for Machines: sub-cent, high-frequency.<\u002Fdiv><\u002Fdiv>\n        <div class=\"t\"><div class=\"tw\">Throughout<\u002Fdiv><div class=\"tv\">Swig · Squads<\u002Fdiv><div class=\"td\">Programmable wallets and stablecoin accounts for agents on Solana.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:22px;\">Dates from each company's announcement or documentation.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The stack\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">12<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:22px;\">\n        <span class=\"eyebrow\">The stack<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:48px;\">Agentic commerce has rails now. It still has no operator — six layers that stack, and VYB on top.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"arch ik-compact\" style=\"gap:8px;\">\n        <div class=\"layer\" style=\"border-left-color:#5e5ce6;background:linear-gradient(90deg,rgba(94,92,230,0.08),rgba(94,92,230,0) 60%);\"><div><div class=\"lnum\" style=\"color:#5e5ce6;\">ABOVE THE PROTOCOLS<\u002Fdiv><div class=\"lname\">VYB orchestration<\u002Fdiv><\u002Fdiv><div class=\"lprod\">Understands the objective, decides what needs paying to whom and why, picks the rail, settles to one ledger — for live events.<\u002Fdiv><div class=\"lrev\"><span style=\"color:#5e5ce6;background:rgba(94,92,230,0.1);\">Intelligence<\u002Fspan><span style=\"color:#5e5ce6;background:rgba(94,92,230,0.1);\">Agents<\u002Fspan><span style=\"color:#5e5ce6;background:rgba(94,92,230,0.1);\">Commerce graph<\u002Fspan><span style=\"color:#5e5ce6;background:rgba(94,92,230,0.1);\">Payment router<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"layer\"><div><div class=\"lnum\">LAYER 1<\u002Fdiv><div class=\"lname\">Discovery &amp; checkout<\u002Fdiv><\u002Fdiv><div class=\"lprod\">How an agent finds a product, builds a cart, and completes a purchase with a merchant.<\u002Fdiv><div class=\"lrev\"><span>ACP · OpenAI + Stripe<\u002Fspan><span>UCP · Google + Shopify<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"layer\"><div><div class=\"lnum\">LAYER 2<\u002Fdiv><div class=\"lname\">Authorization &amp; trust<\u002Fdiv><\u002Fdiv><div class=\"lprod\">Proof that a human authorized the agent, with what limits, for what cart.<\u002Fdiv><div class=\"lrev\"><span>AP2 mandates<\u002Fspan><span>Amex ACE<\u002Fspan><span>Visa Trusted Agent<\u002Fspan><span>Mastercard Agent Pay<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"layer\"><div><div class=\"lnum\">LAYER 3<\u002Fdiv><div class=\"lname\">Machine payments<\u002Fdiv><\u002Fdiv><div class=\"lprod\">Agents paying services per request or per session, without a checkout page.<\u002Fdiv><div class=\"lrev\"><span>MPP · Stripe + Tempo<\u002Fspan><span>x402 · Coinbase<\u002Fspan><span>AP4M · Mastercard<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"layer\"><div><div class=\"lnum\">LAYER 4<\u002Fdiv><div class=\"lname\">Rails &amp; settlement<\u002Fdiv><\u002Fdiv><div class=\"lprod\">Where the value actually moves and finalizes.<\u002Fdiv><div class=\"lrev\"><span>Card networks<\u002Fspan><span>Stripe · ACH<\u002Fspan><span>Tempo<\u002Fspan><span>Stablecoins<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"layer\"><div><div class=\"lnum\">LAYER 5<\u002Fdiv><div class=\"lname\">Agent wallets &amp; policy<\u002Fdiv><\u002Fdiv><div class=\"lprod\">Accounts an agent can hold, with spend limits and roles enforced by code.<\u002Fdiv><div class=\"lrev\"><span>Swig<\u002Fspan><span>Squads<\u002Fspan><span>Coinbase Agentic Wallets<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"arch-note\">The protocols know how to pay; none of them knows what a show is. VYB is <b>rail-agnostic, protocol-agnostic and invisible to the human<\u002Fb> — the operator sees a balance and approvals, never a wallet. Every layer below is a partner, and VYB is demand for all of them.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The payment router\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">13<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:20px;\">\n        <span class=\"eyebrow\">The payment router<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">The agent says \"pay $4,500.\" The router decides everything else.<\u002Fh2>\n        <p class=\"ik-lede\">Rail, settlement method, currency, authorization requirements, transaction economics, risk, reconciliation. The user never has to understand any of it.<\u002Fp>\n      <\u002Fdiv>\n      <table class=\"ik-table\" style=\"font-size:17px;\">\n        <tr><th>The payment<\u002Fth><th>Best rail today<\u002Fth><th>Protocol in play<\u002Fth><th>Why<\u002Fth><\u002Ftr>\n        <tr><td>Availability lookup · $0.25<\u002Ftd><td class=\"m\">Machine payment, per request<\u002Ftd><td><span class=\"st pd\">x402 · MPP<\u002Fspan><\u002Ftd><td class=\"m\">Cards and invoices can't do a quarter; HTTP 402 can.<\u002Ftd><\u002Ftr>\n        <tr><td>Routing &amp; audience data · streamed<\u002Ftd><td class=\"m\">Machine payment, per session<\u002Ftd><td><span class=\"st pd\">MPP sessions · AP4M<\u002Fspan><\u002Ftd><td class=\"m\">One authorized limit, many tiny charges, one reconciliation.<\u002Ftd><\u002Ftr>\n        <tr><td>Production supplies · $1,800<\u002Ftd><td class=\"m\">Card, agent-registered<\u002Ftd><td><span class=\"st pd\">ACE · Visa TAP · Agent Pay<\u002Fspan><\u002Ftd><td class=\"m\">Merchant already takes cards; the agent carries a scoped credential and purchase protection.<\u002Ftd><\u002Ftr>\n        <tr><td>Artist deposit · $6,000<\u002Ftd><td class=\"m\">ACH or wire<\u002Ftd><td><span class=\"st pd\">Stripe · bank<\u002Fspan><\u002Ftd><td class=\"m\">Counterparty wants dollars in a bank account; mandate requires approval above the cap.<\u002Ftd><\u002Ftr>\n        <tr><td>Cross-border crew payout · $2,750<\u002Ftd><td class=\"m\">Stablecoin settlement, presented as dollars<\u002Ftd><td><span class=\"st pd\">Tempo · Squads Grid<\u002Fspan><\u002Ftd><td class=\"m\">Sub-second finality, fees in stablecoins; the payee sees a balance, not a chain.<\u002Ftd><\u002Ftr>\n        <tr><td>Agent's own spending authority<\u002Ftd><td class=\"m\">Policy-enforced wallet<\u002Ftd><td><span class=\"st pd\">Swig · Coinbase Agentic Wallets<\u002Fspan><\u002Ftd><td class=\"m\">Spend limits, recurring caps and roles enforced by code, not by trust.<\u002Ftd><\u002Ftr>\n      <\u002Ftable>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Illustrative amounts. The point is the choice: every row is a different rail, and none of them is the product.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Machine payments\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Protocols · machine payments<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:48px;\">Agents paying per request and per session — the rails for the things a human could never invoice.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\"><div class=\"ik-card\"><div class=\"h\">MPP · Stripe + Tempo<\u002Fdiv><div class=\"d\">Open standard for billing agents over HTTP, March 18, 2026. Server answers 402 with a price; the agent pays and retries. Sessions (April 2026) stream micropayments under one authorized limit. 100+ services at launch incl. Anthropic, OpenAI, Shopify. <span style=\"display:block;margin-top:8px;color:#5ac8fa;\"><b style=\"color:#5ac8fa;\">VYB:<\u002Fb> client for data and services mid-workflow under a machine-spend mandate; server for VYB’s own intelligence, sold to other agents over 402.<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">x402 · Coinbase<\u002Fdiv><div class=\"d\">HTTP-native payments revived from status code 402, May 2025: USDC on Base or Solana, facilitators settle on-chain, zero protocol fees. x402 Foundation: Coinbase, Cloudflare, Google, Visa, AWS, Circle, Anthropic. 119M+ transactions by March 2026. <span style=\"display:block;margin-top:8px;color:#5ac8fa;\"><b style=\"color:#5ac8fa;\">VYB:<\u002Fb> the first machine rail on the roadmap — a tight, auto-authorized, fully logged category for lookups, data and compute.<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">Mastercard AP4M · Coinbase Agentic Wallets<\u002Fdiv><div class=\"d\">Agent Pay for Machines (June 10, 2026) brings sub-cent, high-frequency payments to the card network. Coinbase’s agentic wallets (February 2026) give agents gasless, TEE-isolated accounts. <span style=\"display:block;margin-top:8px;color:#5ac8fa;\"><b style=\"color:#5ac8fa;\">VYB:<\u002Fb> more rails behind the same router; the operator sees one entry — “Research · Saturday booking · $23.60.”<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Sources: stripe.com · mpp.dev · coinbase.com/developer-platform · Mastercard newsroom<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Authorization &amp; checkout\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Protocols · authorization &amp; checkout<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:48px;\">Proof that a human authorized the agent — and a way for the agent to buy from any merchant.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;gap:14px;\"><div class=\"ik-card\"><div class=\"h\">AP2 · Google<\u002Fdiv><div class=\"d\">September 2025, 60+ partners incl. Mastercard, PayPal, Visa, Amex. Three signed mandates — Intent, Cart, Payment — chain to answer “did the human authorize this?” <span style=\"display:block;margin-top:8px;color:#5ac8fa;\"><b style=\"color:#5ac8fa;\">VYB:<\u002Fb> our approval policy already has AP2’s shape; mandates are signed at the confirm tap and exported in AP2 form when a counterparty needs proof.<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">ACP · OpenAI + Stripe<\u002Fdiv><div class=\"d\">Agent-initiated checkout, September 29, 2025; powers Instant Checkout in ChatGPT. A Shared Payment Token scoped to one merchant and cart total — the agent never sees the card. PayPal adopted it. <span style=\"display:block;margin-top:8px;color:#5ac8fa;\"><b style=\"color:#5ac8fa;\">VYB:<\u002Fb> buy backline, hospitality and travel from any ACP merchant; sell tickets, merch and studio time to any agent.<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">UCP · Google + Shopify<\u002Fdiv><div class=\"d\">January 11, 2026 at NRF, 20+ partners incl. Walmart, Target, Etsy, Visa, Mastercard, Amex. Discovery to post-purchase, live in Google AI Mode and Gemini. <span style=\"display:block;margin-top:8px;color:#5ac8fa;\"><b style=\"color:#5ac8fa;\">VYB:<\u002Fb> a venue, festival or studio publishes a catalog fans’ agents can find and buy; VYB fulfills and settles behind the handoff.<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">Amex ACE<\u002Fdiv><div class=\"d\">April 14, 2026: Agent Registration, Account Enablement, Intent Intelligence, Payment Credentials, Cart Context — plus Agent Purchase Protection, an industry first. <span style=\"display:block;margin-top:8px;color:#5ac8fa;\"><b style=\"color:#5ac8fa;\">VYB:<\u002Fb> registered agents spend corporate Amex with intent captured, the charge protected and every purchase tagged to a show.<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">Visa Trusted Agent Protocol<\u002Fdiv><div class=\"d\">Visa Intelligent Commerce (April 30, 2025) and the Trusted Agent Protocol (October 14, 2025): merchants verify an agent’s identity before it pays. <span style=\"display:block;margin-top:8px;color:#5ac8fa;\"><b style=\"color:#5ac8fa;\">VYB:<\u002Fb> VYB agents present a verified identity and a scoped credential to the vendors that take cards and nothing else.<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">Mastercard Agent Pay<\u002Fdiv><div class=\"d\">Announced April 29, 2025; agentic tokens live for every US cardholder by November 2025; backing UCP and inside Copilot Checkout. <span style=\"display:block;margin-top:8px;color:#5ac8fa;\"><b style=\"color:#5ac8fa;\">VYB:<\u002Fb> the VYB Card — virtual cards in Apple Wallet, per-persona caps — rides the same rails with a network-issued agentic token.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">Sources: cloud.google.com · stripe.com/newsroom · developers.googleblog.com · americanexpress.com · Visa and Mastercard newsrooms<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Rails &amp; wallets\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Rails · settlement &amp; agent wallets<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:48px;\">Where the value finalizes, and the accounts an agent can hold — all plumbing, all presented as dollars.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid3\" style=\"align-items:stretch;\"><div class=\"ik-card\"><div class=\"h\">Tempo · Stripe + Paradigm<\u002Fdiv><div class=\"d\">Payments-first Layer 1; mainnet March 18, 2026 alongside MPP. ~0.6-second finality, fees paid in stablecoins, no volatile native token. Design partners incl. Visa, Shopify, OpenAI, Anthropic, Deutsche Bank, Revolut; $500M Series A at $5B. <span style=\"display:block;margin-top:8px;color:#5ac8fa;\"><b style=\"color:#5ac8fa;\">VYB:<\u002Fb> one adapter behind the router, chosen when speed and cost win — a Canadian crew paid $2,750 at 1:40 a.m., final in under a second, shown as “Paid · Friday · Main stage.”<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">Swig · onswig.com<\u002Fdiv><div class=\"d\">Self-custodial smart wallets on Solana with policies enforced on-chain — roles, spend limits, recurring caps, passkeys, sponsored gas. “Give agents scoped authority: what they can spend, where, and for how long.” <span style=\"display:block;margin-top:8px;color:#5ac8fa;\"><b style=\"color:#5ac8fa;\">VYB:<\u002Fb> a VYB agent holds a wallet whose role can only spend its category, up to its cap, for the length of the show — the autonomy ladder enforced by the account itself.<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"ik-card\"><div class=\"h\">Squads · squads.xyz<\u002Fdiv><div class=\"d\">Squads Labs: Grid (the stablecoin API for accounts, payments, cards and yield), Altitude (business account), Fuse (personal), and Squads Multisig for multi-party control of Solana assets. <span style=\"display:block;margin-top:8px;color:#5ac8fa;\"><b style=\"color:#5ac8fa;\">VYB:<\u002Fb> Grid as a rail adapter when a counterparty wants a stablecoin-native account; Multisig mirrors VYB’s two-signature tier for high-value settlements.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <p class=\"ik-foot\" style=\"margin-top:auto;\">The user authorizes dollars and the payee receives dollars. What carried them is the router’s business.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"One objective, every protocol\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:20px;\">\n        <span class=\"eyebrow\">One objective, every protocol<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">\"Book a headliner for Saturday. Budget $25,000. Optimize for ticket sales.\"<\u002Fh2>\n      <\u002Fdiv>\n      <table class=\"ik-table ik-wide\" style=\"font-size:18px;\">\n        <tr><th>Step<\u002Fth><th>What VYB does<\u002Fth><th>Protocol<\u002Fth><th>Rail<\u002Fth><th>Human<\u002Fth><\u002Ftr>\n        <tr><td>1 · Authorize<\u002Ftd><td class=\"m\">GM signs one intent: $25,000 total, $5,000 per vendor, artist over $20,000 needs approval.<\u002Ftd><td><span class=\"st pd\">AP2-shaped mandate<\u002Fspan><\u002Ftd><td class=\"m\">—<\u002Ftd><td><span class=\"st ok\">One tap<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td>2 · Research<\u002Ftd><td class=\"m\">Agent buys availability, routing math and audience data under a $40 machine-spend session.<\u002Ftd><td><span class=\"st pd\">MPP · x402<\u002Fspan><\u002Ftd><td class=\"m\">Machine payment<\u002Ftd><td><span class=\"st dm\">None<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td>3 · Negotiate<\u002Ftd><td class=\"m\">Venue agent and artist agent exchange offer, hold and terms; VYB is the protocol between them.<\u002Ftd><td><span class=\"st pd\">Agent-to-agent<\u002Fspan><\u002Ftd><td class=\"m\">—<\u002Ftd><td><span class=\"st dm\">None<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td>4 · Commit<\u002Ftd><td class=\"m\">$22,000 guarantee is over the line: the GM confirms. $6,600 deposit released.<\u002Ftd><td><span class=\"st pd\">Cart mandate<\u002Fspan><\u002Ftd><td class=\"m\">Stripe · ACH<\u002Ftd><td><span class=\"st ok\">One tap<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td>5 · Produce<\u002Ftd><td class=\"m\">Backline via an ACP checkout; hotels on the registered Amex agent; consumables on a scoped Mastercard token.<\u002Ftd><td><span class=\"st pd\">ACP · ACE · Agent Pay<\u002Fspan><\u002Ftd><td class=\"m\">Cards<\u002Ftd><td><span class=\"st dm\">None, within caps<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td>6 · Sell<\u002Ftd><td class=\"m\">Tickets and parking listed in the venue's catalog; fans' agents buy in Gemini and ChatGPT.<\u002Ftd><td><span class=\"st pd\">UCP · ACP<\u002Fspan><\u002Ftd><td class=\"m\">Cards<\u002Ftd><td><span class=\"st dm\">None<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr><td>7 · Settle<\u002Ftd><td class=\"m\">Show night: artist balance by wire; domestic crew by ACH; the Canadian lighting crew over a stablecoin rail — all as dollars.<\u002Ftd><td><span class=\"st pd\">Router policy<\u002Fspan><\u002Ftd><td class=\"m\">Wire · ACH · Tempo<\u002Ftd><td><span class=\"st wt\">Two signatures on the artist<\u002Fspan><\u002Ftd><\u002Ftr>\n        <tr class=\"tot\"><td>Ledger<\u002Ftd><td>Every step is an entry. Margin known before doors; reconciled at execution; the graph learns the show.<\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><\u002Ftr>\n      <\u002Ftable>\n      <p class=\"ik-foot\" style=\"margin-top:14px;\">Illustrative. Seven protocols, three rails, two human taps. The operator never chose any of them.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Why it works for everyone\">\n    <div class=\"slide dark\">\n      <div class=\"s-head\" style=\"margin-bottom:28px;\">\n        <span class=\"eyebrow\">Why it works for everyone<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">VYB is demand for every protocol, and dependent on none.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"ik-grid4\" style=\"align-items:stretch;\">\n        <div class=\"ik-card\"><div class=\"h\">For the protocols<\u002Fdiv><div class=\"d\">A vertical that brings real, recurring, high-value transactions — guarantees, settlements, payouts — onto rails that mostly carry shopping carts today.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">For operators<\u002Fdiv><div class=\"d\">Never choose a protocol. Never see one. Tell VYB the objective; approve at the edges; read the ledger.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card\"><div class=\"h\">For artists, crews, vendors<\u002Fdiv><div class=\"d\">Get paid on the rail you prefer — bank, card, or a stablecoin account presented as dollars — the night of the show, with the paperwork already done.<\u002Fdiv><\u002Fdiv>\n        <div class=\"ik-card acc\"><div class=\"h\">For investors<\u002Fdiv><div class=\"d\">The rails are commoditizing in public, fast. VYB owns what doesn't commoditize: the decision, the ledger and the commerce graph of live events.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"settle-bar\" style=\"margin-top:26px;\">\n        <div class=\"sb-mark\">v<\u002Fdiv>\n        <div><div class=\"sb-t\">Above the rails, between agentic software and payment solutions.<\u002Fdiv><div class=\"sb-s\">That in-between is the position — and every launch on slide 3 makes it more valuable.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"How we get there\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">14<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:24px;\">\n        <span class=\"eyebrow\">How we get there<\u002Fspan>\n        <h2 class=\"title\" style=\"font-size:50px;\">Decide, then execute, then settle. The build order is the thesis.<\u002Fh2>\n        <p class=\"ik-lede\">Each phase's gate is earned trust, not calendar time. The agent must prove it decides well before it may execute, and execute well before it may settle.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"phases\" style=\"grid-template-columns:repeat(5,1fr);\">\n        <div class=\"phase\" style=\"padding-right:28px;\"><div class=\"ptag\">Phase 0 <span class=\"now\">Now<\u002Fspan><\u002Fdiv><h3>The watching agent<\u002Fh3><p>A persistent agent in every seat: watches the operation, catches what's slipping, proposes the next move. Confirmed catches are the metric.<\u002Fp><\u002Fdiv>\n        <div class=\"phase\" style=\"padding:0 28px;\"><div class=\"ptag\">Phase 1<\u002Fdiv><h3>Payments behind the router<\u002Fh3><p>Payment Router with the first rail. Mandates with budgets, caps and thresholds signed at the confirm tap. VYB Balance.<\u002Fp><\u002Fdiv>\n        <div class=\"phase\" style=\"padding:0 28px;\"><div class=\"ptag\">Phase 2<\u002Fdiv><h3>Machine payments, multi-rail<\u002Fh3><p>x402 and MPP for the agent as buyer. AP2-shaped mandate export. ACH and card-network credentials pulled in by workflow need.<\u002Fp><\u002Fdiv>\n        <div class=\"phase\" style=\"padding:0 28px;\"><div class=\"ptag\">Phase 3<\u002Fdiv><h3>\"Handle it\"<\u002Fh3><p>One objective — talent, production, hospitality, marketing, ticketing, finance — compiled and executed end to end with humans at the mandate edges.<\u002Fp><\u002Fdiv>\n        <div class=\"phase\" style=\"padding-left:28px;\"><div class=\"ptag\">Phase 4<\u002Fdiv><h3>The network<\u002Fh3><p>Agents transacting with agents. The commerce graph as intelligence. An Agent API other protocols' agents pay into.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Intelligence layer\">\n    <div class=\"slide\">\n      <span class=\"slide-num\">15<\u002Fspan>\n      <div class=\"s-head\" style=\"margin-bottom:12px;\">\n        <span class=\"eyebrow\">The intelligence layer<\u002Fspan>\n        <h2 class=\"title\">Anyone can move the money.<br>Only one system reads the room.<\u002Fh2>\n        <p class=\"wedge-lead\" style=\"max-width:108ch;\">The POS sees the bar. The ticketer sees the door. The processor sees the batch. None of them see across the others. VYB holds every feed in one record. <b>Intelligence is how we get in the door; the rail is where it goes.<\u002Fb><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"flow\" style=\"gap:10px;\">\n        <div class=\"flow-cap\">Signal feeds · what the room already generates<\u002Fdiv>\n        <div class=\"flow-chips\">\n          <div class=\"flow-chip\">Settlement<\u002Fdiv>\n
